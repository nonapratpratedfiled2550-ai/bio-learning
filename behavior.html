<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>พฤติกรรมของสัตว์ – Interactive Biology Lab</title>
<style>
:root{--bg:#0c0a05;--panel:#19150b;--panel2:#252012;--line:#41371d;--txt:#fbf6e9;--mut:#c8bb98;--acc:#f59e0b;--acc2:#a3e635;--on:#78350f;--pri:#b45309;--sw:#4d7c0f;--deep:#100c05;--h1:#92400e;--h2:#365314;--btn:#2e2612}
*{box-sizing:border-box}
body{margin:0;font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{padding:12px 18px;background:linear-gradient(90deg,var(--h1),var(--h2));border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:12px}
header h1{font-size:19px;margin:0}header .sub{color:#f3ead2;opacity:.85;font-size:13px}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr) 370px;gap:12px;padding:12px}
@media(max-width:1280px){.grid{grid-template-columns:290px minmax(0,1fr)}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}.right .card{margin:0}}
@media(max-width:820px){.grid{grid-template-columns:1fr}.right{display:block}.right .card{margin-bottom:12px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:15px;color:var(--acc)}
.modes button{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;font:inherit;font-size:13px}
.modes button.on{background:var(--on);border-color:var(--acc)}
.ctl{margin:8px 0}.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:3px}.ctl label b{color:var(--acc2)}
input[type=range]{width:100%;accent-color:var(--acc)}
select{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--txt);margin:6px 0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.btn{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--btn);color:var(--txt);cursor:pointer;font:inherit;font-size:13px}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--pri);border-color:var(--acc)}
.switch{display:flex;background:var(--panel2);border-radius:9px;padding:3px;border:1px solid var(--line)}
.switch button{flex:1;border:0;background:transparent;color:var(--mut);padding:7px 4px;border-radius:7px;cursor:pointer;font:inherit;font-size:12px}
.switch button.on{background:var(--sw);color:#fff}
canvas{display:block;width:100%}
#main{height:470px;background:var(--deep);border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel2);border-radius:10px;padding:8px;border:1px solid var(--line)}
.stat .k{font-size:11.5px;color:var(--mut)}.stat .v{font-size:16px;font-weight:700;color:var(--acc2);margin-top:2px}
.flow{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;align-items:center}
.flow span{padding:4px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-size:11.5px;color:var(--mut)}
.flow span.on{background:var(--pri);color:#fff;border-color:var(--acc)}.flow span.done{color:var(--txt);border-color:var(--on)}.flow span.bad{background:#7f1d1d;color:#fecaca;border-color:#ef4444}
.flow i{color:var(--mut);font-style:normal;font-size:11px}
.eq{font-family:Consolas,monospace;background:var(--deep);padding:10px;border-radius:8px;border-left:4px solid var(--acc);white-space:pre-wrap;font-size:13px;margin-top:10px;line-height:1.55}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{border:1px solid var(--line);padding:4px 5px;text-align:center}th{background:var(--panel2);color:var(--acc)}
.mis{background:#2a1a10;border-color:#7b4a1e}.mis h3{color:#fbbf24}.mis p,.ana p{margin:6px 0;line-height:1.55}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:12px;margin-right:4px}
.ok{background:#14532d;color:#bbf7d0}.no{background:#7f1d1d;color:#fecaca}.mid{background:#713f12;color:#fde68a}
.chart{height:250px;background:var(--deep);border-radius:8px}
</style>
<link rel="stylesheet" href="float-lab.css">
</head>
<body>
<header><a href="index.html" style="color:#8dffc0;text-decoration:none;font-weight:700;margin-right:6px">← หน้าแรก</a><h1>🐝 พฤติกรรมของสัตว์และการตอบสนองต่อสิ่งเร้า (Animal Behavior)</h1><span class="sub">ห้องปฏิบัติการเสมือนจริง ชีววิทยา ม.4–ม.6</span></header>
<div class="grid">
<div class="left">
  <div class="card modes"><h3>เลือกโหมดการจำลอง</h3>
    <button data-mode="1" class="on">โหมด 1 : พฤติกรรมแต่กำเนิดและการตอบสนองต่อสิ่งเร้า</button>
    <button data-mode="2">โหมด 2 : รูปแบบการเรียนรู้ของสัตว์</button>
    <button data-mode="3">โหมด 3 : การสื่อสารและการเต้นระบำของผึ้ง</button>
    <button data-mode="4">โหมด 4 : พฤติกรรมทางสังคมและทฤษฎีเกม</button>
  </div>
  <div class="card"><h3>แผงควบคุมตัวแปร</h3>
    <div data-m="1">
      <div class="ctl"><label>รูปแบบการทดลอง</label><select id="exp1"><option value="kin">Kinesis – ตัวกะปิในจานความชื้น</option><option value="tax">Taxis – T-Maze (แสง / สารเคมี)</option><option value="fap">Fixed Action Pattern – ปลากัดตัวผู้กับโมเดล</option></select></div>
      <div class="ctl" id="torgBox"><label>สิ่งมีชีวิต / สิ่งเร้า</label><select id="torg"><option value="plan">พลานาเรีย + แสง (หนีแสง: −Phototaxis)</option><option value="moth">แมลงเม่า + แสง (เข้าหาแสง: +Phototaxis)</option><option value="planc">พลานาเรีย + ตับบด (เข้าหาสาร: +Chemotaxis)</option></select></div>
      <div class="ctl" id="intBox"><label><span id="intLab">ความชื้น</span> <b id="intV"></b></label><input type="range" id="int" min="0" max="100" value="85"></div>
      <div id="fapBox"><div class="ctl"><label>โมเดลสิ่งเร้า (Sign stimulus)</label><select id="model"><option value="real">รูปปลาเหมือนจริง สีเทา (Fish shape · Gray)</option><option value="redfish">รูปปลา + ท้องแดง (Fish shape · Red belly)</option><option value="redround" selected>ก้อนกลม + ท้องแดง (Round · Red belly)</option><option value="grayround">ก้อนกลมสีเทา (Round · Gray)</option></select></div>
        <div class="btns"><button class="btn" id="remove">✋ นำโมเดลออก</button><button class="btn" id="present">↪ ใส่โมเดลคืน</button></div></div>
    </div>
    <div data-m="2">
      <div class="ctl"><label>การทดลอง</label><select id="exp2"><option value="pav">Classical Conditioning – สุนัขของ Pavlov</option><option value="skin">Operant Conditioning – Skinner Box</option><option value="imp">Imprinting – ลูกห่าน (Konrad Lorenz)</option><option value="hab">Habituation – หนอนถูกแตะซ้ำ ๆ</option></select></div>
      <div id="pavBox"><div class="ctl"><label>จำนวนครั้งที่ฝึก (กระดิ่ง + อาหาร) <b id="trialsV"></b></label><input type="range" id="trials" min="0" max="50" value="0"></div>
        <label class="chk"><input type="checkbox" id="ext"> ดับสูญ: สั่นกระดิ่งโดยไม่ให้อาหาร (Extinction)</label>
        <button class="btn" id="ring" style="width:100%">🔔 ทดสอบ: สั่นกระดิ่งอย่างเดียว</button></div>
      <div id="skBox"><div class="ctl"><label>ผลที่ตามมาหลังกดคันโยก</label><select id="cons"><option value="food">รางวัล: เม็ดอาหาร (Reinforcement)</option><option value="shock">ลงโทษ: ไฟฟ้าช็อต (Punishment)</option><option value="none">ไม่มีผลใด ๆ (Extinction)</option></select></div>
        <div class="ctl"><label>ความถี่การให้ผล (ต่อการกด 1 ครั้ง) <b id="probV"></b></label><input type="range" id="prob" min="0" max="100" value="100"></div></div>
      <div id="impBox"><div class="ctl"><label>อายุลูกห่านเมื่อพบวัตถุ <b id="ageV"></b></label><input type="range" id="age" min="0" max="72" value="15"></div>
        <div class="ctl"><label>วัตถุเคลื่อนที่ที่พบเป็นอย่างแรก</label><select id="obj"><option value="man">Konrad Lorenz (มนุษย์)</option><option value="goose">แม่ห่าน</option><option value="box">กล่องที่ถูกลาก</option><option value="ball">ลูกบอลสีแดง</option></select></div></div>
      <div id="habBox"><button class="btn" id="dish" style="width:100%">⚡ ให้สิ่งเร้าใหม่ (Dishabituation)</button></div>
    </div>
    <div data-m="3">
      <div class="ctl"><label>การสื่อสาร</label><select id="exp3"><option value="bee">การเต้นระบำของผึ้ง (Round / Waggle)</option><option value="ant">ฟีโรโมนตามทางของมด (Trail pheromone)</option></select></div>
      <div id="beeBox"><div class="ctl"><label>ระยะทางถึงแหล่งอาหาร <b id="distV"></b></label><input type="range" id="dist" min="10" max="1000" value="400"></div>
        <div class="ctl"><label>มุมแหล่งอาหารเทียบกับดวงอาทิตย์ <b id="angV"></b></label><input type="range" id="ang" min="0" max="359" value="40"></div>
        <div class="ctl"><label>ช่วงเวลา (ตำแหน่งดวงอาทิตย์)</label><select id="sun"><option value="90">เช้า – ดวงอาทิตย์ทิศตะวันออก</option><option value="180">เที่ยง – ทิศใต้</option><option value="270">บ่าย – ทิศตะวันตก</option></select></div></div>
      <div id="antBox"><div class="ctl"><label>อัตราการระเหยของฟีโรโมน <b id="evapV"></b></label><input type="range" id="evap" min="0" max="100" value="25"></div>
        <label class="chk"><input type="checkbox" id="obst"> วางสิ่งกีดขวางกลางทาง</label>
        <button class="btn" id="moveFood" style="width:100%">🍯 ย้ายแหล่งอาหาร</button></div>
    </div>
    <div data-m="4">
      <div class="ctl"><label>แบบจำลอง</label><select id="exp4"><option value="hd">Hawk–Dove Game (แย่งทรัพยากร/อาณาเขต)</option><option value="kin">Kin Selection – Hamilton's Rule</option></select></div>
      <div id="hdBox"><div class="ctl"><label>คุณค่าทรัพยากร V <b id="valV"></b></label><input type="range" id="val" min="0" max="100" value="50"></div>
        <div class="ctl"><label>ต้นทุนการบาดเจ็บ C <b id="costV"></b></label><input type="range" id="cost" min="0" max="200" value="100"></div>
        <div class="ctl"><label>สัดส่วน Hawk เริ่มต้น <b id="p0V"></b></label><input type="range" id="p0" min="1" max="99" value="10"></div></div>
      <div id="kinBox"><div class="ctl"><label>ความสัมพันธ์ทางสายเลือด r</label><select id="rr"><option value="0.125">0.125 – ลูกพี่ลูกน้อง</option><option value="0.25">0.25 – หลาน / หลานน้า</option><option value="0.5" selected>0.5 – พี่น้อง / ลูก</option><option value="0.75">0.75 – ผึ้งงานพี่น้อง (Haplodiploidy)</option></select></div>
        <div class="ctl"><label>สถานการณ์</label><select id="scen"><option value="alarm">นกส่งเสียงเตือนภัย (เสี่ยงถูกล่า)</option><option value="sting">ผึ้งงานต่อยศัตรูแล้วตาย</option><option value="feed">ช่วยเลี้ยงลูกของญาติ</option></select></div>
        <div class="ctl"><label>ประโยชน์ต่อญาติ B <b id="BV"></b></label><input type="range" id="B" min="0" max="10" step="0.5" value="4"></div>
        <div class="ctl"><label>ต้นทุนของผู้เสียสละ C <b id="CcV"></b></label><input type="range" id="Cc" min="0" max="5" step="0.1" value="1.5"></div></div>
    </div>
  </div>
  <div class="card"><h3>การควบคุมการจำลอง</h3>
    <div class="btns"><button class="btn pri" id="play">▶ เล่น</button><button class="btn" id="pause">⏸ หยุด</button><button class="btn" id="reset" style="grid-column:1/-1">↺ รีเซ็ต</button></div>
    <div class="ctl" style="margin-top:12px"><label>โหมดการแสดงผล (Toggle)</label>
      <div class="switch"><button id="tgTrace" class="on">วิถีการเคลื่อนที่ (Trajectory Trace)</button><button id="tgNeural">ระบบประสาท/ต่อมไร้ท่อ (Overlay)</button></div></div>
  </div>
</div>
<div class="center"><div class="card">
  <h3 id="simTitle">หน้าจอจำลอง</h3>
  <canvas id="main"></canvas>
  <div class="stats" id="stats"></div>
  <div class="flow" id="flow"></div>
  <div class="eq" id="eq"></div>
</div></div>
<div class="right">
  <div class="card"><h3 id="chartTitle">กราฟ</h3><canvas id="chart" class="chart"></canvas><div id="tableBox" style="margin-top:8px"></div></div>
  <div class="card ana"><h3>📋 บทวิเคราะห์</h3><div id="analysis"></div></div>
  <div class="card mis"><h3>⚠️ ข้อเข้าใจคลาดเคลื่อนที่พบบ่อย</h3><div id="mis"></div></div>
</div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function fit(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const W=Math.max(1,Math.round(r.width*d)),H=Math.max(1,Math.round(r.height*d));if(c.width!==W||c.height!==H){c.width=W;c.height=H;}const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);return{g,w:r.width,h:r.height};}
function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
const FONT='"Sarabun","Leelawadee UI",Tahoma,sans-serif';
function T(g,s,x,y,col='#eef2f6',size=12,align='left',bold=false){g.fillStyle=col;g.font=(bold?'700 ':'')+size+'px '+FONT;g.textAlign=align;g.textBaseline='middle';g.fillText(s,x,y);}
function wrap(g,s,x,y,mw,lh,col,size,bold){g.font=(bold?'700 ':'')+size+'px '+FONT;const lines=[];let cur='';for(const ch of s){const t=cur+ch;if(g.measureText(t).width>mw&&cur&&!/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/.test(ch)){const sp=cur.lastIndexOf(' ');if(sp>cur.length*0.5){lines.push(cur.slice(0,sp));cur=cur.slice(sp+1)+ch;}else{lines.push(cur);cur=ch;}}else cur=t;}if(cur)lines.push(cur);lines.forEach((l,i)=>T(g,l,x,y+i*lh,col,size,'left',bold));return y+lines.length*lh;}
function arrow(g,x1,y1,x2,y2,col,lw=2,dash){g.strokeStyle=col;g.fillStyle=col;g.lineWidth=lw;g.setLineDash(dash||[]);g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.setLineDash([]);const a=Math.atan2(y2-y1,x2-x1);g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-8*Math.cos(a-0.45),y2-8*Math.sin(a-0.45));g.lineTo(x2-8*Math.cos(a+0.45),y2-8*Math.sin(a+0.45));g.closePath();g.fill();}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,sm=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
function hash(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const V=id=>+$('#'+id).value;
const S={mode:1,running:true,toggle:'trace',time:0};
function bar(g,x,y,w,h,v,col,label,txt){g.fillStyle='rgba(255,255,255,.09)';rr(g,x,y,w,h,4);g.fill();g.fillStyle=col;rr(g,x,y,w*clamp(v,0,1),h,4);g.fill();if(label)T(g,label,x,y-8,'#e7dcc0',10.5);if(txt)T(g,txt,x+w,y-8,'#fde68a',10.5,'right',true);}
function line(g,P,col,lw){g.strokeStyle=col;g.lineWidth=lw;g.lineJoin='round';g.lineCap='round';g.beginPath();P.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();}
function glow(g,x,y,r,col){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
function panel(g,x,y,w,h){g.fillStyle='rgba(20,16,8,.9)';rr(g,x,y,w,h,10);g.fill();g.strokeStyle='rgba(255,255,255,.08)';g.lineWidth=1;g.stroke();}
function flowBar(steps,cur,bad=-1){$('#flow').innerHTML=steps.map((s,i)=>`<span class="${i===bad?'bad':i===cur?'on':cur>=0&&i<cur?'done':''}">${s}</span>`).join('<i>→</i>');}
function drawNeural(g,w,h,labs,lv,title){const y=h-86,bw=(w-40-4*22)/5;panel(g,10,y-16,w-20,98);T(g,title||'วงจรการเกิดพฤติกรรม: สิ่งเร้า → หน่วยรับความรู้สึก → ระบบประสาท/ต่อมไร้ท่อ → หน่วยปฏิบัติงาน → พฤติกรรม',20,y-3,'#fde68a',10.5,'left',true);
  labs.forEach((l,i)=>{const x=20+i*(bw+22),a=clamp(lv[i],0,1);g.fillStyle=`rgba(245,158,11,${0.1+0.45*a})`;rr(g,x,y+10,bw,56,8);g.fill();g.strokeStyle=a>0.5?'#fbbf24':'#57472a';g.lineWidth=1.4;g.stroke();if(a>0.5)glow(g,x+bw/2,y+38,bw*0.6,'rgba(251,191,36,.16)');
    const p=l.split('|');T(g,p[0],x+bw/2,y+28,'#fff7e0',11,'center',true);if(p[1])T(g,p[1],x+bw/2,y+48,'#e7dcc0',9.5,'center');if(i<4)arrow(g,x+bw+3,y+38,x+bw+19,y+38,a>0.4?'#fbbf24':'#6b5a35',2);});}

/* ================= MODE 1 : INNATE ================= */
let M1;
const SGN={plan:-1,moth:1,planc:1};
const MODELS={real:{n:'ปลาเหมือนจริง สีเทา',s:'ปลาเทา',fish:true,red:false},redfish:{n:'รูปปลา + ท้องแดง',s:'ปลา+ท้องแดง',fish:true,red:true},redround:{n:'ก้อนกลม + ท้องแดง',s:'กลม+ท้องแดง',fish:false,red:true},grayround:{n:'ก้อนกลมสีเทา',s:'กลมเทา',fish:false,red:false}};
const FAPS=[['ตรวจพบ Sign stimulus',0.8],['พองเหงือก กางครีบ',1.6],['พุ่งเข้าหา',1.2],['โจมตี กัด',1.4],['ว่ายกลับที่เดิม',1.4]];
const signS=()=>{const m=MODELS[$('#model').value];return (m.red?0.82:0.12)+(m.fish?0.1:0);};

const TG={tgTrace:'trace',tgNeural:'neural'};Object.keys(TG).forEach(id=>$('#'+id).onclick=()=>{S.toggle=TG[id];Object.keys(TG).forEach(j=>$('#'+j).classList.toggle('on',j===id));updateText();});
initM1();initM2();initM3();initM4();
let last=performance.now(),accT=0;
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;const sdt=S.running?dt:0;S.time+=sdt;if(sdt>0)[null,stepM1,stepM2,stepM3,stepM4][S.mode](sdt);
  const {g,w,h}=fit($('#main'));g.clearRect(0,0,w,h);[null,drawM1,drawM2,drawM3,drawM4][S.mode](g,w,h);drawChart();accT+=dt;if(accT>0.4){accT=0;updateText();}requestAnimationFrame(loop);}
setMode(1);requestAnimationFrame(loop);
</script>
