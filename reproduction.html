<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>การสืบพันธุ์และการเจริญเติบโตของสัตว์ – Interactive Biology Lab</title>
<style>
:root{--bg:#0d0610;--panel:#1a0d1a;--panel2:#261426;--line:#4a2445;--txt:#fbeef7;--mut:#d3b4c8;--acc:#f472b6;--acc2:#fde047;--on:#831843;--pri:#be185d;--sw:#6d28d9;--deep:#10070f;--h1:#9d174d;--h2:#4c1d95;--btn:#2d1529}
*{box-sizing:border-box}
body{margin:0;font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{padding:12px 18px;background:linear-gradient(90deg,var(--h1),var(--h2));border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:12px}
header h1{font-size:19px;margin:0}header .sub{color:#fbe7f3;opacity:.85;font-size:13px}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr) 370px;gap:12px;padding:12px}
@media(max-width:1280px){.grid{grid-template-columns:290px minmax(0,1fr)}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}.right .card{margin:0}}
@media(max-width:820px){.grid{grid-template-columns:1fr}.right{display:block}.right .card{margin-bottom:12px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:15px;color:var(--acc)}
.modes button{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;font:inherit;font-size:13px}
.modes button.on{background:var(--on);border-color:var(--acc)}
.ctl{margin:8px 0}.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:3px}.ctl label b{color:var(--acc2)}
input[type=range]{width:100%;accent-color:var(--acc)}
select{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--txt);margin:6px 0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.btn{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--btn);color:var(--txt);cursor:pointer;font:inherit;font-size:13px}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--pri);border-color:var(--acc)}
.switch{display:flex;background:var(--panel2);border-radius:9px;padding:3px;border:1px solid var(--line)}
.switch button{flex:1;border:0;background:transparent;color:var(--mut);padding:7px 4px;border-radius:7px;cursor:pointer;font:inherit;font-size:12px}
.switch button.on{background:var(--sw);color:#fff}
canvas{display:block;width:100%}
#main{height:470px;background:var(--deep);border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel2);border-radius:10px;padding:8px;border:1px solid var(--line)}
.stat .k{font-size:11.5px;color:var(--mut)}.stat .v{font-size:16px;font-weight:700;color:var(--acc2);margin-top:2px}
.flow{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;align-items:center}
.flow span{padding:4px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-size:11.5px;color:var(--mut)}
.flow span.on{background:var(--pri);color:#fff;border-color:var(--acc)}.flow span.done{color:var(--txt);border-color:var(--on)}.flow span.bad{background:#7f1d1d;color:#fecaca;border-color:#ef4444}
.flow i{color:var(--mut);font-style:normal;font-size:11px}
.eq{font-family:Consolas,monospace;background:var(--deep);padding:10px;border-radius:8px;border-left:4px solid var(--acc);white-space:pre-wrap;font-size:13px;margin-top:10px;line-height:1.55}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{border:1px solid var(--line);padding:4px 5px;text-align:center}th{background:var(--panel2);color:var(--acc)}
.mis{background:#2a1020;border-color:#7b1e4a}.mis h3{color:#fbbf24}.mis p,.ana p{margin:6px 0;line-height:1.55}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:12px;margin-right:4px}
.ok{background:#14532d;color:#bbf7d0}.no{background:#7f1d1d;color:#fecaca}.mid{background:#713f12;color:#fde68a}
.chart{height:250px;background:var(--deep);border-radius:8px}
</style>
<link rel="stylesheet" href="float-lab.css">
</head>
<body>
<header><a href="index.html" style="color:#8dffc0;text-decoration:none;font-weight:700;margin-right:6px">← หน้าแรก</a><h1>🧬 ระบบสืบพันธุ์และการเจริญเติบโตของสัตว์ (Reproduction &amp; Development)</h1><span class="sub">ห้องปฏิบัติการเสมือนจริง ชีววิทยา ม.4–ม.6</span></header>
<div class="grid">
<div class="left">
  <div class="card modes"><h3>เลือกโหมดการจำลอง</h3>
    <button data-mode="1" class="on">โหมด 1 : รอบประจำเดือนและฮอร์โมนเพศ</button>
    <button data-mode="2">โหมด 2 : การสร้างเซลล์สืบพันธุ์และการปฏิสนธิ</button>
    <button data-mode="3">โหมด 3 : คลีเวจ แกสทรูเลชัน และการสร้างอวัยวะ</button>
    <button data-mode="4">โหมด 4 : ชนิดของไข่และเยื่อหุ้มตัวอ่อน</button>
  </div>
  <div class="card"><h3>แผงควบคุมตัวแปร</h3>
    <div data-m="1">
      <div class="ctl"><label>สถานการณ์</label><select id="scen"><option value="normal">รอบปกติ (ไม่ตั้งครรภ์)</option><option value="preg">มีการปฏิสนธิและฝังตัว (ตั้งครรภ์)</option></select></div>
      <div id="hcgBox"><div class="ctl"><label>ระดับ hCG สูงสุดจากตัวอ่อน <b id="hcgV"></b></label><input type="range" id="hcg" min="0" max="15000" step="5" value="5000"></div></div>
      <div class="ctl"><label>ความเร็วเวลา <b id="spdV"></b></label><input type="range" id="spd" min="0.5" max="4" step="0.5" value="1.5"></div>
      <div class="btns" style="grid-template-columns:1fr 1fr 1fr"><button class="btn" id="d0">วันที่ 0</button><button class="btn" id="d14">วันที่ 14</button><button class="btn" id="d21">วันที่ 21</button></div>
    </div>
    <div data-m="2">
      <div class="ctl"><label>การทดลอง</label><select id="exp2"><option value="gam">Spermatogenesis เทียบ Oogenesis</option><option value="fert">การปฏิสนธิ (Fertilization)</option></select></div>
      <div id="gamBox"><label class="chk"><input type="checkbox" id="fertOn" checked> มีอสุจิเข้าปฏิสนธิ (ไข่แบ่ง Meiosis II ต่อ)</label>
        <button class="btn" id="nextSt" style="width:100%">⏭ ขั้นถัดไป</button></div>
      <div id="fertBox"><div class="ctl"><label>จำนวนอสุจิที่ไปถึงไข่ <b id="nspV"></b></label><input type="range" id="nsp" min="3" max="40" value="16"></div>
        <label class="chk"><input type="checkbox" id="block" checked> กลไกกันอสุจิซ้ำ (Fast block + Cortical reaction)</label>
        <button class="btn" id="release" style="width:100%">💧 ปล่อยอสุจิชุดใหม่</button></div>
    </div>
    <div data-m="3">
      <div class="ctl"><label>สิ่งมีชีวิต</label><select id="org"><option value="human">มนุษย์ (Blastocyst · หน่วยเวลา: วัน)</option><option value="frog">กบ (Blastula · หน่วยเวลา: ชั่วโมง)</option></select></div>
      <div class="ctl"><label>ความเร็วการเจริญ <b id="spd3V"></b></label><input type="range" id="spd3" min="1" max="10" value="4"></div>
      <button class="btn" id="next3" style="width:100%">⏭ ข้ามไปขั้นถัดไป</button>
    </div>
    <div data-m="4">
      <div class="ctl"><label>หัวข้อ</label><select id="exp4"><option value="yolk">ชนิดของไข่ตามปริมาณไข่แดง</option><option value="memb">เยื่อหุ้มตัวอ่อน (Extraembryonic membranes)</option></select></div>
      <div id="yolkBox"><div class="ctl"><label>สิ่งมีชีวิต</label><select id="sp"><option value="star">ดาวทะเล</option><option value="human">มนุษย์</option><option value="frog">กบ</option><option value="bird">ไก่ / นก</option><option value="insect">แมลง</option></select></div></div>
      <div id="membBox"><div class="ctl"><label>ตัวอย่าง</label><select id="egg"><option value="bird">ไข่ไก่ (สัตว์ที่มีถุงน้ำคร่ำ วางไข่บนบก)</option><option value="human">มนุษย์ (รก – Placenta)</option></select></div>
        <div class="ctl"><label>เน้นเยื่อหุ้ม</label><select id="hl"><option value="all">แสดงทั้งหมด</option><option value="amnion">Amnion</option><option value="chorion">Chorion</option><option value="allantois">Allantois</option><option value="yolk">Yolk sac</option></select></div>
        <div class="ctl"><label>ระยะการเจริญ <b id="age4V"></b></label><input type="range" id="age4" min="0" max="100" value="55"></div></div>
    </div>
  </div>
  <div class="card"><h3>การควบคุมการจำลอง</h3>
    <div class="btns"><button class="btn pri" id="play">▶ เล่น</button><button class="btn" id="pause">⏸ หยุด</button><button class="btn" id="reset" style="grid-column:1/-1">↺ รีเซ็ต</button></div>
    <div class="ctl" style="margin-top:12px"><label>โหมดการแสดงผล (Toggle)</label>
      <div class="switch"><button id="tgLab" class="on">ป้ายชื่อ ไทย / อังกฤษ</button><button id="tgChr">จำนวนโครโมโซม / DNA</button></div></div>
  </div>
</div>
<div class="center"><div class="card">
  <h3 id="simTitle">หน้าจอจำลอง</h3>
  <canvas id="main"></canvas>
  <div class="stats" id="stats"></div>
  <div class="flow" id="flow"></div>
  <div class="eq" id="eq"></div>
</div></div>
<div class="right">
  <div class="card"><h3 id="chartTitle">กราฟ</h3><canvas id="chart" class="chart"></canvas><div id="tableBox" style="margin-top:8px"></div></div>
  <div class="card ana"><h3>📋 บทวิเคราะห์</h3><div id="analysis"></div></div>
  <div class="card mis"><h3>⚠️ ข้อเข้าใจคลาดเคลื่อนที่พบบ่อย</h3><div id="mis"></div></div>
</div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function fit(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const W=Math.max(1,Math.round(r.width*d)),H=Math.max(1,Math.round(r.height*d));if(c.width!==W||c.height!==H){c.width=W;c.height=H;}const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);return{g,w:r.width,h:r.height};}
function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
const FONT='"Sarabun","Leelawadee UI",Tahoma,sans-serif';
function T(g,s,x,y,col='#eef2f6',size=12,align='left',bold=false){g.fillStyle=col;g.font=(bold?'700 ':'')+size+'px '+FONT;g.textAlign=align;g.textBaseline='middle';g.fillText(s,x,y);}
function wrap(g,s,x,y,mw,lh,col,size,bold){g.font=(bold?'700 ':'')+size+'px '+FONT;const lines=[];let cur='';for(const ch of s){const t=cur+ch;if(g.measureText(t).width>mw&&cur&&!/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/.test(ch)){const sp=cur.lastIndexOf(' ');if(sp>cur.length*0.5){lines.push(cur.slice(0,sp));cur=cur.slice(sp+1)+ch;}else{lines.push(cur);cur=ch;}}else cur=t;}if(cur)lines.push(cur);lines.forEach((l,i)=>T(g,l,x,y+i*lh,col,size,'left',bold));return y+lines.length*lh;}
function arrow(g,x1,y1,x2,y2,col,lw=2,dash){g.strokeStyle=col;g.fillStyle=col;g.lineWidth=lw;g.setLineDash(dash||[]);g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.setLineDash([]);const a=Math.atan2(y2-y1,x2-x1);g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-8*Math.cos(a-0.45),y2-8*Math.sin(a-0.45));g.lineTo(x2-8*Math.cos(a+0.45),y2-8*Math.sin(a+0.45));g.closePath();g.fill();}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,sm=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
function hash(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const V=id=>+$('#'+id).value;
const S={mode:1,running:true,toggle:'lab',time:0};
const CHR=()=>S.toggle==='chr';
function bar(g,x,y,w,h,v,col,label,txt){g.fillStyle='rgba(255,255,255,.09)';rr(g,x,y,w,h,4);g.fill();g.fillStyle=col;rr(g,x,y,w*clamp(v,0,1),h,4);g.fill();if(label)T(g,label,x,y-8,'#ead5e3',10.5);if(txt)T(g,txt,x+w,y-8,'#fde68a',10.5,'right',true);}
function glow(g,x,y,r,col){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
function panel(g,x,y,w,h){g.fillStyle='rgba(26,10,24,.9)';rr(g,x,y,w,h,10);g.fill();g.strokeStyle='rgba(255,255,255,.08)';g.lineWidth=1;g.stroke();}
function flowBar(steps,cur,bad=-1){$('#flow').innerHTML=steps.map((s,i)=>`<span class="${i===bad?'bad':i===cur?'on':cur>=0&&i<cur?'done':''}">${s}</span>`).join('<i>→</i>');}
function lab2(g,th,en,ch,x,y,col='#fde68a',al='center'){T(g,th,x,y,col,11,al,true);T(g,CHR()&&ch?ch:en,x,y+13,'#e9d5e0',9.5,al);}
function lead(g,x1,y1,x2,y2,col){g.strokeStyle=col||'rgba(255,255,255,.45)';g.lineWidth=1;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.fillStyle=col||'rgba(255,255,255,.6)';g.beginPath();g.arc(x1,y1,2,0,7);g.fill();}
const G=(x,m,s)=>Math.exp(-((x-m)**2)/(2*s*s));

/* ================= MODE 1 : MENSTRUAL CYCLE ================= */
let M1;function initM1(){M1={d:0,cyc:1};}
function horm(d){const preg=$('#scen').value==='preg',H=V('hcg'),resc=preg&&H*(1-Math.exp(-4/3))>=25,c=resc?Math.min(d,42):((d%28)+28)%28,hg=preg&&c>=21?H*(1-Math.exp(-(c-21)/3)):0;
  let fsh=0.22+0.28*G(c,2,3)+0.28*G(c,30,3)+0.4*G(c,14,1.1),lh=0.12+0.85*G(c,14,1),e=0.12+0.7*G(c,12.5,2)+0.38*G(c,21,3.2),p=0.04+(c>14?0.88*G(c,21.5,c>21.5?2.6:3.3):0);
  if(resc&&c>21.5){const k=sm((c-21.5)/4);p=0.92+0.04*k;e=Math.min(0.85,0.495+0.012*(c-21.5));fsh=lerp(0.22,0.1,k);lh=lerp(0.12,0.07,k);}
  let th;if(c<5)th=lerp(10,1.5,sm(c/5));else if(c<14)th=lerp(1.5,8,(c-5)/9);else if(resc)th=lerp(8,14,clamp((c-14)/20,0,1));else if(c<25)th=lerp(8,11,(c-14)/11);else th=lerp(11,10,(c-25)/3);
  return{c,fsh,lh,e,p,hg,resc,preg,th};}
function phase(H){const c=H.c;if(c<5)return[0,'ระยะมีประจำเดือน (Menstrual phase)'];if(c<13.3)return[1,'ระยะฟอลลิเคิล (Follicular / Proliferative)'];if(c<15)return[2,'ตกไข่ (Ovulation)'];if(H.resc&&c>=21)return[4,'ตั้งครรภ์: hCG รักษา Corpus luteum'];return[3,'ระยะลูเทียล (Luteal / Secretory)'];}
function stepM1(dt){M1.d+=dt*V('spd');const H=horm(M1.d);if(!H.resc&&M1.d>=28){M1.d-=28;M1.cyc++;}if(H.resc&&M1.d>42)M1.d=42;}
function drawOvary(g,x,y,H){const c=H.c;g.fillStyle='#5b2240';g.beginPath();g.ellipse(x,y,88,66,0,0,7);g.fill();g.strokeStyle='#9d4a74';g.lineWidth=2;g.stroke();
  for(let i=0;i<16;i++){const a=hash(i)*6.28,r=30+hash(i+20)*48,px=x+Math.cos(a)*r*0.95,py=y+Math.sin(a)*r*0.68;if(Math.hypot(px-x-16,py-y)<46)continue;g.fillStyle='rgba(253,230,138,.5)';g.beginPath();g.arc(px,py,3,0,7);g.fill();}
  const fx=x+16,fy=y;let th='',en='',cs='';
  if(c<13.6){const r=8+30*sm(c/13.6);g.fillStyle='#fcd34d';g.beginPath();g.arc(fx,fy,r,0,7);g.fill();if(c>5){const ar=r*0.62*sm((c-5)/5);g.fillStyle='#fef3c7';g.beginPath();g.arc(fx+r*0.15,fy,ar,0,7);g.fill();}
    const or=clamp(r*0.4,4,7),ox=c>5?fx-r*0.55:fx;g.fillStyle='#fdf2f8';g.beginPath();g.arc(ox,fy,or,0,7);g.fill();g.fillStyle='#be185d';g.beginPath();g.arc(ox,fy,1.8,0,7);g.fill();
    [th,en]=c<4?['ฟอลลิเคิลปฐมภูมิ','Primary follicle']:c<9?['ฟอลลิเคิลทุติยภูมิ','Secondary follicle']:['ฟอลลิเคิลเจริญเต็มที่','Graafian follicle'];cs='Primary oocyte 2n·4c หยุดที่ Prophase I';}
  else if(c<15.5){const k=sm((c-13.6)/1.9);g.fillStyle='#fcd34d';g.beginPath();g.arc(fx,fy,38,-0.3,5.9);g.fill();g.fillStyle='#5b2240';g.beginPath();g.arc(fx+30,fy-12,10,0,7);g.fill();
    const ox=lerp(fx+34,x+70,k),oy=lerp(fy-14,y-66,k);glow(g,ox,oy,22,'rgba(253,224,71,.35)');g.fillStyle='rgba(253,230,138,.55)';g.beginPath();g.arc(ox,oy,11,0,7);g.fill();g.fillStyle='#fdf2f8';g.beginPath();g.arc(ox,oy,6.5,0,7);g.fill();
    th='ตกไข่';en='Ovulation';cs='Secondary oocyte n·2c หยุดที่ Metaphase II';}
  else{let r,col;if(H.resc){r=30;col='#facc15';}else if(c<24){r=24+6*sm((c-15.5)/4);col='#facc15';}else{const k=sm((c-24)/4);r=lerp(30,13,k);col=k>0.6?'#e7e5e4':'#fde68a';}
    g.fillStyle=col;g.beginPath();g.arc(fx,fy,r,0,7);g.fill();g.strokeStyle='rgba(161,98,7,.6)';g.lineWidth=1;for(let i=0;i<6;i++){g.beginPath();g.arc(fx,fy,r*(0.3+i*0.11),i,i+2.2);g.stroke();}

  else{if($('#exp4').value==='yolk'){const sp=$('#sp').value,Y=YK[sp],k=Math.min(5,Math.floor(M4.p));tt='ชนิดของไข่: '+Y.n+' – '+Y.t;ct='ปริมาณไข่แดงของไข่แต่ละชนิด';
      st=[['ชนิดไข่',Y.t.split(' ')[0]],['ปริมาณไข่แดง','~'+Y.y+'%'],['รอบการแบ่ง',k+' → '+2**k+(Y.ty==='centro'&&k<5?' นิวเคลียส':' เซลล์')],['รูปแบบการแบ่ง',Y.cl.split(' – ')[0]]];
