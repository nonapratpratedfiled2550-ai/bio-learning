<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบต่อมไร้ท่อ – Interactive Biology Lab</title>
<style>
:root{--bg:#0d0610;--panel:#1a0f1d;--panel2:#24152a;--line:#3d2343;--txt:#fdeef8;--mut:#c9a9bf;--acc:#f472b6;--acc2:#fbbf24}
*{box-sizing:border-box}
body{margin:0;font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{padding:12px 18px;background:linear-gradient(90deg,#9d174d,#7c2d12);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:12px}
header h1{font-size:19px;margin:0}header .sub{color:#fbcfe8;font-size:13px}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr) 370px;gap:12px;padding:12px}
@media(max-width:1280px){.grid{grid-template-columns:290px minmax(0,1fr)}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}.right .card{margin:0}}
@media(max-width:820px){.grid{grid-template-columns:1fr}.right{display:block}.right .card{margin-bottom:12px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:15px;color:var(--acc)}
.modes button{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;font:inherit;font-size:13px}
.modes button.on{background:#831843;border-color:var(--acc)}
.ctl{margin:8px 0}.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:3px}.ctl label b{color:var(--acc2)}
input[type=range]{width:100%;accent-color:var(--acc)}
select{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--txt);margin:6px 0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.btn{padding:8px;border-radius:8px;border:1px solid var(--line);background:#33193a;color:var(--txt);cursor:pointer;font:inherit;font-size:13px}
.btn:hover{border-color:var(--acc)}.btn.pri{background:#be185d;border-color:#f9a8d4}
.switch{display:flex;background:var(--panel2);border-radius:9px;padding:3px;border:1px solid var(--line)}
.switch button{flex:1;border:0;background:transparent;color:var(--mut);padding:7px 4px;border-radius:7px;cursor:pointer;font:inherit;font-size:12px}
.switch button.on{background:#c2410c;color:#fff}
canvas{display:block;width:100%}
#main{height:470px;background:#0b0612;border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel2);border-radius:10px;padding:8px;border:1px solid var(--line)}
.stat .k{font-size:11.5px;color:var(--mut)}.stat .v{font-size:16px;font-weight:700;color:var(--acc2);margin-top:2px}
.flow{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;align-items:center}
.flow span{padding:4px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-size:11.5px;color:var(--mut)}
.flow span.on{background:#be185d;color:#fff;border-color:#f9a8d4}.flow span.done{color:#fbcfe8;border-color:#831843}.flow span.bad{background:#7f1d1d;color:#fecaca;border-color:#ef4444}
.flow i{color:var(--mut);font-style:normal;font-size:11px}
.eq{font-family:Consolas,monospace;background:#12060f;padding:10px;border-radius:8px;border-left:4px solid var(--acc);white-space:pre-wrap;font-size:13px;margin-top:10px;line-height:1.55}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{border:1px solid var(--line);padding:4px 5px;text-align:center}th{background:var(--panel2);color:var(--acc)}
.mis{background:#2a1a10;border-color:#7b4a1e}.mis h3{color:var(--acc2)}.mis p,.ana p{margin:6px 0;line-height:1.55}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:12px;margin-right:4px}
.ok{background:#14532d;color:#bbf7d0}.no{background:#7f1d1d;color:#fecaca}.mid{background:#713f12;color:#fde68a}
.chart{height:250px;background:#12060f;border-radius:8px}
</style>
<link rel="stylesheet" href="float-lab.css">
</head>
<body>
<header><a href="index.html" style="color:#8dffc0;text-decoration:none;font-weight:700;margin-right:6px">← หน้าแรก</a><h1>🧪 ระบบต่อมไร้ท่อ (Endocrine System)</h1><span class="sub">ห้องปฏิบัติการเสมือนจริง ชีววิทยา ม.4–ม.6</span></header>
<div class="grid">
<div class="left">
  <div class="card modes"><h3>เลือกโหมดการจำลอง</h3>
    <button data-mode="1" class="on">โหมด 1 : กลไกการออกฤทธิ์ของฮอร์โมน (Peptide vs Steroid)</button>
    <button data-mode="2">โหมด 2 : แกนฮอร์โมนและการควบคุมแบบป้อนกลับ</button>
    <button data-mode="3">โหมด 3 : ดุลยภาพกลูโคสและแคลเซียม</button>
    <button data-mode="4">โหมด 4 : จำลองโรคของต่อมไร้ท่อ</button>
  </div>
  <div class="card"><h3>แผงควบคุมตัวแปร</h3>
    <div data-m="1">
      <div class="ctl"><label>ฮอร์โมน / ชนิด</label><select id="hclass"><option value="camp">Glucagon – Peptide (cAMP)</option><option value="ip3">Oxytocin – Peptide (IP₃ / DAG)</option><option value="epi">Epinephrine – Amine (Receptor ผิวเซลล์)</option><option value="ster">Cortisol – Steroid (Receptor ในเซลล์)</option><option value="thy">T₃/T₄ – Amine (Receptor ในนิวเคลียส)</option></select></div>
      <div class="ctl"><label>ความเข้มข้นฮอร์โมน <b id="hdoseV"></b></label><input type="range" id="hdose" min="0" max="100" step="1" value="40"></div>
      <div class="ctl"><label>รูปแบบการส่งสัญญาณ</label><select id="sig"><option value="endo">Endocrine (ผ่านกระแสเลือด)</option><option value="para">Paracrine (เซลล์ข้างเคียง)</option><option value="auto">Autocrine (ออกฤทธิ์กับตัวเอง)</option><option value="neuro">Neuroendocrine (เซลล์ประสาทหลั่งฮอร์โมน)</option></select></div>
      <button class="btn" id="replay1" style="width:100%">↻ เริ่มลำดับการส่งสัญญาณใหม่</button>
    </div>
    <div data-m="2">
      <div class="ctl"><label>แกนฮอร์โมน</label><select id="axis"><option value="hpt">HPT: Hypothalamus–Pituitary–Thyroid</option><option value="hpa">HPA: Hypothalamus–Pituitary–Adrenal</option><option value="hpg">HPG: Hypothalamus–Pituitary–Gonad</option><option value="adh">ADH: Hypothalamus → ต่อมใต้สมองส่วนหลัง</option><option value="oxy">Oxytocin: การคลอด (Positive feedback)</option></select></div>
      <div class="ctl"><label><span id="stimLab">สิ่งเร้า</span> <b id="stim2V"></b></label><input type="range" id="stim2" min="0" max="100" step="1" value="50"></div>
      <div class="ctl" id="ioBox"><label>ไอโอดีนในอาหาร</label><select id="iodine"><option value="def">ขาด (Deficient)</option><option value="norm" selected>ปกติ (Normal)</option><option value="exc">เกิน (Excess)</option></select></div>
      <label class="chk" id="fbBox"><input type="checkbox" id="fbk" checked> Negative feedback ทำงาน</label>
      <label class="chk" id="exoBox"><input type="checkbox" id="exo"> ได้รับฮอร์โมนจากภายนอก (ยา)</label>
      <label class="chk" id="posBox"><input type="checkbox" id="pos"> ก่อนตกไข่: Estrogen สูง → Positive feedback</label>
      <button class="btn" id="labor" style="width:100%">🤰 เริ่มการคลอด</button>
    </div>
    <div data-m="3">
      <div class="ctl"><label>ระบบที่ศึกษา</label><select id="home"><option value="glu">ระดับกลูโคสในเลือด</option><option value="ca">ระดับแคลเซียมในเลือด</option></select></div>
      <div class="ctl"><label>อาหาร</label><select id="diet"><option value="norm">ปกติ</option><option value="carb">คาร์โบไฮเดรตสูง (High carb)</option><option value="fast">อดอาหาร (Fasting)</option><option value="highca">แคลเซียมสูง (High Ca)</option></select></div>
      <div id="gluBox">
        <div class="ctl"><label>ตั้งระดับกลูโคส <b id="gluV"></b></label><input type="range" id="glu" min="40" max="300" step="1" value="90"></div>
        <div class="ctl"><label>ความไวต่อ Insulin <b id="sensV"></b></label><input type="range" id="sens" min="0" max="100" step="1" value="100"></div>
        <div class="btns"><button class="btn" id="meal">🍚 กินอาหาร</button><button class="btn" id="exer">🏃 ออกกำลังกาย</button></div>
      </div>
      <div id="caBox">
        <div class="ctl"><label>ตั้งระดับ Ca²⁺ <b id="caV"></b></label><input type="range" id="ca" min="5" max="15" step="0.1" value="9.5"></div>
        <div class="btns"><button class="btn" id="caMeal">🥛 ได้รับ Ca²⁺</button><button class="btn" id="caLow">⬇ Ca²⁺ ต่ำเฉียบพลัน</button></div>
      </div>
    </div>
    <div data-m="4">
      <div class="ctl"><label>โรค / ความผิดปกติ</label><select id="dis"><option value="normal">ปกติ (เปรียบเทียบ)</option><option value="t1dm" selected>เบาหวานชนิดที่ 1 (T1DM)</option><option value="t2dm">เบาหวานชนิดที่ 2 (T2DM)</option><option value="graves">Graves' disease (ไทรอยด์เป็นพิษ)</option><option value="hypo">Hypothyroidism / Myxedema</option><option value="cretin">Cretinism</option><option value="goiter">คอพอกจากขาดไอโอดีน (Simple goiter)</option><option value="cushing">Cushing's syndrome</option><option value="addison">Addison's disease</option><option value="giant">Gigantism</option><option value="acro">Acromegaly</option><option value="dwarf">Pituitary dwarfism</option></select></div>
      <label class="chk"><input type="checkbox" id="treat"> ให้การรักษา</label>
    </div>
  </div>
  <div class="card"><h3>การควบคุมการจำลอง</h3>
    <div class="btns"><button class="btn pri" id="play">▶ เล่น</button><button class="btn" id="pause">⏸ หยุด</button><button class="btn" id="reset" style="grid-column:1/-1">↺ รีเซ็ต</button></div>
    <div class="ctl" style="margin-top:12px"><label>โหมดการแสดงผล (Toggle)</label>
      <div class="switch"><button id="tgPath" class="on">เส้นทางฮอร์โมนในกระแสเลือด</button><button id="tgStruct">โครงสร้างเคมี (Peptide vs Steroid)</button></div></div>
  </div>
</div>
<div class="center"><div class="card">
  <h3 id="simTitle">หน้าจอจำลอง</h3>
  <canvas id="main"></canvas>
  <div class="stats" id="stats"></div>
  <div class="flow" id="flow"></div>
  <div class="eq" id="eq"></div>
</div></div>
<div class="right">
  <div class="card"><h3 id="chartTitle">กราฟ</h3><canvas id="chart" class="chart"></canvas><div id="tableBox" style="margin-top:8px"></div></div>
  <div class="card ana"><h3>📋 บทวิเคราะห์</h3><div id="analysis"></div></div>
  <div class="card mis"><h3>⚠️ ข้อเข้าใจคลาดเคลื่อนที่พบบ่อย</h3><div id="mis"></div></div>
</div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function fit(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const W=Math.max(1,Math.round(r.width*d)),H=Math.max(1,Math.round(r.height*d));if(c.width!==W||c.height!==H){c.width=W;c.height=H;}const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);return{g,w:r.width,h:r.height};}
function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
const FONT='"Sarabun","Leelawadee UI",Tahoma,sans-serif';
function T(g,s,x,y,col='#fdeef8',size=12,align='left',bold=false){g.fillStyle=col;g.font=(bold?'700 ':'')+size+'px '+FONT;g.textAlign=align;g.textBaseline='middle';g.fillText(s,x,y);}
function wrap(g,s,x,y,mw,lh,col,size,bold){g.font=(bold?'700 ':'')+size+'px '+FONT;const lines=[];let cur='';for(const ch of s){const t=cur+ch;if(g.measureText(t).width>mw&&cur&&!/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/.test(ch)){const sp=cur.lastIndexOf(' ');if(sp>cur.length*0.5){lines.push(cur.slice(0,sp));cur=cur.slice(sp+1)+ch;}else{lines.push(cur);cur=ch;}}else cur=t;}if(cur)lines.push(cur);lines.forEach((l,i)=>T(g,l,x,y+i*lh,col,size,'left',bold));return y+lines.length*lh;}
function arrow(g,x1,y1,x2,y2,col,lw=2,dash){g.strokeStyle=col;g.fillStyle=col;g.lineWidth=lw;g.setLineDash(dash||[]);g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.setLineDash([]);const a=Math.atan2(y2-y1,x2-x1);g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-8*Math.cos(a-0.45),y2-8*Math.sin(a-0.45));g.lineTo(x2-8*Math.cos(a+0.45),y2-8*Math.sin(a+0.45));g.closePath();g.fill();}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,sm=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
function hash(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const V=id=>+$('#'+id).value;
const S={mode:1,running:true,toggle:'path',time:0};
function bar(g,x,y,w,h,v,col,label,txt){g.fillStyle='#33193a';rr(g,x,y,w,h,4);g.fill();g.fillStyle=col;rr(g,x,y,w*clamp(v,0,1),h,4);g.fill();if(label)T(g,label,x,y-8,'#f5d0e6',10.5);if(txt)T(g,txt,x+w,y-8,'#fde68a',10.5,'right',true);}
function along(P,s){const L=[0];for(let i=1;i<P.length;i++)L.push(L[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));const d=clamp(s,0,1)*L[L.length-1];let i=1;while(i<L.length-1&&L[i]<d)i++;const t=(d-L[i-1])/((L[i]-L[i-1])||1);return[lerp(P[i-1][0],P[i][0],t),lerp(P[i-1][1],P[i][1],t)];}
function flow(g,P,n,speed,col,r=3,off=0){for(let j=0;j<n;j++){const s=(S.time*speed+j/n+off)%1;const [x,y]=along(P,s);g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill();}}
function panel(g,x,y,w,h){g.fillStyle='rgba(26,14,30,.94)';rr(g,x,y,w,h,10);g.fill();}
function line(g,P,col,lw){g.strokeStyle=col;g.lineWidth=lw;g.lineJoin='round';g.lineCap='round';g.beginPath();P.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();}
function glow(g,x,y,r,col){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
function flowBar(steps,cur,bad=-1){$('#flow').innerHTML=steps.map((s,i)=>`<span class="${i===bad?'bad':i===cur?'on':cur>=0&&i<cur?'done':''}">${s}</span>`).join('<i>→</i>');}
function hexP(g,cx,cy,r,rot=Math.PI/6,n=6){g.beginPath();for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n,x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);i?g.lineTo(x,y):g.moveTo(x,y);}g.closePath();}
function hShape(g,cls,x,y,s=1){if(cls==='pep'){['#f472b6','#fb923c','#facc15','#a78bfa'].forEach((c,i)=>{g.fillStyle=c;g.beginPath();g.arc(x-6*s+i*4*s,y+(i%2?2:-2)*s,2.6*s,0,7);g.fill();});}
  else if(cls==='ster'){hexP(g,x-3.4*s,y,4*s);g.fillStyle='#fbbf24';g.fill();hexP(g,x+3.4*s,y,4*s);g.fill();}
  else if(cls==='thy'){hexP(g,x,y,4.5*s);g.fillStyle='#38bdf8';g.fill();T(g,'I',x+7*s,y-4*s,'#e0f2fe',8*s,'center',true);}
  else{hexP(g,x,y,4.5*s);g.fillStyle='#f87171';g.fill();}}
function box(g,x,y,w,h,title,col){g.fillStyle='rgba(255,255,255,.03)';rr(g,x,y,w,h,10);g.fill();g.strokeStyle=col+'66';g.lineWidth=1.2;g.stroke();T(g,title,x+8,y+12,col,10.5,'left',true);}

/* ================= MODE 1 : SIGNAL TRANSDUCTION ================= */
const HC={camp:{n:'Glucagon',cls:'pep',sf:true,steps:['Glucagon จับ Receptor ที่ผิวเซลล์','G protein ทำงาน','Adenylyl cyclase: ATP → cAMP','cAMP กระตุ้น Protein kinase A','สลายไกลโคเจน → กลูโคส'],t:'Peptide (ละลายน้ำ) เข้าเซลล์ไม่ได้ ต้องจับ Receptor บนเยื่อหุ้มเซลล์ แล้วใช้ cAMP เป็น Second messenger'},
 ip3:{n:'Oxytocin',cls:'pep',sf:true,ip3:true,steps:['Oxytocin จับ Receptor ที่ผิวเซลล์','G protein → Phospholipase C','PIP₂ → IP₃ + DAG','IP₃ ปล่อย Ca²⁺ จาก ER · DAG กระตุ้น PKC','กล้ามเนื้อมดลูกหดตัว'],t:'Peptide ที่ใช้ IP₃ และ DAG เป็น Second messenger — IP₃ ทำให้ ER ปล่อย Ca²⁺ ออกมา'},
 epi:{n:'Epinephrine',cls:'epi',sf:true,steps:['Epinephrine จับ β-receptor ที่ผิวเซลล์','G protein ทำงาน','Adenylyl cyclase: ATP → cAMP','cAMP กระตุ้น Protein kinase A','สลายไกลโคเจน + หัวใจเต้นแรง'],t:'Amine (Catecholamine จาก Tyrosine) ละลายน้ำ จึงออกฤทธิ์แบบเดียวกับ Peptide ผ่าน Receptor ผิวเซลล์และ cAMP'},
 ster:{n:'Cortisol',cls:'ster',sf:false,steps:['แพร่ผ่านเยื่อหุ้มเซลล์ (ละลายในลิพิด)','จับ Receptor ในไซโทพลาซึม','Hormone–Receptor complex เข้านิวเคลียส','จับ DNA → ถอดรหัสเป็น mRNA','สังเคราะห์โปรตีน/เอนไซม์ใหม่'],t:'Steroid สร้างจาก Cholesterol ละลายในลิพิด แพร่ผ่านเยื่อหุ้มเซลล์ได้ ควบคุมการแสดงออกของยีนโดยตรง'},
 thy:{n:'T₃/T₄',cls:'thy',sf:false,steps:['T₄ เข้าเซลล์ (ตัวขนส่ง) → เปลี่ยนเป็น T₃','T₃ เข้าสู่นิวเคลียส','จับ Receptor บน DNA','ถอดรหัสเป็น mRNA','สร้างเอนไซม์/Na⁺–K⁺ ATPase → ↑ BMR'],t:'Amine แต่ละลายในลิพิด (มีไอโอดีน) — Receptor อยู่ในนิวเคลียส ออกฤทธิ์คล้าย Steroid'}};
const SIG={endo:{n:'Endocrine',d:'ต่อมไร้ท่อหลั่งฮอร์โมนเข้าสู่กระแสเลือด ไปออกฤทธิ์ที่เซลล์เป้าหมายที่อยู่ไกล เช่น Insulin, TSH, Cortisol'},

    else{const cur=Math.abs(q.Ca-9.5)<0.25?4:Math.abs(q.PTH-q.CT)<0.2?1:2+(Math.abs(q.Ca-9.5)<0.8?1:0);flowBar(['Ca²⁺ ในเลือดเปลี่ยน',q.Ca<9.5?'พาราไทรอยด์รับรู้':'C cell ไทรอยด์รับรู้','หลั่ง '+(q.Ca<9.5?'PTH':'Calcitonin'),q.Ca<9.5?'กระดูกสลาย · ไตดูดกลับ · ลำไส้ดูดซึม':'สะสม Ca²⁺ ในกระดูก · ไตขับทิ้ง','Ca²⁺ กลับสู่ 8.5–10.5'],cur);
      eq=`dCa/dt = k·(PTH − Calcitonin) + การดูดซึม − การสูญเสีย\nPTH ∝ (9.5 − Ca) · Calcitonin ∝ (Ca − 9.5)  →  PTH = ${q.PTH.toFixed(2)}× · CT = ${q.CT.toFixed(2)}×\nมวลกระดูก: dBMC/dt = −k'·(PTH − CT) → ${q.bmc.toFixed(1)}%`;
      const f=[];if(q.Ca>10.5)f.push('<span class="tag no">Hypercalcemia</span> Ca²⁺ สูง → C cell ของต่อมไทรอยด์หลั่ง Calcitonin → Osteoblast สะสม Ca²⁺ ในกระดูก ไตขับ Ca²⁺ ทิ้ง · PTH ลดลง (สาเหตุจริงเช่น ต่อมพาราไทรอยด์ทำงานเกิน)');
      if(q.Ca<8.5)f.push('<span class="tag no">Hypocalcemia</span> PTH ↑ → Osteoclast สลายกระดูก ไตดูดกลับ Ca²⁺ กระตุ้น Vitamin D ให้ลำไส้ดูดซึม Ca²⁺ — ถ้าต่ำมากกล้ามเนื้อจะเกร็งกระตุก (Tetany)');
      if($('#diet').value==='fast')f.push('<span class="tag mid">ขาดแคลเซียมเรื้อรัง</span> PTH สูงนาน → ดึง Ca²⁺ จากกระดูก มวลกระดูกลดลง (กระดูกพรุน)');if($('#diet').value==='highca')f.push('<span class="tag ok">แคลเซียมสูง</span> Calcitonin ทำงาน สะสม Ca²⁺ ในกระดูก มวลกระดูกเพิ่ม');
      if(!f.length)f.push('<span class="tag ok">Homeostasis</span> PTH และ Calcitonin ทำงานตรงข้ามกัน (Antagonistic) รักษา Ca²⁺ ในเลือดที่ 8.5–10.5 mg/dL');an=f.map(x=>`<p>${x}</p>`).join('');}
    mis='<p><b>❌ "Calcitonin และ PTH สร้างจากต่อมเดียวกัน"</b></p><p>✅ Calcitonin สร้างจาก <b>C cell ของต่อมไทรอยด์</b> ส่วน PTH สร้างจาก <b>ต่อมพาราไทรอยด์</b> (4 ต่อมเล็กด้านหลังไทรอยด์)</p><p><b>❌ "Glucagon กับ Glycogen คือสิ่งเดียวกัน"</b> ✅ Glucagon เป็น<b>ฮอร์โมน</b> ส่วน Glycogen เป็น<b>พอลิแซ็กคาไรด์</b>สะสมในตับ/กล้ามเนื้อ</p>';tb=THOM;}
  else{const q=d4(),d=q.d,ki=K4.indexOf(d.key);st=[['ความเข้มข้นฮอร์โมน ('+d.key+')',q.vals[ki].toFixed(2)+'× ปกติ'],['อัตรานำกลูโคสเข้าเซลล์',Math.round(q.upt)+'%'],['มวลแร่ธาตุกระดูก',Math.round(q.bmc)+'%'],['BMR',Math.round(q.bmr)+'%']];
    flowBar(q.tr?[...d.steps.slice(0,2),'รักษา','อาการดีขึ้น']:d.steps,q.tr?3:Math.floor(S.time*0.8)%d.steps.length,q.tr?-1:d.bad);
    const gv=90*q.vals[1],iv=10*q.vals[0];
    eq=['t1dm','t2dm','normal'].includes(q.k)?`เกณฑ์เบาหวาน: กลูโคสขณะอดอาหาร ≥ 126 mg/dL (ตอนนี้ ≈ ${gv.toFixed(0)})\nHOMA-IR = กลูโคส × Insulin / 405 = ${gv.toFixed(0)} × ${iv.toFixed(1)} / 405 = ${(gv*iv/405).toFixed(1)}  (> 2.5 = ดื้อต่อ Insulin)`
      :d.gl==='thy'?'ไทรอยด์ (Negative feedback): ต่อมไทรอยด์ผิดปกติ → T₄ ต่ำ + TSH สูง  |  Graves → T₄ สูง + TSH ต่ำ\nBMR ∝ T₃/T₄ · ไอโอดีนเป็นองค์ประกอบของ T₃ (3 อะตอม) และ T₄ (4 อะตอม)'
      :d.gl==='adr'?'แกน HPA: CRH → ACTH → Cortisol ⊣ (CRH, ACTH)\nปัญหาที่ต่อมหมวกไต: Cortisol กับ ACTH เปลี่ยนสวนทางกัน (Addison: Cortisol ↓ ACTH ↑)'
      :'GH → ตับสร้าง IGF-1 → กระดูกและกล้ามเนื้อเจริญ\nก่อนแผ่นกระดูกอ่อน (Epiphyseal plate) ปิด → ยาวขึ้น (Gigantism) · หลังปิด → หนาขึ้น (Acromegaly)';
    const cmp={t1dm:'ต่างจากชนิดที่ 2 ตรงที่<b>ไม่มี Insulin</b> จึงต้องฉีด Insulin',t2dm:'Insulin ไม่ได้ขาด แต่<b>เซลล์ไม่ตอบสนอง</b> — เป็นตัวอย่างว่าเบาหวานไม่ได้เกิดจากขาด Insulin เท่านั้น',graves:'ต่อมโตเหมือนคอพอกธรรมดา แต่<b>ฮอร์โมนสูง</b>และ TSH ต่ำ',hypo:'ผู้ใหญ่ขาดไทรอยด์ → Myxedema · ถ้าเป็นตั้งแต่เด็ก → Cretinism',cretin:'เตี้ย<b>และสติปัญญาต่ำ</b> ต่างจาก Dwarfism ที่สติปัญญาปกติ',goiter:'ต่อมโตเพราะ <b>TSH สูง</b> จากการขาด Negative feedback ไม่ใช่เพราะต่อมทำงานมาก',cushing:'Cortisol สูงนาน → สลายโปรตีนกล้ามเนื้อและกระดูก จึงแขนขาลีบและกระดูกพรุน',addison:'ACTH สูงเพราะไม่มี Cortisol มายับยั้ง และ ACTH กระตุ้นเมลานิน → ผิวคล้ำ',giant:'อายุขณะเกิดโรคเป็นตัวกำหนด: เด็ก → Gigantism · ผู้ใหญ่ → Acromegaly',acro:'กระดูกยาวขึ้นไม่ได้แล้ว จึงหนาขึ้นแทนที่ปลายมือ เท้า และขากรรไกร',dwarf:'สมส่วนและฉลาดปกติ ต่างจาก Cretinism',normal:'เลือกโรคเพื่อเปรียบเทียบกับค่าปกติ'}[q.k];
    an=`<p><span class="tag ${q.k==='normal'?'ok':q.tr?'ok':'no'}">${q.tr?'กำลังรักษา':d.n.split(' (')[0]}</span> ${d.cause}</p><p>${cmp}</p>`;
    mis='<p><b>❌ "เบาหวานเกิดจากขาด Insulin เท่านั้น"</b></p><p>✅ ชนิดที่ 2 (พบมากที่สุด) Insulin ปกติหรือสูง แต่<b>เซลล์ดื้อต่อ Insulin</b></p><p><b>❌ "คอพอกทุกชนิดเกิดจากขาดไอโอดีน"</b> ✅ Graves\' disease ก็ทำให้ต่อมโตได้ แต่เกิดจากแอนติบอดีกระตุ้นต่อม และฮอร์โมนสูง</p>';tb=TDIS;}
  stats(st);$('#eq').textContent=eq;$('#analysis').innerHTML=an;$('#mis').innerHTML=mis;$('#tableBox').innerHTML=tb;}

$$('.modes button').forEach(b=>b.onclick=()=>setMode(+b.dataset.mode));

function sync(){const ax=$('#axis').value;$('#ioBox').style.display=ax==='hpt'?'':'none';$('#exoBox').style.display=['hpt','hpa','hpg'].includes(ax)?'':'none';$('#fbBox').style.display=ax==='oxy'?'none':'';$('#posBox').style.display=ax==='hpg'?'':'none';$('#labor').style.display=ax==='oxy'?'':'none';$('#stimLab').textContent=STL[ax];

  $('#simTitle').textContent=['','การส่งสัญญาณของฮอร์โมนที่เซลล์เป้าหมาย','แกน Hypothalamus – ต่อมใต้สมอง – ต่อมเป้าหมาย','การรักษาดุลยภาพกลูโคสและแคลเซียมในเลือด','จำลองโรคของต่อมไร้ท่อ'][m];
  $('#chartTitle').textContent=['','ความเร็วการตอบสนอง: Peptide vs Steroid','ระดับฮอร์โมนตามเวลา','กลูโคส/แคลเซียม และฮอร์โมนตามเวลา','ระดับฮอร์โมนเทียบกับค่าปกติ'][m];updateText();}
const bind=(id,fmt)=>{const el=$('#'+id);const f=()=>{$('#'+id+'V').textContent=fmt(+el.value);};el.addEventListener('input',()=>{f();updateText();});f();return f;};
bind('hdose',v=>(v/10).toFixed(1)+' nM');bind('stim2',v=>v+'%');bind('glu',v=>v+' mg/dL');bind('sens',v=>v+'%');bind('ca',v=>v.toFixed(1)+' mg/dL');

$('#play').onclick=()=>S.running=true;$('#pause').onclick=()=>S.running=false;

initM1();initM2();initM3();initM4();
let last=performance.now(),accT=0;
