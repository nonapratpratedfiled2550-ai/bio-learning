<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบภูมิคุ้มกัน – Interactive Biology Lab</title>
<style>
:root{--bg:#07110d;--panel:#0e1a15;--panel2:#14251e;--line:#244136;--txt:#e6f6ee;--mut:#93b8a6;--acc:#86efac;--acc2:#fbbf24}
*{box-sizing:border-box}
body{margin:0;font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{padding:12px 18px;background:linear-gradient(90deg,#14532d,#4c1d95);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:12px}
header h1{font-size:19px;margin:0}header .sub{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr) 370px;gap:12px;padding:12px}
@media(max-width:1280px){.grid{grid-template-columns:290px minmax(0,1fr)}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}.right .card{margin:0}}
@media(max-width:820px){.grid{grid-template-columns:1fr}.right{display:block}.right .card{margin-bottom:12px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:15px;color:var(--acc)}
.modes button{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;font:inherit;font-size:13px}
.modes button.on{background:#166534;border-color:var(--acc)}
.ctl{margin:8px 0}.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:3px}.ctl label b{color:var(--acc2)}
input[type=range]{width:100%;accent-color:var(--acc)}
select{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--txt);margin:6px 0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.btn{padding:8px;border-radius:8px;border:1px solid var(--line);background:#1a3328;color:var(--txt);cursor:pointer;font:inherit;font-size:13px}
.btn:hover{border-color:var(--acc)}.btn.pri{background:#15803d;border-color:#86efac}
.switch{display:flex;background:var(--panel2);border-radius:9px;padding:3px;border:1px solid var(--line)}
.switch button{flex:1;border:0;background:transparent;color:var(--mut);padding:7px 4px;border-radius:7px;cursor:pointer;font:inherit;font-size:12px}
.switch button.on{background:#7c3aed;color:#fff}
canvas{display:block;width:100%}
#main{height:470px;background:#040b08;border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel2);border-radius:10px;padding:8px;border:1px solid var(--line)}
.stat .k{font-size:11.5px;color:var(--mut)}.stat .v{font-size:16px;font-weight:700;color:var(--acc2);margin-top:2px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:10px;font-size:12px}
.flow span{padding:4px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
.flow span.on{background:#166534;border-color:var(--acc);color:#fff;font-weight:700}.flow span.done{color:var(--txt)}.flow i{color:var(--mut);font-style:normal}
.eq{font-family:Consolas,monospace;background:#050d09;padding:10px;border-radius:8px;border-left:4px solid var(--acc);white-space:pre-wrap;font-size:13px;margin-top:10px;line-height:1.55}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{border:1px solid var(--line);padding:4px 5px;text-align:center}th{background:var(--panel2);color:var(--acc)}
.mis{background:#2a1a10;border-color:#7b4a1e}.mis h3{color:var(--acc2)}.mis p,.ana p{margin:6px 0;line-height:1.55}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:12px;margin-right:4px}
.ok{background:#14532d;color:#bbf7d0}.no{background:#7f1d1d;color:#fecaca}.mid{background:#713f12;color:#fde68a}
.hint{font-size:12px;color:var(--mut);line-height:1.5}
.chart{height:250px;background:#050d09;border-radius:8px}
</style>
<link rel="stylesheet" href="float-lab.css">
</head>
<body>
<header><a href="index.html" style="color:#8dffc0;text-decoration:none;font-weight:700;margin-right:6px">← หน้าแรก</a><h1>🛡️ ระบบภูมิคุ้มกัน (Immune System)</h1><span class="sub">ห้องปฏิบัติการเสมือนจริง ชีววิทยา ม.4–ม.6</span></header>
<div class="grid">
<div class="left">
  <div class="card modes"><h3>เลือกโหมดการจำลอง</h3>
    <button data-mode="1" class="on">โหมด 1 : ภูมิคุ้มกันดั้งเดิมและการอักเสบ</button>
    <button data-mode="2">โหมด 2 : B cell / T cell และการสร้างแอนติบอดี</button>
    <button data-mode="3">โหมด 3 : วัคซีน vs เซรุ่ม และ Primary / Secondary response</button>
    <button data-mode="4">โหมด 4 : ความผิดปกติ: ภูมิแพ้ Autoimmune HIV/AIDS</button>
  </div>
  <div class="card"><h3>แผงควบคุมตัวแปร</h3>
    <div data-m="1 2 3 4"><div class="ctl"><label>ปริมาณเชื้อโรค / แอนติเจน (Pathogen load)</label><select id="load"><option value="low">ต่ำ (Low)</option><option value="med" selected>ปานกลาง (Medium)</option><option value="high">สูง (High)</option></select></div></div>
    <div data-m="1">
      <div class="ctl"><label>สภาพผิวหนัง (ด่านที่ 1)</label><select id="skin"><option value="wound">มีบาดแผล – แบคทีเรียเข้าสู่เนื้อเยื่อ</option><option value="intact">ผิวหนังปกติ – Keratin / เมือก / Lysozyme กันไว้</option></select></div>
      <label class="chk"><input type="checkbox" id="anti"> ให้ยาต้านฮิสตามีน (ยับยั้งการอักเสบ)</label>
      <label class="chk"><input type="checkbox" id="comp" checked> Complement proteins ทำงาน (MAC)</label>
      <button class="btn pri" id="infect" style="width:100%;margin-top:4px">🦠 ปล่อยแบคทีเรียชุดใหม่</button>
    </div>
    <div data-m="2">
      <div class="ctl"><label>ชนิดสิ่งแปลกปลอม</label><select id="ptype"><option value="bac">แบคทีเรีย (อยู่นอกเซลล์ → Humoral เด่น)</option><option value="virus">ไวรัส (อยู่ในเซลล์ → Cell-mediated เด่น)</option></select></div>
      <div class="ctl"><label>เวลาในการแบ่งเซลล์ 1 รอบ (g) <b id="genV"></b></label><input type="range" id="gen" min="6" max="24" step="1" value="12"></div>
      <label class="chk"><input type="checkbox" id="noTh"> ไม่มี Helper T cell (CD4⁺) ทำงาน</label>
    </div>
    <div data-m="3">
      <div class="ctl"><label>ประเภทภูมิคุ้มกันที่ได้รับ (ชุดการทดลอง)</label><select id="iv"><option value="none">None – ติดเชื้อจริง 2 ครั้ง (วันที่ 0 และ 60)</option><option value="active" selected>Active – วัคซีนเข็ม 1 (วัน 0) + เข็ม 2 (วัน 28) → ติดเชื้อวัน 90</option><option value="passive">Passive – ฉีดเซรุ่ม (วัน 0) → ติดเชื้อวัน 90</option></select></div>
      <div class="ctl"><label>ชนิดวัคซีน</label><select id="vtype"><option value="att">เชื้ออ่อนฤทธิ์ (Live attenuated)</option><option value="kill">เชื้อตาย (Inactivated)</option><option value="tox">ท็อกซอยด์ (Toxoid)</option><option value="mrna">mRNA vaccine</option></select></div>
      <div class="btns"><button class="btn" id="bVac">💉 ฉีดวัคซีนตอนนี้</button><button class="btn" id="bSer">🧪 ฉีดเซรุ่มตอนนี้</button><button class="btn" id="bInf" style="grid-column:1/-1">🦠 ติดเชื้อจริงตอนนี้</button></div>
    </div>
    <div data-m="4">
      <div class="ctl"><label>ความผิดปกติของระบบภูมิคุ้มกัน</label><select id="dis"><option value="allergy">โรคภูมิแพ้ (Allergy / Hypersensitivity)</option><option value="hiv" selected>HIV / AIDS (Immunodeficiency)</option><option value="auto">โรคภูมิคุ้มกันต่อต้านตนเอง (Autoimmune)</option></select></div>
      <div class="sub4" data-s="allergy">
        <div class="ctl"><label>ระดับเกสรดอกไม้ / ฝุ่น (Allergen) <b id="algV"></b></label><input type="range" id="alg" min="0" max="100" step="1" value="40"></div>
        <label class="chk"><input type="checkbox" id="sens" checked> เคยได้รับสารก่อภูมิแพ้มาก่อน (Sensitized)</label>
        <label class="chk"><input type="checkbox" id="antiH"> กินยาต้านฮิสตามีน (Antihistamine)</label>
      </div>
      <div class="sub4" data-s="auto">
        <div class="ctl"><label>โรค</label><select id="autoT"><option value="sle">โรคพุ่มพวง (SLE)</option><option value="ra">รูมาตอยด์ (Rheumatoid arthritis)</option><option value="t1d">เบาหวานชนิดที่ 1 (Type 1 diabetes)</option></select></div>
        <label class="chk"><input type="checkbox" id="isup"> ได้รับยากดภูมิคุ้มกัน (Immunosuppressant)</label>
      </div>
      <div class="sub4" data-s="hiv auto"><div class="ctl"><label>ระยะเวลาการดำเนินโรค <b id="yrV"></b></label><input type="range" id="yr" min="0" max="10" step="0.1" value="3"></div></div>
      <div class="sub4" data-s="hiv"><label class="chk"><input type="checkbox" id="art"> เริ่มยาต้านไวรัส (ART) ตั้งแต่ปีที่ 2</label><p class="hint">ปริมาณเชื้อ (Low/Medium/High) ด้านบน = อัตราการทำลาย CD4⁺</p></div>
    </div>
  </div>
  <div class="card"><h3>การควบคุมการจำลอง</h3>
    <div class="btns"><button class="btn pri" id="play">▶ เล่น</button><button class="btn" id="pause">⏸ หยุด</button><button class="btn" id="reset" style="grid-column:1/-1">↺ รีเซ็ต</button></div>
    <div class="ctl" style="margin-top:12px"><label>โหมดการแสดงผล (Toggle)</label>
      <div class="switch"><button id="tgMHC" class="on">MHC I / MHC II บนผิวเซลล์</button><button id="tgIG">ชนิดแอนติบอดี (IgM / IgG / IgE)</button></div></div>
  </div>
</div>
<div class="center"><div class="card">
  <h3 id="simTitle">หน้าจอจำลอง</h3>
  <canvas id="main"></canvas>
  <div class="stats" id="stats"></div>
  <div class="flow" id="flow"></div>
  <div class="eq" id="eq"></div>
</div></div>
<div class="right">
  <div class="card"><h3 id="chartTitle">กราฟ</h3><canvas id="chart" class="chart"></canvas><div id="tableBox" style="margin-top:8px"></div></div>
  <div class="card ana"><h3>📋 บทวิเคราะห์</h3><div id="analysis"></div></div>
  <div class="card mis"><h3>⚠️ ข้อเข้าใจคลาดเคลื่อนที่พบบ่อย</h3><div id="mis"></div></div>
</div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function fit(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const W=Math.max(1,Math.round(r.width*d)),H=Math.max(1,Math.round(r.height*d));if(c.width!==W||c.height!==H){c.width=W;c.height=H;}const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);return{g,w:r.width,h:r.height};}
function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
const FONT='"Sarabun","Leelawadee UI",Tahoma,sans-serif';
function T(g,s,x,y,col='#e6f6ee',size=12,align='left',bold=false){g.fillStyle=col;g.font=(bold?'700 ':'')+size+'px '+FONT;g.textAlign=align;g.textBaseline='middle';g.fillText(s,x,y);}
function wrap(g,s,x,y,mw,lh,col,size,bold){g.font=(bold?'700 ':'')+size+'px '+FONT;const lines=[];let cur='';for(const ch of s){const t=cur+ch;if(g.measureText(t).width>mw&&cur&&!/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/.test(ch)){const sp=cur.lastIndexOf(' ');if(sp>cur.length*0.5){lines.push(cur.slice(0,sp));cur=cur.slice(sp+1)+ch;}else{lines.push(cur);cur=ch;}}else cur=t;}if(cur)lines.push(cur);lines.forEach((l,i)=>T(g,l,x,y+i*lh,col,size,'left',bold));return y+lines.length*lh;}
function arrow(g,x1,y1,x2,y2,col,lw=2){g.strokeStyle=col;g.fillStyle=col;g.lineWidth=lw;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();const a=Math.atan2(y2-y1,x2-x1);g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-8*Math.cos(a-0.45),y2-8*Math.sin(a-0.45));g.lineTo(x2-8*Math.cos(a+0.45),y2-8*Math.sin(a+0.45));g.closePath();g.fill();}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
function hash(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const V=id=>+$('#'+id).value;
const S={mode:1,running:true,toggle:'mhc',time:0};
function bar(g,x,y,w,h,v,col,label,txt){g.fillStyle='#1a3328';rr(g,x,y,w,h,4);g.fill();g.fillStyle=col;rr(g,x,y,w*clamp(v,0,1),h,4);g.fill();if(label)T(g,label,x,y-8,'#cfeadb',10.5);if(txt)T(g,txt,x+w,y-8,'#fde68a',10.5,'right',true);}
const fmtBig=n=>n>=1e6?(n/1e6).toFixed(1)+' ล้าน':Math.round(n).toLocaleString('en-US');
const LF=()=>({low:0.6,med:1,high:1.6})[$('#load').value];
function panel(g,x,y,w,h){g.fillStyle='rgba(8,20,15,.93)';rr(g,x,y,w,h,10);g.fill();}
function Yab(g,x,y,s,ang,col,lw=2){g.save();g.translate(x,y);g.rotate(ang||0);g.strokeStyle=col;g.lineWidth=lw;g.lineCap='round';g.beginPath();g.moveTo(0,s*0.6);g.lineTo(0,0);g.lineTo(-s*0.5,-s*0.6);g.moveTo(0,0);g.lineTo(s*0.5,-s*0.6);g.stroke();g.restore();}
function cup(g,x,y,a,col){g.strokeStyle=col;g.lineWidth=2.5;g.beginPath();g.arc(x+Math.cos(a)*4,y+Math.sin(a)*4,4,a+Math.PI/2,a+Math.PI*1.5);g.stroke();}
function cell(g,x,y,r,fill,edge){g.fillStyle=fill;g.strokeStyle=edge;g.lineWidth=2;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.stroke();g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.arc(x+r*0.15,y+r*0.1,r*0.45,0,7);g.fill();}
function bacterium(g,x,y,a,col='#4ade80'){g.save();g.translate(x,y);g.rotate(a);g.fillStyle=col;rr(g,-5,-2.5,10,5,2.5);g.fill();g.restore();}
function igDetail(g,x,y,s){g.lineCap='round';g.lineWidth=4;g.strokeStyle='#60a5fa';g.beginPath();g.moveTo(x-3,y+s*0.7);g.lineTo(x-3,y);g.lineTo(x-s*0.5,y-s*0.6);g.stroke();g.beginPath();g.moveTo(x+3,y+s*0.7);g.lineTo(x+3,y);g.lineTo(x+s*0.5,y-s*0.6);g.stroke();
  g.strokeStyle='#a7f3d0';g.lineWidth=3;g.beginPath();g.moveTo(x-s*0.22,y-s*0.04);g.lineTo(x-s*0.62,y-s*0.5);g.stroke();g.beginPath();g.moveTo(x+s*0.22,y-s*0.04);g.lineTo(x+s*0.62,y-s*0.5);g.stroke();
  g.fillStyle='#fde047';[-1,1].forEach(k=>{g.beginPath();g.arc(x+k*s*0.58,y-s*0.6,4,0,7);g.fill();});}
function igInset(g,x,y,w,h){panel(g,x,y,w,h);g.strokeStyle='#a78bfa';g.lineWidth=1;rr(g,x,y,w,h,10);g.stroke();T(g,'ชนิดของแอนติบอดี (Immunoglobulin)',x+8,y+12,'#c4b5fd',11,'left',true);
  const cw=w/4,cy=y+h*0.52,s=Math.min(cw*0.32,h*0.24);
  igDetail(g,x+cw*0.5,cy,s);T(g,'IgG (Monomer)',x+cw*0.5,y+h-22,'#93c5fd',10,'center',true);T(g,'มากสุด · ผ่านรกได้',x+cw*0.5,y+h-9,'#cbd5e1',9,'center');
  for(let i=0;i<5;i++){const a=i/5*6.283;Yab(g,x+cw*1.5+Math.sin(a)*s*0.55,cy-Math.cos(a)*s*0.55,s*0.6,a,'#f472b6',2);}T(g,'IgM (Pentamer)',x+cw*1.5,y+h-22,'#f9a8d4',10,'center',true);T(g,'หลั่งแรกสุด',x+cw*1.5,y+h-9,'#cbd5e1',9,'center');
  Yab(g,x+cw*2.5,cy-s*0.42,s*0.6,0,'#34d399',2);Yab(g,x+cw*2.5,cy+s*0.42,s*0.6,Math.PI,'#34d399',2);T(g,'IgA (Dimer)',x+cw*2.5,y+h-22,'#6ee7b7',10,'center',true);T(g,'น้ำนม น้ำลาย น้ำตา',x+cw*2.5,y+h-9,'#cbd5e1',9,'center');
  Yab(g,x+cw*3.5,cy,s*0.7,0,'#fbbf24',2.5);g.fillStyle='#a855f7';rr(g,x+cw*3.5-14,cy+s*0.42,28,8,4);g.fill();T(g,'IgE',x+cw*3.5,y+h-22,'#fde68a',10,'center',true);T(g,'เกาะ Mast cell · ภูมิแพ้',x+cw*3.5,y+h-9,'#cbd5e1',9,'center');
  T(g,'● Variable region จับ Ag',x+8,y+27,'#fde047',9);T(g,'— Heavy chain  — Light chain',x+cw*1.2,y+27,'#93c5fd',9);}
function mhcInset(g,x,y,w,h){panel(g,x,y,w,h);g.strokeStyle='#22d3ee';g.lineWidth=1;rr(g,x,y,w,h,10);g.stroke();T(g,'โมเลกุล MHC บนผิวเซลล์',x+8,y+12,'#67e8f9',11,'left',true);
  const c1=[x+w*0.2,y+h*0.58],c2=[x+w*0.62,y+h*0.58],r=Math.min(h*0.22,w*0.09);
  cell(g,c1[0],c1[1],r,'#7f1d1d','#fca5a5');for(let i=0;i<5;i++){const a=-1.2+i*0.6;cup(g,c1[0]+Math.cos(a)*r,c1[1]+Math.sin(a)*r,a,'#f472b6');}T(g,'MHC I – ทุกเซลล์ที่มีนิวเคลียส',c1[0],y+h-10,'#f9a8d4',9.5,'center',true);

    an=(!th?'<p><span class="tag no">ไม่มี Helper T</span> APC นำเสนอแอนติเจนได้ แต่ไม่มีเซลล์หลั่ง Cytokines → B cell และ Tc <b>ไม่ถูกกระตุ้น</b> ระบบทั้ง Humoral และ Cell-mediated ล้มเหลว (เหมือนผู้ป่วย AIDS)</p>':M2.cleared?'<p><span class="tag ok">กำจัดเชื้อสำเร็จ</span> เกิด <b>Immunological memory</b> (Memory B / T cell) ไว้ตอบสนองครั้งต่อไปอย่างรวดเร็ว</p>':'<p><span class="tag mid">กำลังตอบสนอง</span> ภูมิคุ้มกันจำเพาะใช้เวลาหลายวันกว่าจะสร้างแอนติบอดีได้มากพอ (Lag phase)</p>')+($('#ptype').value==='virus'?'<p>ไวรัสอยู่<b>ภายในเซลล์</b> แอนติบอดีเข้าไม่ถึง ต้องใช้ <b>Cytotoxic T cell</b> ที่จดจำชิ้นไวรัสบน <b>MHC I</b> แล้วหลั่ง Perforin/Granzymes ให้เซลล์ติดเชื้อตายแบบ Apoptosis</p>':'<p>แบคทีเรียอยู่<b>นอกเซลล์</b> กำจัดด้วย <b>Humoral immunity</b>: แอนติบอดีจับเชื้อ (Neutralization, Agglutination, Opsonization) แล้ว Phagocyte / Complement ทำลาย</p>')+`<p>g สั้นลง (แบ่งเร็ว) → N(t) เพิ่มเร็ว → กำจัดเชื้อได้เร็ว · ปัจจุบัน g = ${g} ชม.</p>`;
    mis=(!th?'<p><b>❌ "HIV ทำลายเม็ดเลือดแดง"</b> ✅ HIV ทำลาย <b>Helper T (CD4⁺)</b> ซึ่งเป็นศูนย์กลางกระตุ้นทั้ง B cell และ Tc — ดูผลเมื่อปิด Helper T</p>':'')+'<p><b>❌ "แอนติบอดีฆ่าเชื้อโรคโดยตรง"</b></p><p>✅ แอนติบอดี<b>ไม่ได้ฆ่าเชื้อเอง</b> แต่จับ ยับยั้ง (Neutralization) รวบกลุ่ม (Agglutination) หรือทำเครื่องหมาย (Opsonization) ให้ Phagocyte / Complement มาทำลาย</p><p><b>❌ "B cell ทุกตัวตอบสนองต่อเชื้อทุกชนิด"</b> ✅ เฉพาะ clone ที่มีตัวรับตรงกับ Epitope เท่านั้นที่ถูกคัดเลือก (Clonal selection)</p>';tb=TIG;}
  else if(m===3){const t=titers(M3.d),mem=hasMem(),last=[...M3.ev].reverse().find(e=>e.fired);st=[['Antibody titer (รวม)',t.tot.toFixed(2)],['IgM / IgG',`${t.m.toFixed(2)} / ${(t.g+t.ser).toFixed(2)}`],['เชื้อโรคที่เหลือ',fmtBig(M3.P)],['Memory cells',mem?'มี ✓':'ไม่มี']];

    eq=`Passive (เซรุ่ม): C(t) = C₀ · e^(−k·t) = 20 · e^(−${KEL}·t)   ·   t½ = ln2 / k = ${(Math.LN2/KEL).toFixed(0)} วัน${t.ser>0?`   → ตอนนี้ ${t.ser.toFixed(2)}`:''}\nPrimary: lag ~5–7 วัน IgM นำ IgG ระดับต่ำ  ·  Secondary: lag 1–3 วัน IgG สูงกว่า ~10–100 เท่า อยู่นาน`;

    mis='<p><b>❌ "วัคซีนกับเซรุ่มคือสิ่งเดียวกัน"</b></p><p>✅ <b>วัคซีน</b> = แอนติเจนที่อ่อนฤทธิ์ กระตุ้นให้ร่างกายสร้างแอนติบอดีและ Memory cell เอง (Active) · <b>เซรุ่ม</b> = แอนติบอดีสำเร็จรูป ออกฤทธิ์ทันทีแต่ไม่สร้าง Memory cell (Passive) — เทียบชุด Active กับ Passive</p><p><b>❌ "ฉีดวัคซีนแล้วป้องกันได้ทันที"</b> ✅ ต้องรอ 1–2 สัปดาห์ให้ร่างกายสร้างภูมิ</p>';tb=TAP;}
  else{const dis=$('#dis').value;
    if(dis==='hiv'){const y=V('yr'),c=cd4At(y),vl=vlAt(y),s=hivStage(c,y),k=HK[$('#load').value];st=[['CD4⁺ T cell count',Math.round(c)+' cells/µL'],['Viral load',vl<1.7?'< 50 copies/mL':'10^'+vl.toFixed(1)+' copies/mL'],['ระดับ Histamine','—'],['ระยะของโรค',s[0]]];

    else if(dis==='allergy'){const s=allergyStatus();st=[['CD4⁺ T cell count','ปกติ'],['IgE บน Mast cell',$('#sens').checked?'มี (Sensitized)':'ยังไม่มี'],['ระดับ Histamine',M4.H.toFixed(0)+' / 100'],['อาการ',s[0]]];

      an=`<p><span class="tag ${s[2]}">${s[0]}</span> ${s[1]}</p><p>ภูมิแพ้เป็นการตอบสนอง<b>มากเกินไป</b> (Hypersensitivity) ต่อสารที่ปกติไม่เป็นอันตราย ผ่าน <b>IgE</b> ที่เกาะบน Mast cell</p>`+($('#antiH').checked?'<p>Antihistamine บล็อกตัวรับ Histamine จึงลดอาการ แต่ Mast cell ยังหลั่ง Histamine อยู่</p>':'');

    else{const y=V('yr'),dm=dmgAt(y),t=$('#autoT').value;st=[['CD4⁺ T cell count','ปกติ / สูง'],['Autoantibody',t==='sle'?'สูง (anti-DNA)':t==='ra'?'Rheumatoid factor':'anti-islet'],['เนื้อเยื่อถูกทำลาย',Math.round(dm*100)+' %'],['ระยะเวลา',y.toFixed(1)+' ปี']];

$$('.modes button').forEach(b=>b.onclick=()=>setMode(+b.dataset.mode));

  $('#simTitle').textContent=['','บาดแผล การอักเสบ และ Phagocytosis','ภูมิคุ้มกันจำเพาะ: APC → Helper T → B cell / Tc','ระดับแอนติบอดีในเลือดตามเวลา (Active vs Passive)','ความผิดปกติของระบบภูมิคุ้มกัน'][m];

bind('gen',v=>v+' ชม.');bind('alg',v=>v+' %');bind('yr',v=>v.toFixed(1)+' ปี');
