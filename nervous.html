<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบประสาท – Interactive Biology Lab</title>
<style>
:root{--bg:#0a0816;--panel:#141127;--panel2:#1c1836;--line:#2e2856;--txt:#ece9ff;--mut:#a9a3d1;--acc:#a78bfa;--acc2:#fbbf24}
*{box-sizing:border-box}
body{margin:0;font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{padding:12px 18px;background:linear-gradient(90deg,#4c1d95,#0e7490);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:12px}
header h1{font-size:19px;margin:0}header .sub{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr) 370px;gap:12px;padding:12px}
@media(max-width:1280px){.grid{grid-template-columns:290px minmax(0,1fr)}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}.right .card{margin:0}}
@media(max-width:820px){.grid{grid-template-columns:1fr}.right{display:block}.right .card{margin-bottom:12px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:15px;color:var(--acc)}
.modes button{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;font:inherit;font-size:13px}
.modes button.on{background:#4c1d95;border-color:var(--acc)}
.ctl{margin:8px 0}.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:3px}.ctl label b{color:var(--acc2)}
input[type=range]{width:100%;accent-color:var(--acc)}
select{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--txt);margin:6px 0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.btn{padding:8px;border-radius:8px;border:1px solid var(--line);background:#231d45;color:var(--txt);cursor:pointer;font:inherit;font-size:13px}
.btn:hover{border-color:var(--acc)}.btn.pri{background:#6d28d9;border-color:#c4b5fd}
.switch{display:flex;background:var(--panel2);border-radius:9px;padding:3px;border:1px solid var(--line)}
.switch button{flex:1;border:0;background:transparent;color:var(--mut);padding:7px 4px;border-radius:7px;cursor:pointer;font:inherit;font-size:12px}
.switch button.on{background:#0e7490;color:#fff}
canvas{display:block;width:100%}
#main{height:470px;background:#07051a;border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel2);border-radius:10px;padding:8px;border:1px solid var(--line)}
.stat .k{font-size:11.5px;color:var(--mut)}.stat .v{font-size:16px;font-weight:700;color:var(--acc2);margin-top:2px}
.flow{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;align-items:center}
.flow span{padding:4px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-size:11.5px;color:var(--mut)}
.flow span.on{background:#6d28d9;color:#fff;border-color:#c4b5fd}.flow span.done{color:#ddd6fe;border-color:#4c1d95}.flow span.bad{background:#7f1d1d;color:#fecaca;border-color:#ef4444}
.flow i{color:var(--mut);font-style:normal;font-size:11px}
.eq{font-family:Consolas,monospace;background:#06041a;padding:10px;border-radius:8px;border-left:4px solid var(--acc);white-space:pre-wrap;font-size:13px;margin-top:10px;line-height:1.55}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{border:1px solid var(--line);padding:4px 5px;text-align:center}th{background:var(--panel2);color:var(--acc)}
.mis{background:#2a1a10;border-color:#7b4a1e}.mis h3{color:var(--acc2)}.mis p,.ana p{margin:6px 0;line-height:1.55}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:12px;margin-right:4px}
.ok{background:#14532d;color:#bbf7d0}.no{background:#7f1d1d;color:#fecaca}.mid{background:#713f12;color:#fde68a}
.hint{font-size:12px;color:var(--mut);line-height:1.5}
.chart{height:250px;background:#06041a;border-radius:8px}
</style>
<link rel="stylesheet" href="float-lab.css">
</head>
<body>
<header><a href="index.html" style="color:#8dffc0;text-decoration:none;font-weight:700;margin-right:6px">← หน้าแรก</a><h1>🧠 ระบบประสาท (Nervous System)</h1><span class="sub">ห้องปฏิบัติการเสมือนจริง ชีววิทยา ม.4–ม.6</span></header>
<div class="grid">
<div class="left">
  <div class="card modes"><h3>เลือกโหมดการจำลอง</h3>
    <button data-mode="1" class="on">โหมด 1 : วิวัฒนาการของระบบประสาทในสัตว์</button>
    <button data-mode="2">โหมด 2 : ศักย์ไฟฟ้าเยื่อหุ้มเซลล์และ Action potential</button>
    <button data-mode="3">โหมด 3 : ไซแนปส์ สารสื่อประสาท และสารพิษ/ยา</button>
    <button data-mode="4">โหมด 4 : สมอง รีเฟล็กซ์ และระบบประสาทอัตโนมัติ</button>
  </div>
  <div class="card"><h3>แผงควบคุมตัวแปร</h3>
    <div data-m="1">
      <div class="ctl"><label>สิ่งมีชีวิต</label><select id="org"><option value="amoeba">อะมีบา – ไม่มีระบบประสาท</option><option value="hydra">ไฮดรา – ร่างแหประสาท (Nerve net)</option><option value="planaria">พลานาเรีย – แบบขั้นบันได (Ladder-type)</option><option value="earthworm">ไส้เดือนดิน – Ventral nerve cord</option><option value="insect">แมลง – Ventral nerve cord + ปมประสาท</option><option value="human" selected>มนุษย์ – Dorsal hollow nerve cord</option></select></div>
      <button class="btn" id="stim1" style="width:100%">⚡ กระตุ้น</button>
    </div>
    <div data-m="2">
      <div class="ctl"><label>ขนาดสิ่งเร้า (Depolarization) <b id="stimAV"></b></label><input type="range" id="stimA" min="0" max="100" step="1" value="25"></div>
      <div class="ctl"><label>[Na⁺] นอกเซลล์ <b id="naoV"></b></label><input type="range" id="nao" min="50" max="200" step="5" value="145"></div>
      <div class="ctl"><label>[K⁺] นอกเซลล์ <b id="koV"></b></label><input type="range" id="ko" min="2" max="30" step="1" value="5"></div>
      <div class="ctl"><label>แอกซอน</label><select id="myel"><option value="my">มีเยื่อไมอีลิน (Myelinated)</option><option value="un">ไม่มีเยื่อไมอีลิน (Unmyelinated)</option></select></div>
      <div class="btns"><button class="btn" id="fire1">⚡ กระตุ้น 1 ครั้ง</button><button class="btn" id="fire2">⚡⚡ กระตุ้นติดกัน</button></div>
      <label class="chk"><input type="checkbox" id="auto2" checked> กระตุ้นอัตโนมัติทุก 10 ms</label>
    </div>
    <div data-m="2 3">
      <div class="ctl"><label>Ca²⁺ นอกเซลล์</label><select id="ca"><option value="zero">ไม่มี (Zero)</option><option value="normal" selected>ปกติ (Normal)</option><option value="high">สูง (High)</option></select></div>
      <div class="ctl"><label>สารพิษ / ยา</label><select id="tox"><option value="none">ไม่มี</option><option value="ttx">Tetrodotoxin (TTX – พิษปลาปักเป้า)</option><option value="botox">Botulinum toxin (Botox)</option><option value="ache">สารยับยั้ง AChE (ยาฆ่าแมลงกลุ่ม Organophosphate)</option><option value="ssri">SSRI (ยาต้านซึมเศร้า)</option></select></div>
    </div>
    <div data-m="3">
      <div class="ctl"><label>ไซแนปส์ / สารสื่อประสาท</label><select id="nt"><option value="ach">ACh – Neuromuscular junction (กระตุ้น)</option><option value="glu">Glutamate – ไซแนปส์กระตุ้น (EPSP)</option><option value="gaba">GABA – ไซแนปส์ยับยั้ง (IPSP)</option><option value="ser">Serotonin – ไซแนปส์ในสมอง</option></select></div>
      <div class="btns"><button class="btn" id="fire3" style="grid-column:1/-1">⚡ ส่งกระแสประสาท 1 ครั้ง</button></div>
      <label class="chk"><input type="checkbox" id="auto3" checked> ส่งกระแสประสาทต่อเนื่อง</label>
    </div>
    <div data-m="4">
      <div class="ctl"><label>มุมมอง</label><select id="view"><option value="brain">สมองและไขสันหลัง</option><option value="reflex" selected>Reflex arc</option><option value="ans">ระบบประสาทอัตโนมัติ (ANS)</option></select></div>
      <div class="ctl" id="regBox"><label>บริเวณสมอง</label><select id="region"><option value="cerebrum">Cerebrum (ซีรีบรัม)</option><option value="thalamus">Thalamus (ทาลามัส)</option><option value="hypothalamus">Hypothalamus (ไฮโพทาลามัส)</option><option value="midbrain">Midbrain (สมองส่วนกลาง)</option><option value="pons">Pons (พอนส์)</option><option value="medulla">Medulla oblongata (เมดัลลา)</option><option value="cerebellum">Cerebellum (ซีรีเบลลัม)</option><option value="spinal">Spinal cord (ไขสันหลัง)</option></select></div>
      <div class="ctl" id="rBox"><label>ชนิดรีเฟล็กซ์</label><select id="rtype"><option value="prick">ถูกเข็มตำมือ (Withdrawal reflex)</option><option value="knee">เคาะใต้สะบ้า (Knee-jerk reflex)</option></select></div>
      <button class="btn" id="fire4" style="width:100%">⚡ กระตุ้น</button>
      <div class="ctl"><label>ระบบประสาทอัตโนมัติ</label><select id="ans"><option value="neutral">สมดุล (Neutral)</option><option value="sym">Sympathetic (สู้หรือหนี)</option><option value="para">Parasympathetic (พักผ่อน/ย่อยอาหาร)</option></select></div>
    </div>
  </div>
  <div class="card"><h3>การควบคุมการจำลอง</h3>
    <div class="btns"><button class="btn pri" id="play">▶ เล่น</button><button class="btn" id="pause">⏸ หยุด</button><button class="btn" id="reset" style="grid-column:1/-1">↺ รีเซ็ต</button></div>
    <div class="ctl" style="margin-top:12px"><label>โหมดการแสดงผล (Toggle)</label>
      <div class="switch"><button id="tgDir" class="on">ทิศทางกระแสประสาท (Reflex)</button><button id="tgPsp">EPSP / IPSP · ระดับเซลล์</button></div></div>
  </div>
</div>
<div class="center"><div class="card">
  <h3 id="simTitle">หน้าจอจำลอง</h3>
  <canvas id="main"></canvas>
  <div class="stats" id="stats"></div>
  <div class="flow" id="flow"></div>
  <div class="eq" id="eq"></div>
</div></div>
<div class="right">
  <div class="card"><h3 id="chartTitle">กราฟ</h3><canvas id="chart" class="chart"></canvas><div id="tableBox" style="margin-top:8px"></div></div>
  <div class="card ana"><h3>📋 บทวิเคราะห์</h3><div id="analysis"></div></div>
  <div class="card mis"><h3>⚠️ ข้อเข้าใจคลาดเคลื่อนที่พบบ่อย</h3><div id="mis"></div></div>
</div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function fit(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const W=Math.max(1,Math.round(r.width*d)),H=Math.max(1,Math.round(r.height*d));if(c.width!==W||c.height!==H){c.width=W;c.height=H;}const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);return{g,w:r.width,h:r.height};}
function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
const FONT='"Sarabun","Leelawadee UI",Tahoma,sans-serif';
function T(g,s,x,y,col='#ece9ff',size=12,align='left',bold=false){g.fillStyle=col;g.font=(bold?'700 ':'')+size+'px '+FONT;g.textAlign=align;g.textBaseline='middle';g.fillText(s,x,y);}
function wrap(g,s,x,y,mw,lh,col,size,bold){g.font=(bold?'700 ':'')+size+'px '+FONT;const lines=[];let cur='';for(const ch of s){const t=cur+ch;if(g.measureText(t).width>mw&&cur&&!/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/.test(ch)){const sp=cur.lastIndexOf(' ');if(sp>cur.length*0.5){lines.push(cur.slice(0,sp));cur=cur.slice(sp+1)+ch;}else{lines.push(cur);cur=ch;}}else cur=t;}if(cur)lines.push(cur);lines.forEach((l,i)=>T(g,l,x,y+i*lh,col,size,'left',bold));return y+lines.length*lh;}
function arrow(g,x1,y1,x2,y2,col,lw=2,dash){g.strokeStyle=col;g.fillStyle=col;g.lineWidth=lw;g.setLineDash(dash||[]);g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.setLineDash([]);const a=Math.atan2(y2-y1,x2-x1);g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-8*Math.cos(a-0.45),y2-8*Math.sin(a-0.45));g.lineTo(x2-8*Math.cos(a+0.45),y2-8*Math.sin(a+0.45));g.closePath();g.fill();}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,sm=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
function hash(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const V=id=>+$('#'+id).value;
const S={mode:1,running:true,toggle:'dir',time:0};
function bar(g,x,y,w,h,v,col,label,txt){g.fillStyle='#231d45';rr(g,x,y,w,h,4);g.fill();g.fillStyle=col;rr(g,x,y,w*clamp(v,0,1),h,4);g.fill();if(label)T(g,label,x,y-8,'#d8d3f5',10.5);if(txt)T(g,txt,x+w,y-8,'#fde68a',10.5,'right',true);}
function along(P,s){const L=[0];for(let i=1;i<P.length;i++)L.push(L[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));const d=clamp(s,0,1)*L[L.length-1];let i=1;while(i<L.length-1&&L[i]<d)i++;const t=(d-L[i-1])/((L[i]-L[i-1])||1);return[lerp(P[i-1][0],P[i][0],t),lerp(P[i-1][1],P[i][1],t)];}
function flow(g,P,n,speed,col,r=3,off=0){for(let j=0;j<n;j++){const s=(S.time*speed+j/n+off)%1;const [x,y]=along(P,s);g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill();}}
function panel(g,x,y,w,h){g.fillStyle='rgba(16,13,38,.94)';rr(g,x,y,w,h,10);g.fill();}
function line(g,P,col,lw){g.strokeStyle=col;g.lineWidth=lw;g.lineJoin='round';g.lineCap='round';g.beginPath();P.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();}
function glow(g,x,y,r,col){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
function pulse(g,P,s,col='#fde047'){if(s<0||s>1)return;const [x,y]=along(P,s);glow(g,x,y,16,'rgba(253,224,71,.8)');g.fillStyle=col;g.beginPath();g.arc(x,y,4.5,0,7);g.fill();}
function flowBar(steps,cur,bad=-1){$('#flow').innerHTML=steps.map((s,i)=>`<span class="${i===bad?'bad':i===cur?'on':cur>=0&&i<cur?'done':''}">${s}</span>`).join('<i>→</i>');}

/* ================= MODE 1 : EVOLUTION ================= */
const ORG={amoeba:{n:'อะมีบา',t:'ไม่มีระบบประสาท',c:'ไม่มีศูนย์กลาง',neu:0,f:'เยื่อหุ้มเซลล์รับสิ่งเร้าโดยตรง ตอบสนองด้วยการเคลื่อนที่หนี/เข้าหา',steps:['สิ่งเร้า','เยื่อหุ้มเซลล์รับรู้','เคลื่อนที่หนี/เข้าหา']},
 hydra:{n:'ไฮดรา',t:'ร่างแหประสาท (Nerve net)',c:'ไม่มีศูนย์กลาง',neu:5600,f:'เซลล์ประสาทเชื่อมกันเป็นร่างแหทั่วลำตัว กระแสประสาทกระจายได้ทุกทิศทาง',steps:['สิ่งเร้าที่หนวด','กระแสประสาทกระจายทุกทิศทาง','ทั้งตัวหดตัว']},
 planaria:{n:'พลานาเรีย',t:'แบบขั้นบันได (Ladder-type)',c:'ปมประสาทสมอง (Cerebral ganglia) 1 คู่',neu:1e4,f:'มีเส้นประสาทใหญ่ตามยาว 2 เส้นเชื่อมด้วยเส้นประสาทตามขวาง และเริ่มมีส่วนหัว (Cephalization)',steps:['สิ่งเร้าที่ลำตัว','Nerve cord ตามยาว','Cerebral ganglia','สั่งการกล้ามเนื้อ']},
 earthworm:{n:'ไส้เดือนดิน',t:'Ventral nerve cord (ด้านท้อง ตัน)',c:'Cerebral ganglion + ปมประสาทประจำปล้อง',neu:2e5,f:'ปมประสาทสมองอยู่เหนือคอหอย เชื่อมกับปมประสาทใต้คอหอย แล้วต่อเป็นเส้นประสาทด้านท้อง มีปมประสาท (Segmental ganglion) ทุกปล้อง',steps:['สิ่งเร้าที่ปล้อง','ปมประสาทประจำปล้อง','Ventral nerve cord','Cerebral ganglion','กล้ามเนื้อหลายปล้อง']},
 insect:{n:'แมลง',t:'Ventral nerve cord + ปมประสาทรวมกลุ่ม',c:'สมอง (Supraesophageal ganglion) + ปมประสาทอก',neu:1e6,f:'ปมประสาทอกควบคุมขาและปีกได้เองบางส่วน สมองเจริญดีขึ้น (ตารวม หนวด)',steps:['สิ่งเร้าที่ขา','ปมประสาทอก','สั่งการขา (ทำได้เอง)','ส่งต่อสมอง']},
 human:{n:'มนุษย์',t:'Dorsal hollow nerve cord (ด้านหลัง กลวง)',c:'สมอง + ไขสันหลัง (CNS)',neu:8.6e10,f:'ระบบประสาทส่วนกลาง (สมอง + ไขสันหลัง) และระบบประสาทรอบนอก (เส้นประสาทสมอง 12 คู่ ไขสันหลัง 31 คู่)',steps:['Receptor','Sensory neuron','ไขสันหลัง / สมอง','Motor neuron','Effector']}};
let M1;function initM1(){M1={t:0,st:0.3};}
function stepM1(dt){M1.t+=dt;if(M1.t-M1.st>5)M1.st=M1.t;}
function neuronDiagram(g,x,y,w){const sx=x+30,sy=y+30;for(let i=0;i<6;i++){const a=Math.PI*0.6+i*0.35;line(g,[[sx,sy],[sx+Math.cos(a)*24,sy+Math.sin(a)*24],[sx+Math.cos(a+0.3)*34,sy+Math.sin(a+0.3)*34]],'#c4b5fd',2);}

const ANSV={neutral:{hr:72,pu:4,gut:1,br:1,sal:1,glu:1},sym:{hr:125,pu:7,gut:0.3,br:1.5,sal:0.4,glu:1.6},para:{hr:58,pu:2.5,gut:1.8,br:0.7,sal:1.8,glu:0.9}};
function drawBrain(g,w,h,X,Y,UW){const r=$('#region').value,hl=k=>k===r;const cx=X(0.5),cy=Y(0.42);

  g.strokeStyle='rgba(221,214,254,.35)';g.lineWidth=1.5;for(let i=0;i<9;i++){g.beginPath();g.arc(cx-X(0.25)+i*X(0.065),cy-Y(0.16)+Math.sin(i)*Y(0.04),X(0.04),Math.PI*1.1,Math.PI*1.9);g.stroke();}

  reg('hypothalamus',()=>{g.fillStyle='rgba(244,114,182,.5)';g.beginPath();g.ellipse(cx-X(0.04),cy+Y(0.09),X(0.035),Y(0.03),0,0,7);});g.fillStyle='#f472b6';g.beginPath();g.arc(cx-X(0.06),cy+Y(0.15),5,0,7);g.fill();T(g,'ต่อมใต้สมอง',cx-X(0.08),cy+Y(0.17),'#f9a8d4',9,'right');
  reg('midbrain',()=>{g.fillStyle='rgba(251,146,60,.5)';rr(g,cx+X(0.02),cy+Y(0.07),X(0.06),Y(0.07),6);});

  [['Cerebrum',cx-X(0.22),cy-Y(0.05)],['Thalamus',cx+X(0.07),cy+Y(0.0)],['Hypothalamus',cx-X(0.1),cy+Y(0.09)],['Midbrain',cx+X(0.09),cy+Y(0.1)],['Pons',cx-X(0.0),cy+Y(0.21)],['Medulla',cx+X(0.11),cy+Y(0.3)],['Cerebellum',cx+X(0.2),cy+Y(0.28)],['Spinal cord',cx+X(0.1),cy+Y(0.5)]].forEach(([s,x,y])=>T(g,s,x,y,'#ece9ff',10,'center',true));
  T(g,'ด้านหน้า ←',X(0.03),Y(0.05),'#a9a3d1',10);T(g,'สมองส่วนหน้า: Cerebrum, Thalamus, Hypothalamus · ส่วนกลาง: Midbrain · ส่วนหลัง: Pons, Medulla, Cerebellum',X(0.02),Y(0.96),'#c4b5fd',9.5);T(g,'ก้านสมอง (Brainstem) = Midbrain + Pons + Medulla',X(0.02),Y(0.91),'#fde68a',9.5);}
function drawReflex(g,w,h,X,Y,UW){const kn=$('#rtype').value==='knee',tau=M4.t-M4.ft,sc=[X(0.68),Y(0.42)],R=Y(0.2),dir=S.toggle==='dir';

  g.fillStyle='#07051a';g.beginPath();g.arc(sc[0],sc[1],3,0,7);g.fill();T(g,'Gray matter',sc[0],sc[1]-R*1.15,'#cbd5e1',9.5,'center');T(g,'White matter',sc[0]+R*1.15,sc[1]-R*0.6,'#e2e8f0',9.5,'left');
  const drg=[sc[0]-R*0.55,sc[1]-R*1.35];g.fillStyle='#a78bfa';g.beginPath();g.ellipse(drg[0],drg[1],12,9,0,0,7);g.fill();T(g,'Dorsal root ganglion',drg[0]-16,drg[1]-14,'#c4b5fd',9.5,'right');
  const dh=[sc[0]-R*0.4,sc[1]-R*0.55],vh=[sc[0]-R*0.45,sc[1]+R*0.55],inn=[sc[0]-R*0.2,sc[1]+R*0.05];
  const rec=kn?[X(0.12),Y(0.62)]:[X(0.08),Y(0.24)],eff=kn?[X(0.2),Y(0.5)]:[X(0.22),Y(0.4)];
  const sens=[rec,[X(0.3),rec[1]-Y(0.1)],[drg[0]-60,drg[1]],drg,dh];const mot=kn?[dh,vh,[sc[0]-R*1.2,sc[1]+R*1.2],[X(0.35),Y(0.75)],eff]:[dh,inn,vh,[sc[0]-R*1.2,sc[1]+R*1.2],[X(0.36),Y(0.7)],eff];
  line(g,sens,'#38bdf8',3);line(g,mot,'#f87171',3);if(!kn){g.fillStyle='#fbbf24';g.beginPath();g.arc(inn[0],inn[1],6,0,7);g.fill();T(g,'Interneuron',inn[0]+10,inn[1],'#fbbf24',9.5);}
  g.fillStyle='#f87171';g.beginPath();g.arc(vh[0],vh[1],7,0,7);g.fill();line(g,[dh,[sc[0]-R*0.1,sc[1]-R*1.0],[sc[0]-R*0.1,4]],'rgba(196,181,253,.5)',2);T(g,'ส่งต่อไปสมอง → รู้สึก',sc[0]-R*0.1+6,14,'#c4b5fd',9.5);
  const s1=0.9,s2=kn?0.5:0.8;pulse(g,sens,tau/s1);pulse(g,mot,(tau-s1)/s2);pulse(g,[dh,[sc[0]-R*0.1,sc[1]-R*1.0],[sc[0]-R*0.1,4]],(tau-s1)/1.4);const resp=tau>s1+s2&&tau<s1+s2+1.4;
  if(kn){const hip=[X(0.04),Y(0.42)],knee=[X(0.2),Y(0.55)],a=resp?0.9:0.15,ft=[knee[0]+Math.sin(a)*Y(0.28),knee[1]+Math.cos(a)*Y(0.28)];line(g,[hip,knee,ft],'#e7e5e4',8);g.fillStyle='#ef4444';g.globalAlpha=resp?1:0.4;line(g,[[hip[0]+4,hip[1]-8],[knee[0]+2,knee[1]-10]],'#ef4444',7);g.globalAlpha=1;T(g,'ค้อนเคาะ Patellar tendon',rec[0],rec[1]+18,'#fde047',10,'center');T(g,'Quadriceps '+(resp?'หด → เตะขา':''),X(0.02),Y(0.36),'#fca5a5',10.5,'left',true);
    if(S.toggle==='psp'){T(g,'Hamstrings ถูกยับยั้ง (IPSP ผ่าน Inhibitory interneuron)',X(0.02),Y(0.92),'#bef264',10.5,'left',true);T(g,'Quadriceps motor neuron ได้ EPSP',X(0.02),Y(0.97),'#fca5a5',10.5,'left',true);}}
  else{const sh=[X(0.2),Y(0.22)],el=[X(0.22),Y(0.42)],a=resp?-0.6:0.6,hd=[el[0]-Math.cos(a)*Y(0.22),el[1]-Math.sin(a)*Y(0.15)];line(g,[sh,el,hd],'#e7e5e4',7);T(g,'📍 เข็ม',rec[0]-4,rec[1]-18,'#fde047',10.5,'center',true);T(g,'Biceps '+(resp?'หด → ชักมือหนี':''),X(0.02),Y(0.5),'#fca5a5',10.5,'left',true);
    if(S.toggle==='psp'){T(g,'Interneuron: EPSP → Motor neuron ของ Biceps',X(0.02),Y(0.92),'#fca5a5',10.5,'left',true);T(g,'IPSP → Motor neuron ของ Triceps (ให้คลาย)',X(0.02),Y(0.97),'#bef264',10.5,'left',true);}}
  T(g,'Sensory neuron',X(0.32),rec[1]-Y(0.13),'#38bdf8',10,'center',true);T(g,'Motor neuron',X(0.38),Y(0.78),'#f87171',10,'center',true);

  T(g,'Sympathetic',X(0.27),Y(0.05),sOn?'#fca5a5':'#a9a3d1',12,'center',true);T(g,'(Thoracolumbar)',X(0.27),Y(0.1),'#a9a3d1',9.5,'center');T(g,'Parasympathetic',X(0.73),Y(0.05),pOn?'#86efac':'#a9a3d1',12,'center',true);T(g,'(Craniosacral)',X(0.73),Y(0.1),'#a9a3d1',9.5,'center');
  const orgs=[['รูม่านตา',Y(0.22)],['หัวใจ',Y(0.38)],['หลอดลม',Y(0.54)],['ทางเดินอาหาร',Y(0.7)],['ตับ (ปล่อยกลูโคส)',Y(0.85)]];
  const sc=sOn?'#f87171':'rgba(248,113,113,.35)',pc=pOn?'#4ade80':'rgba(74,222,128,.35)';
  orgs.forEach(([n,y],i)=>{const sy=Y(0.35)+i*Y(0.075),sg=[X(0.18),sy],sp=[[lx,sy],sg,[ox-24,y]];line(g,[sp[0],sg],sc,2.5);line(g,[sg,sp[2]],sc,2.5);g.fillStyle='#ef4444';g.beginPath();g.arc(sg[0],sg[1],4.5,0,7);g.fill();
    if(i<4){const py=i===3?Y(0.8):Y(0.13)+i*5,pg=[X(0.62),y],pp=[[rx,py],[X(0.7),py],[X(0.7),y],pg,[ox+24,y]];line(g,pp.slice(0,4),pc,2.5);line(g,[pg,pp[4]],pc,2.5);g.fillStyle='#22c55e';g.beginPath();g.arc(pg[0],pg[1],4.5,0,7);g.fill();if(pOn)pulse(g,pp,((S.time*0.6)+i*0.2)%1);}
    if(sOn)pulse(g,sp,((S.time*0.6)+i*0.2)%1);
    T(g,n,ox,y-19,'#ece9ff',10,'center',true);});
  g.fillStyle='#e2e8f0';g.beginPath();g.ellipse(ox,orgs[0][1],14,9,0,0,7);g.fill();g.fillStyle='#92400e';g.beginPath();g.arc(ox,orgs[0][1],7,0,7);g.fill();g.fillStyle='#000';g.beginPath();g.arc(ox,orgs[0][1],v.pu*0.85,0,7);g.fill();
  const hb=1+0.12*Math.max(0,Math.sin(S.time*v.hr/60*6.283));g.fillStyle='#ef4444';g.beginPath();g.arc(ox,orgs[1][1],9*hb,0,7);g.fill();T(g,v.hr+' bpm',ox+16,orgs[1][1]+4,'#fca5a5',9.5,'left',true);
  g.strokeStyle='#93c5fd';g.lineWidth=2;g.beginPath();g.arc(ox,orgs[2][1],5*v.br,0,7);g.stroke();
  g.strokeStyle='#fdba74';g.lineWidth=3;g.beginPath();for(let i=0;i<=20;i++){const x=ox-20+i*2,y=orgs[3][1]+Math.sin(i*0.8-S.time*4*v.gut)*5*v.gut;i?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();

function drawM4(g,w,h){g.fillStyle='#07051a';g.fillRect(0,0,w,h);const vw=$('#view').value,UW=w,X=f=>f*UW,Y=f=>f*h;
  if(vw==='brain'){const BW=w*0.62,XB=f=>f*BW;drawBrain(g,BW,h,XB,Y,BW);const r=REG[$('#region').value],px=BW+8,pw=w-px-8;panel(g,px,8,pw,h-16);let y=30;T(g,r.n,px+10,y,'#fde047',13,'left',true);y+=20;T(g,r.p,px+10,y,'#a9a3d1',10.5);y+=22;T(g,'หน้าที่',px+10,y,'#a78bfa',11,'left',true);y=wrap(g,r.f,px+10,y+16,pw-20,15,'#ece9ff',11)+8;T(g,'ถ้าเสียหาย',px+10,y,'#fca5a5',11,'left',true);wrap(g,r.d,px+10,y+16,pw-20,15,'#fecaca',11);}
  else if(vw==='reflex')drawReflex(g,w,h,X,Y,UW);else drawANS(g,w,h,X,Y,UW);}

function axes(g,w,h,x0,x1,y0,y1,xl,yl,nx=5,ny=4,fx,fy){const L=44,Rm=10,Tm=12,B=34;const X=v=>L+(v-x0)/(x1-x0)*(w-L-Rm),Y=v=>h-B-(v-y0)/(y1-y0)*(h-B-Tm);
  g.strokeStyle='#231d45';g.lineWidth=1;for(let i=0;i<=ny;i++){const v=y0+(y1-y0)*i/ny;g.beginPath();g.moveTo(L,Y(v));g.lineTo(w-Rm,Y(v));g.stroke();T(g,fy?fy(v):fmtN(v),L-4,Y(v),'#a9a3d1',10,'right');}
  for(let i=0;i<=nx;i++){const v=x0+(x1-x0)*i/nx;T(g,fx?fx(v):fmtN(v),X(v),h-B+10,'#a9a3d1',10,'center');}
  g.strokeStyle='#4b4675';g.beginPath();g.moveTo(L,Tm);g.lineTo(L,h-B);g.lineTo(w-Rm,h-B);g.stroke();T(g,xl,(L+w)/2,h-8,'#a9a3d1',11,'center');
  g.save();g.translate(11,(Tm+h-B)/2);g.rotate(-Math.PI/2);T(g,yl,0,0,'#a9a3d1',11,'center');g.restore();return{X,Y,L,B,Tm,Rm};}

    else f.push(p.nt==='gaba'?'<span class="tag ok">IPSP</span> GABA เปิดช่อง Cl⁻ → Cl⁻ เข้า ศักย์ติดลบมากขึ้น ยากต่อการเกิด AP':p.nt==='ach'?'<span class="tag ok">ปกติ</span> ACh ที่ Neuromuscular junction ทำให้เกิด AP ที่กล้ามเนื้อทุกครั้ง แล้ว AChE สลาย ACh อย่างรวดเร็ว':'<span class="tag ok">EPSP</span> สารสื่อประสาทเปิดช่อง Na⁺ ศักย์สูงขึ้นเล็กน้อย ต้องรวมกันหลายครั้ง (Summation) จึงถึง Threshold');
    if(p.ca==='high'&&p.ap)f.push('Ca²⁺ สูง → ปล่อยสารสื่อประสาทมากขึ้น');an=f.map(x=>`<p>${x}</p>`).join('');
    mis='<p><b>❌ "สารสื่อประสาทเข้าไปในเซลล์หลังไซแนปส์"</b></p><p>✅ สารสื่อประสาท<b>จับกับ Receptor บนเยื่อหุ้มเซลล์</b>เท่านั้น แล้วถูกสลาย (AChE) หรือดูดกลับ (Reuptake)</p><p><b>❌ "ไซแนปส์ส่งกระแสประสาทได้ทั้งสองทาง"</b> ✅ ไซแนปส์เคมีส่ง<b>ทางเดียว</b> จากก่อนไปหลังไซแนปส์</p>';tb=T3;}
  else{const vw=$('#view').value,a=$('#ans').value,v=ANSV[a];st=[['อัตราการเต้นหัวใจ',v.hr+' bpm'],['รูม่านตา',v.pu+' mm'],['การบีบตัวลำไส้',v.gut<1?'ลดลง':v.gut>1?'เพิ่มขึ้น':'ปกติ'],['หลอดลม',v.br>1?'ขยาย':v.br<1?'หดตัว':'ปกติ']];
    const kn=$('#rtype').value==='knee',tau=M4.t-M4.ft;
    if(vw==='reflex'){const steps=kn?['Receptor (Muscle spindle)','Sensory neuron','ไขสันหลัง (Monosynaptic)','Motor neuron','Quadriceps หด']:['Receptor (Nociceptor)','Sensory neuron','Interneuron (ไขสันหลัง)','Motor neuron','Biceps หด ชักมือ'];flowBar(steps,Math.min(4,Math.floor(tau/0.45)));
      eq=`Reflex arc: Receptor → Sensory neuron → ${kn?'':'Interneuron → '}Motor neuron → Effector\nเวลาตอบสนอง ≈ ระยะทาง / ความเร็ว ≈ 2 m ÷ 60 m/s ≈ 30 ms (เร็วกว่าการคิดสั่งการผ่านสมอง)`;
      an=`<p><span class="tag ok">${kn?'Knee-jerk (Monosynaptic)':'Withdrawal (Polysynaptic)'}</span> ไขสันหลังสั่งการกล้ามเนื้อได้ทันทีโดย<b>ไม่ต้องรอสมอง</b> ส่วนกระแสประสาทที่ส่งต่อขึ้นสมองทำให้<b>รู้สึก</b>ทีหลัง</p><p>${kn?'ใช้ตรวจความสมบูรณ์ของไขสันหลังและเส้นประสาท':'Interneuron ยังส่ง IPSP ยับยั้งกล้ามเนื้อคู่ตรงข้าม (Triceps) ให้คลาย'}</p>`;}
    else if(vw==='brain'){const r=REG[$('#region').value];flowBar(['สมองส่วนหน้า','สมองส่วนกลาง','สมองส่วนหลัง','ไขสันหลัง'],{cerebrum:0,thalamus:0,hypothalamus:0,midbrain:1,pons:2,medulla:2,cerebellum:2,spinal:3}[$('#region').value]);
      eq='สมองส่วนหน้า (Forebrain): Cerebrum, Thalamus, Hypothalamus, Olfactory bulb\nสมองส่วนกลาง (Midbrain) · สมองส่วนหลัง (Hindbrain): Pons, Medulla oblongata, Cerebellum\nก้านสมอง (Brainstem) = Midbrain + Pons + Medulla oblongata';an=`<p><b>${r.n}</b> — ${r.f}</p><p>ถ้าเสียหาย: ${r.d}</p>`;}
    else{flowBar(['CNS','เส้นใยก่อนปมประสาท (ACh)','ปมประสาท','เส้นใยหลังปมประสาท ('+(a==='para'?'ACh':'NE')+')','อวัยวะเป้าหมาย'],a==='neutral'?-1:Math.floor(S.time*1.5)%5);
      eq='Sympathetic: CNS —(สั้น, ACh)→ ปมประสาทข้างไขสันหลัง —(ยาว, NE)→ อวัยวะ\nParasympathetic: CNS —(ยาว, ACh)→ ปมประสาทใกล้/ในอวัยวะ —(สั้น, ACh)→ อวัยวะ';
      an={neutral:'<p><span class="tag ok">สมดุล</span> ทั้งสองระบบทำงานควบคู่กันแบบตรงข้าม (Antagonistic) ปรับอวัยวะภายในให้เหมาะสม</p>',sym:'<p><span class="tag no">Sympathetic</span> ภาวะ "สู้หรือหนี": หัวใจเต้นเร็ว รูม่านตาขยาย หลอดลมขยาย ปล่อยกลูโคส ลดการย่อยอาหาร และกระตุ้นต่อมหมวกไตชั้นในให้หลั่ง Epinephrine</p>',para:'<p><span class="tag ok">Parasympathetic</span> ภาวะ "พักผ่อนและย่อยอาหาร": หัวใจเต้นช้า รูม่านตาเล็ก ลำไส้บีบตัว หลั่งน้ำลายและน้ำย่อยมากขึ้น (เส้นประสาท Vagus เป็นหลัก)</p>'}[a];}
    mis='<p><b>❌ "สมองส่วนกลาง (Midbrain) ใช้คิดและตัดสินใจ"</b></p><p>✅ การคิดเกิดที่ <b>Cerebrum</b> ส่วน Midbrain เป็นศูนย์ Reflex เกี่ยวกับตาและหู</p><p><b>❌ "Reflex ทุกชนิดต้องสั่งการจากสมอง"</b> ✅ Spinal reflex สั่งการที่<b>ไขสันหลัง</b> สมองรับรู้ทีหลัง</p><p><b>❌ "Sympathetic กระตุ้นทุกอวัยวะ"</b> ✅ Sympathetic <b>ยับยั้ง</b>การทำงานของทางเดินอาหาร</p>';tb=T4;}
  stats(st);$('#eq').textContent=eq;$('#analysis').innerHTML=an;$('#mis').innerHTML=mis;$('#tableBox').innerHTML=tb;}

/* ================= UI ================= */
$$('.modes button').forEach(b=>b.onclick=()=>setMode(+b.dataset.mode));
function sync4(){const v=$('#view').value;$('#regBox').style.display=v==='brain'?'':'none';$('#rBox').style.display=v==='reflex'?'':'none';$('#fire4').style.display=v==='reflex'?'':'none';}
function setMode(m){S.mode=m;$$('.modes button').forEach(b=>b.classList.toggle('on',+b.dataset.mode===m));$$('[data-m]').forEach(e=>e.style.display=e.dataset.m.split(' ').includes(String(m))?'':'none');sync4();
  $('#simTitle').textContent=['','วิวัฒนาการของระบบประสาท','เยื่อหุ้มเซลล์ประสาท ช่องไอออน และการนำกระแสประสาท','ไซแนปส์เคมีและผลของสารพิษ/ยา','สมอง รีเฟล็กซ์ และระบบประสาทอัตโนมัติ'][m];
  $('#chartTitle').textContent=['','จำนวนเซลล์ประสาท (สเกล log)','Action potential (Oscilloscope)','ศักย์หลังไซแนปส์และสารสื่อประสาท','ผลของระบบประสาทอัตโนมัติต่ออวัยวะ'][m];updateText();}
const bind=(id,fmt)=>{const el=$('#'+id);const f=()=>{$('#'+id+'V').textContent=fmt(+el.value);};el.addEventListener('input',()=>{f();updateText();});f();return f;};
bind('stimA',v=>'+'+v+' mV');bind('nao',v=>v+' mM');bind('ko',v=>v+' mM');
['org','myel','ca','tox','nt','region','rtype','ans'].forEach(id=>$('#'+id).addEventListener('change',updateText));$('#view').addEventListener('change',()=>{sync4();updateText();});
$('#stim1').onclick=()=>{M1.st=M1.t;};$('#fire1').onclick=()=>{tryAP(V('stimA'));updateText();};$('#fire2').onclick=()=>{tryAP(V('stimA'));M2.pend=M2.t+2.5;updateText();};$('#fire3').onclick=()=>fire3();$('#fire4').onclick=()=>{M4.ft=M4.t;};
$('#play').onclick=()=>S.running=true;$('#pause').onclick=()=>S.running=false;
$('#reset').onclick=()=>{({1:initM1,2:initM2,3:initM3,4:initM4})[S.mode]();updateText();};
const TG={tgDir:'dir',tgPsp:'psp'};Object.keys(TG).forEach(id=>$('#'+id).onclick=()=>{S.toggle=TG[id];Object.keys(TG).forEach(j=>$('#'+j).classList.toggle('on',j===id));updateText();});
initM1();initM2();initM3();initM4();
let last=performance.now(),accT=0;
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;const sdt=S.running?dt:0;S.time+=sdt;if(sdt>0)[null,stepM1,stepM2,stepM3,stepM4][S.mode](sdt);
  const {g,w,h}=fit($('#main'));g.clearRect(0,0,w,h);[null,drawM1,drawM2,drawM3,drawM4][S.mode](g,w,h);drawChart();accT+=dt;if(accT>0.4){accT=0;updateText();}requestAnimationFrame(loop);}
setMode(1);requestAnimationFrame(loop);
</script>
