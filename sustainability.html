<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>มนุษย์กับความยั่งยืนของทรัพยากรและสิ่งแวดล้อม – Interactive Biology Lab</title>
<style>
:root{--bg:#060b12;--panel:#0d1622;--panel2:#13202f;--line:#23384f;--txt:#eef6fd;--mut:#b3c6d8;--acc:#38bdf8;--acc2:#fbbf24;--on:#0c4a6e;--pri:#0369a1;--sw:#b45309;--deep:#070d15;--h1:#0c4a6e;--h2:#78350f;--btn:#14243a}
*{box-sizing:border-box}
body{margin:0;font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{padding:12px 18px;background:linear-gradient(90deg,var(--h1),var(--h2));border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:12px}
header h1{font-size:19px;margin:0}header .sub{color:#e0f2fe;opacity:.85;font-size:13px}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr) 370px;gap:12px;padding:12px}
@media(max-width:1280px){.grid{grid-template-columns:290px minmax(0,1fr)}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}.right .card{margin:0}}
@media(max-width:820px){.grid{grid-template-columns:1fr}.right{display:block}.right .card{margin-bottom:12px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:15px;color:var(--acc)}
.modes button{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;font:inherit;font-size:13px}
.modes button.on{background:var(--on);border-color:var(--acc)}
.ctl{margin:8px 0}.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:3px}.ctl label b{color:var(--acc2)}
input[type=range]{width:100%;accent-color:var(--acc)}
select{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--txt);margin:6px 0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.btn{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--btn);color:var(--txt);cursor:pointer;font:inherit;font-size:13px}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--pri);border-color:var(--acc)}.btn.ffon{background:#b45309;border-color:#fbbf24}
.switch{display:flex;background:var(--panel2);border-radius:9px;padding:3px;border:1px solid var(--line)}
.switch button{flex:1;border:0;background:transparent;color:var(--mut);padding:7px 4px;border-radius:7px;cursor:pointer;font:inherit;font-size:12px}
.switch button.on{background:var(--sw);color:#fff}
canvas{display:block;width:100%}
#main{height:470px;background:var(--deep);border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel2);border-radius:10px;padding:8px;border:1px solid var(--line)}
.stat .k{font-size:11.5px;color:var(--mut)}.stat .v{font-size:16px;font-weight:700;color:var(--acc2);margin-top:2px}
.flow{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;align-items:center}
.flow span{padding:4px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-size:11.5px;color:var(--mut)}
.flow span.on{background:var(--pri);color:#fff;border-color:var(--acc)}.flow span.done{color:var(--txt);border-color:var(--on)}.flow span.bad{background:#7f1d1d;color:#fecaca;border-color:#ef4444}
.flow i{color:var(--mut);font-style:normal;font-size:11px}
.eq{font-family:Consolas,monospace;background:var(--deep);padding:10px;border-radius:8px;border-left:4px solid var(--acc);white-space:pre-wrap;font-size:13px;margin-top:10px;line-height:1.55}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{border:1px solid var(--line);padding:4px 5px;text-align:center}th{background:var(--panel2);color:var(--acc)}
.mis{background:#1f170b;border-color:#6b4a1e}.mis h3{color:#fbbf24}.mis p,.ana p{margin:6px 0;line-height:1.55}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:12px;margin-right:4px}
.ok{background:#14532d;color:#bbf7d0}.no{background:#7f1d1d;color:#fecaca}.mid{background:#713f12;color:#fde68a}
.chart{height:250px;background:var(--deep);border-radius:8px}
</style>
<link rel="stylesheet" href="float-lab.css">
</head>
<body>
<header><a href="index.html" style="color:#8dffc0;text-decoration:none;font-weight:700;margin-right:6px">← หน้าแรก</a><h1>🌏 มนุษย์กับความยั่งยืนของทรัพยากรธรรมชาติและสิ่งแวดล้อม</h1><span class="sub">ห้องปฏิบัติการเสมือนจริง ชีววิทยา ม.4–ม.6</span></header>
<div class="grid">
<div class="left">
  <div class="card modes"><h3>เลือกโหมดการจำลอง</h3>
    <button data-mode="1" class="on">โหมด 1 : คุณภาพน้ำ DO · BOD · COD</button>
    <button data-mode="2">โหมด 2 : การสะสมสารพิษในห่วงโซ่อาหาร</button>
    <button data-mode="3">โหมด 3 : ภาวะโลกร้อน โอโซน และฝนกรด</button>
    <button data-mode="4">โหมด 4 : ความหลากหลายทางชีวภาพและการอนุรักษ์</button>
  </div>
  <div class="card"><h3>แผงควบคุมตัวแปร</h3>
    <div data-m="1">
      <div class="ctl"><label>แหล่งน้ำเสีย</label><select id="src"><option value="dom">ชุมชน (น้ำทิ้งบ้านเรือน)</option><option value="food">โรงงานอาหาร</option><option value="chem">โรงงานเคมี</option><option value="agri">เกษตรกรรม/ฟาร์มสุกร</option></select></div>
      <div class="ctl"><label>BOD ของน้ำทิ้ง (Load) <b id="loadV"></b></label><input type="range" id="load" min="0" max="100" value="60"></div>
      <div class="ctl"><label>อุณหภูมิน้ำ <b id="tempV"></b></label><input type="range" id="temp" min="20" max="35" value="28"></div>
      <label class="chk"><input type="checkbox" id="treat"> บำบัดน้ำเสียก่อนปล่อย (ลด BOD 85%)</label>
    </div>
    <div data-m="2">
      <div class="ctl"><label>สารพิษ</label><select id="tox"><option value="ddt">DDT (ยาฆ่าแมลง)</option><option value="hg">ปรอท (Methylmercury)</option><option value="mp">ไมโครพลาสติก</option></select></div>
      <div class="ctl"><label>ความเข้มข้นในแพลงก์ตอน (C₀) <b id="c0V"></b></label><input type="range" id="c0" min="0" max="100" value="33"></div>
      <div class="ctl"><label>ตัวคูณการสะสม (BMF) <b id="bmfV"></b></label><input type="range" id="bmf" min="1" max="15" step="0.5" value="8"></div>
      <label class="chk"><input type="checkbox" id="ban"> ห้ามใช้/หยุดปล่อยสารพิษ (ปีที่ 10)</label>
    </div>
    <div data-m="3">
      <div class="ctl"><label>การปล่อยแก๊สเรือนกระจก <b id="ghgV"></b></label><input type="range" id="ghg" min="1" max="5" step="0.1" value="2"></div>
      <div class="ctl"><label>การปล่อย CFC</label><select id="cfc"><option value="off">ไม่มี (Off)</option><option value="low">ต่ำ (Low)</option><option value="high" selected>สูง (High)</option></select></div>
      <div class="ctl"><label>SO₂ / NOx จากโรงไฟฟ้าถ่านหิน</label><select id="so2"><option value="none">ไม่มี</option><option value="low" selected>ต่ำ</option><option value="high">สูง</option></select></div>
    </div>
    <div data-m="4">
      <div class="ctl"><label>การตัดไม้ทำลายป่า <b id="defV"></b></label><input type="range" id="def" min="0" max="90" value="55"></div>
      <label class="chk"><input type="checkbox" id="inv" checked> ชนิดพันธุ์ต่างถิ่นรุกราน (ไมยราบยักษ์)</label>
      <label class="chk"><input type="checkbox" id="hunt" checked> การล่าสัตว์</label>
      <div class="ctl"><label>มาตรการอนุรักษ์</label><select id="cons"><option value="none">ไม่มี</option><option value="in">In-situ (เขตอนุรักษ์ในถิ่นกำเนิด)</option><option value="ex">Ex-situ (สวนสัตว์ ธนาคารเมล็ด)</option><option value="both" selected>In-situ + Ex-situ</option></select></div>
      <div class="ctl"><label>พื้นที่คุ้มครอง <b id="paV"></b></label><input type="range" id="pa" min="5" max="80" value="25"></div>
      <label class="chk"><input type="checkbox" id="corr"> สร้างทางเชื่อมป่า (Wildlife corridor)</label>
      <label class="chk"><input type="checkbox" id="plant"> ปลูกป่าทดแทน</label>
    </div>
  </div>
  <div class="card"><h3>การควบคุมการจำลอง</h3>
    <div class="btns"><button class="btn pri" id="play">▶ เล่น</button><button class="btn" id="pause">⏸ หยุด</button><button class="btn" id="reset">↺ รีเซ็ต</button><button class="btn" id="ff">⏩ เร่งเวลา ×10</button></div>
    <div class="ctl" style="margin-top:12px"><label>โหมดการแสดงผล (Toggle)</label>
      <div class="switch"><button id="tgChem">ดัชนี / ระดับโมเลกุล</button><button id="tgEco" class="on">สุขภาพระบบนิเวศ</button></div></div>
  </div>
</div>
<div class="center"><div class="card">
  <h3 id="simTitle">หน้าจอจำลอง</h3>
  <canvas id="main"></canvas>
  <div class="stats" id="stats"></div>
  <div class="flow" id="flow"></div>
  <div class="eq" id="eq"></div>
</div></div>
<div class="right">
  <div class="card"><h3 id="chartTitle">กราฟ</h3><canvas id="chart" class="chart"></canvas><div id="tableBox" style="margin-top:8px"></div></div>
  <div class="card ana"><h3>📋 บทวิเคราะห์</h3><div id="analysis"></div></div>
  <div class="card mis"><h3>⚠️ ข้อเข้าใจคลาดเคลื่อนที่พบบ่อย</h3><div id="mis"></div></div>
</div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function fit(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const W=Math.max(1,Math.round(r.width*d)),H=Math.max(1,Math.round(r.height*d));if(c.width!==W||c.height!==H){c.width=W;c.height=H;}const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);return{g,w:r.width,h:r.height};}
function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
const FONT='"Sarabun","Leelawadee UI",Tahoma,sans-serif';
function T(g,s,x,y,col='#eef2f6',size=12,align='left',bold=false){g.fillStyle=col;g.font=(bold?'700 ':'')+size+'px '+FONT;g.textAlign=align;g.textBaseline='middle';g.fillText(s,x,y);}
function EM(g,e,x,y,s){g.fillStyle='#000';g.font=s+'px "Segoe UI Emoji","Noto Color Emoji",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(e,x,y);}
function arrow(g,x1,y1,x2,y2,col,lw=2,dash){g.strokeStyle=col;g.fillStyle=col;g.lineWidth=lw;g.setLineDash(dash||[]);g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.setLineDash([]);const a=Math.atan2(y2-y1,x2-x1);g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-8*Math.cos(a-0.45),y2-8*Math.sin(a-0.45));g.lineTo(x2-8*Math.cos(a+0.45),y2-8*Math.sin(a+0.45));g.closePath();g.fill();}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,sm=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
function hash(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const V=id=>+$('#'+id).value;
const S={mode:1,running:true,toggle:'eco',time:0,ff:false};
const CHEM=()=>S.toggle==='chem';
function bar(g,x,y,w,h,v,col,label,txt){g.fillStyle='rgba(255,255,255,.09)';rr(g,x,y,w,h,4);g.fill();g.fillStyle=col;rr(g,x,y,w*clamp(v,0,1),h,4);g.fill();if(label)T(g,label,x,y-8,'#d5e6f5',10.5);if(txt)T(g,txt,x+w,y-8,'#fde68a',10.5,'right',true);}
function glow(g,x,y,r,col){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
function panel(g,x,y,w,h){g.fillStyle='rgba(9,17,28,.92)';rr(g,x,y,w,h,10);g.fill();g.strokeStyle='rgba(255,255,255,.08)';g.lineWidth=1;g.stroke();}
function flowBar(steps,cur,bad=-1){$('#flow').innerHTML=steps.map((s,i)=>`<span class="${i===bad?'bad':i===cur?'on':cur>=0&&i<cur?'done':''}">${s}</span>`).join('<i>→</i>');}
const fmt=v=>v>=1e6?(v/1e6).toFixed(1)+' ล้าน':v>=100?Math.round(v).toLocaleString():v>=10?v.toFixed(1):v>=1?v.toFixed(2):v>=0.01?v.toFixed(3):(+v.toPrecision(2)).toString();
function mix(c1,c2,t){const a=c1.match(/\w\w/g).map(x=>parseInt(x,16)),b=c2.match(/\w\w/g).map(x=>parseInt(x,16));return 'rgb('+a.map((v,i)=>Math.round(lerp(v,b[i],clamp(t,0,1)))).join(',')+')';}

/* ================= MODE 1 : RIVER WATER QUALITY (Streeter–Phelps) ================= */
const SRC={dom:{n:'ชุมชน',r:2.2,c:15},food:{n:'โรงงานอาหาร',r:1.7,c:8},chem:{n:'โรงงานเคมี',r:2,c:180},agri:{n:'เกษตรกรรม',r:2.5,c:25}};
const U=25,TM=6;
let M1;function initM1(){M1={t:0};}
function river(){const Tw=V('temp'),Lw=V('load')*($('#treat').checked?0.15:1),src=SRC[$('#src').value],DOs=14.62-0.3898*Tw+0.006969*Tw*Tw-0.00005897*Tw*Tw*Tw,kd=0.35*1.047**(Tw-20),ka=0.6*1.024**(Tw-20),L0=(1.5+0.25*Lw)/1.25,DO0=((DOs-0.3)+0.25*1)/1.25,D0=DOs-DO0;
  const Def=t=>kd*L0/(ka-kd)*(Math.exp(-kd*t)-Math.exp(-ka*t))+D0*Math.exp(-ka*t),DO=t=>Math.max(0,DOs-Def(t)),BOD=t=>L0*Math.exp(-kd*t),COD=t=>BOD(t)*src.r+0.2*src.c*V('load')/100*($('#treat').checked?0.4:1);
  let tc=0,mn=99;for(let t=0;t<=TM;t+=0.02){const d=DO(t);if(d<mn){mn=d;tc=t;}}return{Tw,Lw,src,DOs,kd,ka,L0,D0,DO,BOD,COD,tc,mn};}
const doCol=d=>d>=6?mix('1d4ed8','0284c7',(8-d)/2):d>=4?mix('0284c7','0d9488',(6-d)/2):d>=2?mix('0d9488','65a30d',(4-d)/2):mix('65a30d','57534e',(2-d)/2);
const zone=d=>d>=6?0:d>=4?1:d>=2?2:3;
const ZN=[['น้ำสะอาด (Clean)','🦐','ตัวอ่อนแมลงชีปะขาว กุ้ง ปลา','#38bdf8'],['ฟื้นตัว (Recovery)','🐌','หอย ปลิง ปลาทนทาน','#2dd4bf'],['ย่อยสลาย (Decomposition)','🪱','หนอนแดง (Tubifex) ลูกน้ำ','#a3e635'],['เสื่อมโทรมรุนแรง (Septic)','🦠','แบคทีเรียไร้ O₂ ไม่มีปลา','#a8a29e']];
function wqi(d,b,DOs){return Math.round(100*(0.6*clamp(d/DOs,0,1)+0.4*clamp(1-b/12,0,1)));}
function stepM1(dt){M1.t=(M1.t+dt*0.5)%TM;}
function drawM1(g,w,h){const R=river(),x0=Math.round(w*0.14),X=t=>x0+t/TM*(w-x0-14),ry=x=>112+Math.sin(x/w*7.5)*22,rw=40;
  g.fillStyle='#14532d';rr(g,4,4,w-8,214,10);g.fill();for(let i=0;i<60;i++){g.fillStyle='rgba(34,197,94,.35)';g.beginPath();g.arc(8+hash(i)*(w-16),10+hash(i+5)*200,2+hash(i+9)*3,0,7);g.fill();}
  for(let x=4;x<w-4;x+=3){const t=(x-x0)/(w-x0-14)*TM,d=x<x0?R.DOs-0.3:R.DO(t);g.fillStyle=doCol(d);g.fillRect(x,ry(x)-rw/2,3.5,rw);}
  for(let i=0;i<40;i++){const x=((S.time*40+hash(i)*w)%(w-10))+5,y=ry(x)+(hash(i+3)-0.5)*rw*0.8;g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1;g.beginPath();g.moveTo(x,y);g.lineTo(x+8,y);g.stroke();}
  g.fillStyle='#78716c';g.fillRect(x0-34,ry(x0)-rw/2-46,40,26);g.fillStyle='#57534e';g.fillRect(x0-26,ry(x0)-rw/2-60,7,16);EM(g,R.src.n==='เกษตรกรรม'?'🐖':R.src.n==='ชุมชน'?'🏘️':'🏭',x0-14,ry(x0)-rw/2-33,16);
  g.strokeStyle='#a8a29e';g.lineWidth=5;g.beginPath();g.moveTo(x0+4,ry(x0)-rw/2-30);g.lineTo(x0+4,ry(x0)-rw/2+2);g.stroke();if(V('load')>0)for(let i=0;i<6;i++){const k=(S.time*1.5+i/6)%1;g.fillStyle=$('#treat').checked?'rgba(186,230,253,.8)':'rgba(120,83,45,.9)';g.beginPath();g.arc(x0+4+k*8,ry(x0)-rw/2+2+k*14,2.5,0,7);g.fill();}
  T(g,'จุดปล่อยน้ำทิ้ง',x0-34,ry(x0)-rw/2-72,'#fde68a',10,'left',true);T(g,'กระแสน้ำ → '+U+' km/วัน',w-14,22,'#bae6fd',10.5,'right',true);
  for(let k=0;k<=6;k++){const x=X(k);T(g,(k*U)+' km',x,ry(x)+rw/2+12,'#d1fae5',9.5,'center');}
  const xc=X(R.tc);g.strokeStyle='#ef4444';g.setLineDash([3,3]);g.lineWidth=1.5;g.beginPath();g.moveTo(xc,ry(xc)-rw/2-10);g.lineTo(xc,ry(xc)+rw/2+4);g.stroke();g.setLineDash([]);T(g,'จุดวิกฤต DO '+R.mn.toFixed(1),xc,ry(xc)-rw/2-18,'#fca5a5',10,'center',true);
  const xp=X(M1.t),yp=ry(xp),dp=R.DO(M1.t),bp=R.BOD(M1.t);g.fillStyle='#fbbf24';g.beginPath();g.arc(xp,yp,6,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=1.5;g.stroke();g.strokeStyle='#fbbf24';g.beginPath();g.moveTo(xp,yp-6);g.lineTo(xp,yp-30);g.stroke();

const MIS1='<p><b>❌ "BOD สูง แปลว่าน้ำมีออกซิเจนมาก คุณภาพดี"</b></p><p>✅ BOD คือปริมาณ O₂ ที่<b>จุลินทรีย์ต้องใช้</b>ย่อยสารอินทรีย์ใน 5 วัน BOD สูง = สารอินทรีย์มาก = น้ำเสีย DO จะลดลง · ส่วน COD ใช้สารเคมีออกซิไดซ์ จึงมีค่า ≥ BOD เสมอ</p>';
const MIS2='<p><b>❌ "สารพิษในน้ำมีความเข้มข้นต่ำมาก จึงไม่อันตราย"</b></p><p>✅ สารที่ละลายในไขมันและสลายตัวยาก <b>สะสมเพิ่มเป็นทวีคูณ</b>ตามลำดับขั้นอาหาร ผู้บริโภคลำดับสูงสุด (รวมถึงมนุษย์) อาจได้รับมากกว่าในน้ำหลายพันเท่า</p>';
const MIS3='<p><b>❌ "รูโหว่โอโซนเป็นสาเหตุหลักของภาวะโลกร้อน"</b></p><p>✅ เป็นคนละปัญหา: โลกร้อนเกิดจาก<b>แก๊สเรือนกระจกดูดกลืนรังสีอินฟราเรด</b> ส่วนรูโหว่โอโซนเกิดจาก <b>CFC</b> ทำให้ UV-B ผ่านมามากขึ้น</p><p><b>❌ "ฝนกรดเกิดจาก CO₂"</b> ✅ น้ำฝนปกติมี pH ≈ 5.6 จาก CO₂ อยู่แล้ว ฝนกรด (pH &lt; 5.6) เกิดจาก <b>SO₂ และ NOx</b> จากการเผาถ่านหินและไอเสียรถยนต์</p>';
const MIS4='<p><b>❌ "ปลูกป่าทดแทนก็ได้ความหลากหลายกลับคืนเหมือนเดิม"</b></p><p>✅ ป่าปลูกใหม่ (มักเป็นพืชชนิดเดียว) มีโครงสร้างและถิ่นที่อยู่น้อยกว่าป่าดั้งเดิม ต้องใช้เวลานานมาก · การรักษา<b>ผืนป่าขนาดใหญ่ที่เชื่อมต่อกัน</b>สำคัญกว่า เพราะสัตว์ใหญ่อย่างเสือต้องการพื้นที่กว้าง</p>';

  if(m===1){const R=river(),t=M1.t,d=R.DO(t),b=R.BOD(t),c=R.COD(t),dd=R.ka*(R.DOs-d)-R.kd*b;tt='คุณภาพน้ำในแม่น้ำท้ายจุดปล่อยน้ำทิ้ง ('+R.src.n+')';ct='DO sag curve: DO และ BOD ตามระยะทาง';
    st=[['DO ที่หัววัด',d.toFixed(2)+' mg/L'],['BOD',b.toFixed(2)+' mg/L'],['COD',c.toFixed(1)+' mg/L'],['DO ต่ำสุด (จุดวิกฤต)',R.mn.toFixed(1)+' @ '+Math.round(R.tc*U)+' km']];

    an=`<p><span class="tag ${R.mn>=4?'ok':R.mn>=2?'mid':'no'}">DO ต่ำสุด ${R.mn.toFixed(1)} mg/L</span> ห่างจุดปล่อย ${Math.round(R.tc*U)} km · `+(R.mn>=4?'แม่น้ำฟอกตัวเองได้ (Self-purification)':R.mn>=2?'ปลาส่วนใหญ่อยู่ไม่ได้ในช่วงวิกฤต':'เกิดสภาพไร้ออกซิเจน มีกลิ่นเหม็นจาก H₂S')+'</p>'+
      `<p>อุณหภูมิ ${R.Tw}°C: O₂ ละลายได้สูงสุด ${R.DOs.toFixed(2)} mg/L และจุลินทรีย์ย่อยเร็วขึ้น (Kd = ${R.kd.toFixed(2)}/วัน) <b>น้ำอุ่นจึงวิกฤตกว่า</b></p>`+($('#treat').checked?'<p><span class="tag ok">บำบัดน้ำเสีย</span> BOD ของน้ำทิ้งลดลง 85% เป็นวิธีแก้ที่ต้นเหตุ</p>':'')+(R.src.c>100?'<p><span class="tag mid">โรงงานเคมี</span> COD สูงกว่า BOD มาก แปลว่ามีสารที่จุลินทรีย์ย่อยไม่ได้ (อาจเป็นพิษ)</p>':'');mis=MIS1;tb=TB1;}

  else if(m===3){const C=clim(M3.y),dF=5.35*Math.log(C.co2/280);tt='ภาวะโลกร้อน การลดลงของโอโซน และฝนกรด (ปี '+Math.round(M3.y)+')';ct='ΔT และโอโซน ปี 1950–2100';

    flowBar(['ปล่อยแก๊ส','สะสมในบรรยากาศ','ดูดกลืน IR / ทำลาย O₃','อุณหภูมิ ↑ / UV-B ↑','ผลต่อระบบนิเวศ'],Math.min(4,Math.floor((M3.y-1950)/30)),C.dT>2?3:-1);
    eq=`ΔF = 5.35 ln(C/C₀) = 5.35 ln(${Math.round(C.co2)}/280) = ${dF.toFixed(2)} W/m²\nΔT = λ·ΔF = 0.8 × ${dF.toFixed(2)} = ${C.dT.toFixed(2)} °C\nCl· + O₃ → ClO· + O₂ ;  ClO· + O → Cl· + O₂   (โอโซน ${Math.round(C.du)} DU, UV-B ${C.uv.toFixed(1)})`;
    an=`<p><span class="tag ${C.dT>2?'no':C.dT>1.5?'mid':'ok'}">ΔT +${C.dT.toFixed(1)} °C</span> ${C.dT>2?'เกินเป้าหมายข้อตกลงปารีส ปะการังฟอกขาว ระดับน้ำทะเลสูงขึ้น':'ยังอยู่ในเป้าหมาย'}</p><p><span class="tag ${C.du<220?'no':'ok'}">โอโซน ${Math.round(C.du)} DU</span> ${C.du<220?'ต่ำกว่า 220 DU = รูโหว่โอโซน UV-B ผ่านมามากขึ้น':'ชั้นโอโซนยังกรอง UV-B ได้ดี'}</p><p><span class="tag ${C.ph<5.6?'no':'ok'}">ฝน pH ${C.ph}</span> ${C.ph<5.6?'SO₂/NOx ทำให้เกิด H₂SO₄ และ HNO₃':'ฝนปกติ (pH 5.6 จาก CO₂ ละลายน้ำ)'}</p>`;mis=MIS3;tb=TB3;}
