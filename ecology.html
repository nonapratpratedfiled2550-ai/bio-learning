<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>นิเวศวิทยา ประชากร และความยั่งยืน – Interactive Biology Lab</title>
<style>
:root{--bg:#06100a;--panel:#0d1a12;--panel2:#142619;--line:#244a30;--txt:#eefbf2;--mut:#b4d3bd;--acc:#4ade80;--acc2:#fde047;--on:#14532d;--pri:#15803d;--sw:#0e7490;--deep:#07110b;--h1:#166534;--h2:#0e7490;--btn:#15291b}
*{box-sizing:border-box}
body{margin:0;font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{padding:12px 18px;background:linear-gradient(90deg,var(--h1),var(--h2));border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:12px}
header h1{font-size:19px;margin:0}header .sub{color:#e7fff0;opacity:.85;font-size:13px}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr) 370px;gap:12px;padding:12px}
@media(max-width:1280px){.grid{grid-template-columns:290px minmax(0,1fr)}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}.right .card{margin:0}}
@media(max-width:820px){.grid{grid-template-columns:1fr}.right{display:block}.right .card{margin-bottom:12px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:15px;color:var(--acc)}
.modes button{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;font:inherit;font-size:13px}
.modes button.on{background:var(--on);border-color:var(--acc)}
.ctl{margin:8px 0}.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:3px}.ctl label b{color:var(--acc2)}
input[type=range]{width:100%;accent-color:var(--acc)}
select{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--txt);margin:6px 0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.btn{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--btn);color:var(--txt);cursor:pointer;font:inherit;font-size:13px}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--pri);border-color:var(--acc)}
.switch{display:flex;background:var(--panel2);border-radius:9px;padding:3px;border:1px solid var(--line)}
.switch button{flex:1;border:0;background:transparent;color:var(--mut);padding:7px 4px;border-radius:7px;cursor:pointer;font:inherit;font-size:12px}
.switch button.on{background:var(--sw);color:#fff}
canvas{display:block;width:100%}
#main{height:470px;background:var(--deep);border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel2);border-radius:10px;padding:8px;border:1px solid var(--line)}
.stat .k{font-size:11.5px;color:var(--mut)}.stat .v{font-size:16px;font-weight:700;color:var(--acc2);margin-top:2px}
.flow{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;align-items:center}
.flow span{padding:4px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-size:11.5px;color:var(--mut)}
.flow span.on{background:var(--pri);color:#fff;border-color:var(--acc)}.flow span.done{color:var(--txt);border-color:var(--on)}.flow span.bad{background:#7f1d1d;color:#fecaca;border-color:#ef4444}
.flow i{color:var(--mut);font-style:normal;font-size:11px}
.eq{font-family:Consolas,monospace;background:var(--deep);padding:10px;border-radius:8px;border-left:4px solid var(--acc);white-space:pre-wrap;font-size:13px;margin-top:10px;line-height:1.55}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{border:1px solid var(--line);padding:4px 5px;text-align:center}th{background:var(--panel2);color:var(--acc)}
.mis{background:#1f1a0b;border-color:#6b5a1e}.mis h3{color:#fbbf24}.mis p,.ana p{margin:6px 0;line-height:1.55}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:12px;margin-right:4px}
.ok{background:#14532d;color:#bbf7d0}.no{background:#7f1d1d;color:#fecaca}.mid{background:#713f12;color:#fde68a}
.chart{height:250px;background:var(--deep);border-radius:8px}
</style>
<link rel="stylesheet" href="float-lab.css">
</head>
<body>
<header><a href="index.html" style="color:#8dffc0;text-decoration:none;font-weight:700;margin-right:6px">← หน้าแรก</a><h1>🌿 นิเวศวิทยา ประชากร และความยั่งยืนของสิ่งแวดล้อม (Ecology &amp; Population)</h1><span class="sub">ห้องปฏิบัติการเสมือนจริง ชีววิทยา ม.4–ม.6</span></header>
<div class="grid">
<div class="left">
  <div class="card modes"><h3>เลือกโหมดการจำลอง</h3>
    <button data-mode="1" class="on">โหมด 1 : สายใยอาหาร พีระมิด และการสะสมสารพิษ</button>
    <button data-mode="2">โหมด 2 : การเติบโตและปฏิสัมพันธ์ของประชากร</button>
    <button data-mode="3">โหมด 3 : การเปลี่ยนแปลงแทนที่และไบโอม</button>
    <button data-mode="4">โหมด 4 : ยูโทรฟิเคชันในแหล่งน้ำ</button>
  </div>
  <div class="card"><h3>แผงควบคุมตัวแปร</h3>
    <div data-m="1">
      <div class="ctl"><label>ระบบนิเวศ</label><select id="eco"><option value="grass">ทุ่งหญ้า</option><option value="forest">ป่า (ต้นไม้ใหญ่ + แมลง)</option><option value="ocean">ทะเล (แพลงก์ตอน)</option></select></div>
      <div class="ctl"><label>ชนิดพีระมิด</label><select id="pyr"><option value="energy">พีระมิดพลังงาน</option><option value="bio">พีระมิดมวลชีวภาพ</option><option value="num">พีระมิดจำนวน</option></select></div>
      <div class="ctl"><label>พลังงานที่ผู้ผลิตตรึงได้ (E₁) <b id="E0V"></b></label><input type="range" id="E0" min="1000" max="100000" step="1000" value="20000"></div>
      <div class="ctl"><label>ประสิทธิภาพการถ่ายทอดพลังงาน <b id="effV"></b></label><input type="range" id="eff" min="5" max="20" step="1" value="10"></div>
      <div class="ctl"><label>DDT ในผู้ผลิต (C₀) <b id="c0V"></b></label><input type="range" id="c0" min="0.01" max="5" step="0.01" value="0.04"></div>
    </div>
    <div data-m="2">
      <div class="ctl"><label>การทดลอง</label><select id="exp2"><option value="growth">Exponential เทียบ Logistic</option><option value="comp">การแข่งขัน (Lotka–Volterra Competition)</option><option value="pred">ผู้ล่า–เหยื่อ (Predator–Prey)</option><option value="disp">รูปแบบการกระจายตัว</option></select></div>
      <div id="rkBox"><div class="ctl"><label>อัตราการเพิ่มของประชากร (r) <b id="rV"></b></label><input type="range" id="r" min="-0.5" max="1.5" step="0.05" value="0.5"></div>
        <div class="ctl"><label>ความสามารถในการรองรับ (K) <b id="KV"></b></label><input type="range" id="K" min="50" max="2000" step="50" value="500"></div></div>
      <div id="n0Box"><div class="ctl"><label>ประชากรเริ่มต้น (N₀) <b id="N0V"></b></label><input type="range" id="N0" min="2" max="200" value="10"></div></div>
      <div id="compBox"><div class="ctl"><label>ผลของชนิด 2 ต่อชนิด 1 (α₁₂) <b id="a12V"></b></label><input type="range" id="a12" min="0" max="1.6" step="0.05" value="0.6"></div>
        <div class="ctl"><label>ผลของชนิด 1 ต่อชนิด 2 (α₂₁) <b id="a21V"></b></label><input type="range" id="a21" min="0" max="1.6" step="0.05" value="0.7"></div></div>
      <div id="predBox"><div class="ctl"><label>ประสิทธิภาพการล่า (a) <b id="peV"></b></label><input type="range" id="pe" min="0.002" max="0.02" step="0.001" value="0.008"></div></div>
      <div id="dispBox"><div class="ctl"><label>จำนวนสิ่งมีชีวิตต่อแปลง <b id="ndV"></b></label><input type="range" id="nd" min="20" max="160" value="80"></div><button class="btn" id="reseed" style="width:100%">🎲 สุ่มตำแหน่งใหม่</button></div>
      <div class="ctl"><label>ความเร็วเวลา <b id="spd2V"></b></label><input type="range" id="spd2" min="0.5" max="5" step="0.5" value="2"></div>
      <button class="btn" id="rst2" style="width:100%">↺ เริ่มประชากรใหม่</button>
    </div>
    <div data-m="3">
      <div class="ctl"><label>ชนิดการเปลี่ยนแปลงแทนที่</label><select id="stype"><option value="primary">ปฐมภูมิ (Primary) – เริ่มจากหินเปล่า</option><option value="secondary">ทุติยภูมิ (Secondary) – มีดินเดิมอยู่</option></select></div>
      <div class="ctl"><label>ไบโอม (Biome)</label><select id="biome"><option value="rain">ป่าดิบชื้นเขตร้อน</option><option value="decid">ป่าผลัดใบเขตอบอุ่น</option><option value="taiga">ป่าสน (ไทกา)</option><option value="grass">ทุ่งหญ้า</option><option value="desert">ทะเลทราย</option><option value="tundra">ทุนดรา</option></select></div>
      <div class="ctl"><label>ความเร็วเวลา <b id="spd3V"></b></label><input type="range" id="spd3" min="2" max="50" value="15"></div>
      <div class="btns"><button class="btn" id="fire">🔥 ไฟป่า</button><button class="btn" id="lava">🌋 ลาวาไหลทับ</button></div>
    </div>
    <div data-m="4">
      <div class="ctl"><label>ปริมาณปุ๋ย/น้ำทิ้งที่ไหลลงบ่อ</label><select id="load"><option value="low">ต่ำ (Low)</option><option value="med">ปานกลาง (Medium)</option><option value="sev" selected>รุนแรง (Severe)</option></select></div>
      <label class="chk"><input type="checkbox" id="stopIn"> หยุดปล่อยน้ำทิ้ง/ปุ๋ย (บำบัดก่อนปล่อย)</label>
      <label class="chk"><input type="checkbox" id="aer"> เปิดเครื่องเติมอากาศ (Aerator)</label>
      <div class="ctl"><label>ความเร็วเวลา <b id="spd4V"></b></label><input type="range" id="spd4" min="0.25" max="4" step="0.25" value="1.5"></div>
    </div>
  </div>
  <div class="card"><h3>การควบคุมการจำลอง</h3>
    <div class="btns"><button class="btn pri" id="play">▶ เล่น</button><button class="btn" id="pause">⏸ หยุด</button><button class="btn" id="reset" style="grid-column:1/-1">↺ รีเซ็ต</button></div>
    <div class="ctl" style="margin-top:12px"><label>โหมดการแสดงผล (Toggle)</label>
      <div class="switch"><button id="tgWeb" class="on">เครือข่ายผู้ล่า–เหยื่อ</button><button id="tgCyc">วัฏจักรสาร C / N / P</button></div></div>
    <div id="cycBox" class="ctl"><label>วัฏจักร</label><select id="cyc"><option value="C">คาร์บอน (C)</option><option value="N">ไนโตรเจน (N)</option><option value="P">ฟอสฟอรัส (P)</option></select></div>
  </div>
</div>
<div class="center"><div class="card">
  <h3 id="simTitle">หน้าจอจำลอง</h3>
  <canvas id="main"></canvas>
  <div class="stats" id="stats"></div>
  <div class="flow" id="flow"></div>
  <div class="eq" id="eq"></div>
</div></div>
<div class="right">
  <div class="card"><h3 id="chartTitle">กราฟ</h3><canvas id="chart" class="chart"></canvas><div id="tableBox" style="margin-top:8px"></div></div>
  <div class="card ana"><h3>📋 บทวิเคราะห์</h3><div id="analysis"></div></div>
  <div class="card mis"><h3>⚠️ ข้อเข้าใจคลาดเคลื่อนที่พบบ่อย</h3><div id="mis"></div></div>
</div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function fit(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const W=Math.max(1,Math.round(r.width*d)),H=Math.max(1,Math.round(r.height*d));if(c.width!==W||c.height!==H){c.width=W;c.height=H;}const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);return{g,w:r.width,h:r.height};}
function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
const FONT='"Sarabun","Leelawadee UI",Tahoma,sans-serif';
function T(g,s,x,y,col='#eef2f6',size=12,align='left',bold=false){g.fillStyle=col;g.font=(bold?'700 ':'')+size+'px '+FONT;g.textAlign=align;g.textBaseline='middle';g.fillText(s,x,y);}
function EM(g,e,x,y,s){g.fillStyle='#000';g.font=s+'px "Segoe UI Emoji","Noto Color Emoji",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(e,x,y);}
function arrow(g,x1,y1,x2,y2,col,lw=2,dash){g.strokeStyle=col;g.fillStyle=col;g.lineWidth=lw;g.setLineDash(dash||[]);g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.setLineDash([]);const a=Math.atan2(y2-y1,x2-x1);g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-8*Math.cos(a-0.45),y2-8*Math.sin(a-0.45));g.lineTo(x2-8*Math.cos(a+0.45),y2-8*Math.sin(a+0.45));g.closePath();g.fill();}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,sm=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
function hash(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const V=id=>+$('#'+id).value;
const S={mode:1,running:true,toggle:'web',time:0};
const CYCV=()=>S.toggle==='cyc';
function bar(g,x,y,w,h,v,col,label,txt){g.fillStyle='rgba(255,255,255,.09)';rr(g,x,y,w,h,4);g.fill();g.fillStyle=col;rr(g,x,y,w*clamp(v,0,1),h,4);g.fill();if(label)T(g,label,x,y-8,'#d6eedc',10.5);if(txt)T(g,txt,x+w,y-8,'#fde68a',10.5,'right',true);}
function glow(g,x,y,r,col){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
function panel(g,x,y,w,h){g.fillStyle='rgba(10,24,15,.92)';rr(g,x,y,w,h,10);g.fill();g.strokeStyle='rgba(255,255,255,.08)';g.lineWidth=1;g.stroke();}
function flowBar(steps,cur,bad=-1){$('#flow').innerHTML=steps.map((s,i)=>`<span class="${i===bad?'bad':i===cur?'on':cur>=0&&i<cur?'done':''}">${s}</span>`).join('<i>→</i>');}
const fmt=v=>v>=1e6?(v/1e6).toFixed(v>=1e7?0:1)+' ล้าน':v>=100?Math.round(v).toLocaleString():v>=1?(+v.toFixed(1)).toString():v>=0.01?v.toFixed(2):v.toExponential(1);

/* ================= MODE 1 : FOOD WEB, PYRAMIDS, BIOMAGNIFICATION ================= */
const LVN=[['ผู้ผลิต','Producer'],['ผู้บริโภคลำดับ 1','Primary consumer'],['ผู้บริโภคลำดับ 2','Secondary consumer'],['ผู้บริโภคลำดับ 3','Tertiary consumer']];
const LC=['#4ade80','#facc15','#fb923c','#f87171'];
const ECO={
  grass:{n:'ทุ่งหญ้า',nodes:[['หญ้า','Grass','🌾',0,0.2],['ต้นข้าว','Rice','🌱',0,0.75],['ตั๊กแตน','Grasshopper','🦗',1,0.12],['หนู','Rat','🐀',1,0.5],['กระต่าย','Rabbit','🐇',1,0.88],['กบ','Frog','🐸',2,0.28],['งู','Snake','🐍',2,0.72],['เหยี่ยว','Hawk','🦅',3,0.5]],
    links:[[0,2],[0,4],[1,2],[1,3],[2,5],[3,6],[5,6],[4,7],[6,7],[3,7]],num:[1500000,200000,90000,1],bio:[809,37,11,1.5]},
  forest:{n:'ป่า',nodes:[['ต้นไม้ใหญ่','Tree','🌳',0,0.5],['หนอนผีเสื้อ','Caterpillar','🐛',1,0.22],['ด้วงกินใบ','Leaf beetle','🐞',1,0.78],['นกกินแมลง','Insectivorous bird','🐦',2,0.28],['แมงมุม','Spider','🕷️',2,0.72],['เหยี่ยว','Hawk','🦅',3,0.5]],
    links:[[0,1],[0,2],[1,3],[2,4],[2,3],[4,3],[1,4],[3,5]],num:[200,150000,3000,5],bio:[30000,30,3,0.3]},
  ocean:{n:'ทะเล',nodes:[['แพลงก์ตอนพืช','Phytoplankton','🦠',0,0.5],['แพลงก์ตอนสัตว์','Zooplankton','🦐',1,0.25],['เคย','Krill','🦐',1,0.75],['ปลาเล็ก','Small fish','🐟',2,0.5],['ปลาใหญ่ / นกทะเล','Large fish / Seabird','🦈',3,0.5]],
    links:[[0,1],[0,2],[1,3],[2,3],[3,4],[2,4]],num:[5e9,2e6,4000,10],bio:[4,21,3,0.5]}};
const energies=()=>{const E0=V('E0'),f=V('eff')/100;return [0,1,2,3].map(i=>E0*f**i);};
const toxins=()=>{const c0=V('c0'),b=100/V('eff');return [0,1,2,3].map(i=>c0*b**i);};
function drawM1(g,w,h){if(CYCV()){drawCycle(g,w,h);return;}
  const e=ECO[$('#eco').value],E=energies(),C=toxins(),ww=Math.round(w*0.56),LY=i=>h-112-i*(h-176)/3,NX=f=>124+f*(ww-156);
  for(let i=0;i<4;i++){const y=LY(i);g.fillStyle=i%2?'rgba(255,255,255,.025)':'rgba(255,255,255,.055)';g.fillRect(4,y-32,ww-4,64);T(g,LVN[i][0],10,y-14,LC[i],11,'left',true);T(g,LVN[i][1],10,y,'#a7c4b0',9.5);T(g,'E = '+fmt(E[i])+' kcal',10,y+14,'#fde68a',10,'left',true);}
  const P=e.nodes.map(n=>({x:NX(n[4]),y:LY(n[3])}));
  e.links.forEach(([a,b],k)=>{const A=P[a],B=P[b],d=Math.hypot(B.x-A.x,B.y-A.y),ux=(B.x-A.x)/d,uy=(B.y-A.y)/d,x1=A.x+ux*21,y1=A.y+uy*21,x2=B.x-ux*23,y2=B.y-uy*23;arrow(g,x1,y1,x2,y2,'rgba(253,224,71,.4)',1.4);
    const la=e.nodes[a][3],rad=1.2+2.6*clamp(Math.log10(E[la])/5,0,1);for(let j=0;j<3;j++){const q=(S.time*0.3+j/3+hash(k))%1,x=lerp(x1,x2,q),y=lerp(y1,y2,q);glow(g,x,y,rad*3,'rgba(253,224,71,.3)');g.fillStyle='#fde047';g.beginPath();g.arc(x,y,rad,0,7);g.fill();}});

      an=Ps>0?'<p><span class="tag ok">วัฏจักรประชากร</span> เมื่อเหยื่อมาก ผู้ล่าเพิ่มตาม (ตามหลังเล็กน้อย) แล้วกินเหยื่อจนลดลง ผู้ล่าจึงลดตาม เกิดการแกว่งเป็นรอบ เช่น ลิงซ์–กระต่ายในแคนาดา</p><p>เทอม H/K ทำให้การแกว่งค่อย ๆ หน่วงลงเข้าสู่สมดุล</p>':'<p><span class="tag no">ผู้ล่าอยู่ไม่ได้</span> H* มากกว่า K หมายความว่าเหยื่อไม่เคยมากพอจะเลี้ยงผู้ล่า ลองเพิ่ม K หรือประสิทธิภาพการล่า</p>';tb=TB2I;}
    else{const R=['clump','uni','rand'].map(k=>vmr(M2.pts[k]));tt='รูปแบบการกระจายตัวของประชากร (Quadrat sampling)';ct='อัตราส่วนความแปรปรวนต่อค่าเฉลี่ย';
      st=[['จำนวนแปลง','25 แปลง (5×5)'],['กลุ่ม s²/x̄',R[0].r.toFixed(2)],['สม่ำเสมอ s²/x̄',R[1].r.toFixed(2)],['สุ่ม s²/x̄',R[2].r.toFixed(2)]];flowBar(['วางแปลงสุ่มตัวอย่าง','นับจำนวนในแต่ละแปลง','หา x̄ และ s²','เทียบ s²/x̄ กับ 1'],Math.floor(S.time/1.5)%4);
      eq=`x̄ = Σxᵢ / n,   s² = Σ(xᵢ − x̄)² / (n − 1)\ns²/x̄ > 1 → แบบกลุ่ม · ≈ 1 → แบบสุ่ม · < 1 → แบบสม่ำเสมอ\nความหนาแน่น = ${V('nd')} ตัว / 25 แปลง = ${(V('nd')/25).toFixed(2)} ตัว/แปลง`;
      an='<p><span class="tag ok">แบบกลุ่ม</span> พบมากที่สุดในธรรมชาติ เพราะทรัพยากรกระจายไม่สม่ำเสมอและสัตว์อยู่เป็นฝูง</p><p><span class="tag mid">แบบสม่ำเสมอ</span> เกิดจากการแย่งพื้นที่ หรือพืชหลั่งสารยับยั้ง · <span class="tag mid">แบบสุ่ม</span> พบน้อย เกิดเมื่อทรัพยากรสม่ำเสมอและไม่มีปฏิสัมพันธ์</p>';tb=TB2D;}
    mis=MIS2;}
  else if(m===3){const T0=TT(),q=M3.t/T0,st3=stage3(q),nm=STN(),b=BIO[$('#biome').value],pri=$('#stype').value==='primary',tau=T0*0.45;tt='การเปลี่ยนแปลงแทนที่แบบ'+(pri?'ปฐมภูมิ':'ทุติยภูมิ')+' · '+b.n;ct='ดิน ความหลากหลาย และมวลชีวภาพตามเวลา';
    st=[['ปีที่',M3.t.toFixed(0)],['ระยะ',nm[st3]||nm[0]],['ความลึกดิน',soilD(q).toFixed(0)+' cm'],['มวลชีวภาพ',Math.round(biomass(M3.t)*100)+'%']];flowBar(nm,M3.fx?-1:st3);
    eq=`B(t) = B_max(1 − e^(−t/τ)),  τ = ${tau.toFixed(0)} ปี (${pri?'ปฐมภูมิ: ต้องสร้างดินก่อน':'ทุติยภูมิ: มีดินแล้ว'})\nB(${M3.t.toFixed(0)}) = ${b.B} × (1 − e^(−${(M3.t/tau).toFixed(2)})) = ${biomass(M3.t).toFixed(2)}\nไบโอม ${b.n}: ${b.T}°C, ฝน ${b.P} mm/ปี`;
    an=`<p><span class="tag ok">${nm[st3]||nm[0]}</span> `+(pri?['หินเปล่ายังไม่มีดิน สิ่งมีชีวิตแทบอยู่ไม่ได้','ไลเคนเป็น<b>สิ่งมีชีวิตบุกเบิก (Pioneer)</b> หลั่งกรดทำให้หินผุ เมื่อตายกลายเป็นอินทรียวัตถุ เริ่มเกิดดิน','มอสขึ้นบนดินบาง ๆ ช่วยเก็บความชื้นและเพิ่มอินทรียวัตถุ','ดินหนาขึ้น หญ้าและไม้ล้มลุกเข้ามาแทนที่','ไม้พุ่มบังแสง พืชเดิมที่ชอบแสงจัดลดลง','ไม้ยืนต้นโตเร็ว (เบิกนำ) เข้ามาแทนที่','สังคมสมบูรณ์ (Climax) ค่อนข้างคงที่ ขึ้นกับภูมิอากาศของไบโอม'][st3]:['ดินและเมล็ดในดินยังอยู่ หลังไฟป่า/การรบกวน','หญ้าและไม้ล้มลุกงอกจากเมล็ดในดินอย่างรวดเร็ว','ไม้พุ่มเข้ามาแทนที่','ไม้ยืนต้นเบิกนำเติบโต','กลับสู่สังคมสมบูรณ์เร็วกว่าแบบปฐมภูมิมาก'][st3])+`</p><p>สังคมสมบูรณ์ของ${b.n} ขึ้นกับอุณหภูมิและปริมาณฝน (เช่น ${b.ex})${b.c==='tallgrass'||b.c==='cactus'||b.c==='dwarf'?' — ฝนน้อย/หนาวเกินไป จึงไม่เป็นป่า':''}</p>`;mis=MIS3;tb=TB3;}
  else{const s=M4,q=rates(),bod=BOD(),ld=LOAD[$('#load').value][1];tt='ยูโทรฟิเคชันในบ่อน้ำ (อินพุต: '+(INP()>0?ld:'หยุดแล้ว')+')';ct='DO และ BOD ตามเวลา';
    st=[['DO',s.DO.toFixed(1)+' mg/L'],['BOD',bod.toFixed(1)+' mg/L'],['สาหร่าย',Math.round(s.A)+'%'],['ปลา',Math.round(s.F)+' ตัว']];
    const sg=s.F<5&&s.DO<3?5:s.DO<3?4:bod>6?3:s.A>40?2:s.Nu>0.15||INP()>0.1?1:0;flowBar(['ธาตุอาหารเพิ่ม (N, P)','สาหร่ายเพิ่มจำนวน (Algal bloom)','สาหร่ายตาย','ผู้ย่อยสลายใช้ O₂ (BOD ↑)','DO ↓','ปลาตาย'],sg,s.F<5?5:-1);
    eq=`dDO/dt = kₐ(DOsat − DO) + P_สังเคราะห์ − R_สาหร่าย − k_d·BOD\n= ${KA()}(8 − ${s.DO.toFixed(1)}) + ${q.P.toFixed(2)} − ${q.R.toFixed(2)} − 0.23×${bod.toFixed(1)} = ${q.dDO>=0?'+':''}${q.dDO.toFixed(2)} mg/L/วัน\nBOD = ออกซิเจนที่จุลินทรีย์ใช้ย่อยสารอินทรีย์ใน 5 วัน ที่ 20°C`;
    an=`<p><span class="tag ${s.DO>=6?'ok':s.DO>=3?'mid':'no'}">DO ${s.DO.toFixed(1)} mg/L</span> `+(s.DO>=6?'น้ำยังดี ธาตุอาหารพอดี':s.DO>=3?'สาหร่ายมาก ซากเพิ่ม ผู้ย่อยสลายเริ่มแย่ง O₂ กับปลา':'ผู้ย่อยสลายใช้ O₂ ย่อยซากจำนวนมาก (BOD สูง) ปลาขาดออกซิเจนตาย ซากปลาเพิ่ม BOD ต่อเนื่อง (Positive feedback)')+'</p>'+
      `<p>${light(s.t)>0?'กลางวัน: สาหร่ายสังเคราะห์ด้วยแสงช่วยเพิ่ม O₂':'กลางคืน: ไม่มีการสังเคราะห์ด้วยแสง DO ต่ำสุดช่วงก่อนรุ่งเช้า'}</p>`+($('#stopIn').checked?'<p><span class="tag ok">แก้ที่ต้นเหตุ</span> หยุดธาตุอาหาร สาหร่ายลดลง BOD ค่อย ๆ ลด น้ำฟื้นตัว</p>':'')+($('#aer').checked?'<p><span class="tag mid">เติมอากาศ</span> เพิ่ม DO ได้ทันที แต่ไม่ได้แก้ต้นเหตุ (ธาตุอาหาร)</p>':'');mis=MIS4;tb=TB4;}
  $('#simTitle').textContent=tt;$('#chartTitle').textContent=ct;stats(st);$('#eq').textContent=eq;$('#analysis').innerHTML=an;$('#mis').innerHTML=mis;$('#tableBox').innerHTML=tb;}

/* ================= UI ================= */
$$('.modes button').forEach(b=>b.onclick=()=>setMode(+b.dataset.mode));
function sync(){const k=$('#exp2').value;$('#rkBox').style.display=k==='disp'?'none':'';$('#n0Box').style.display=k==='growth'?'':'none';$('#compBox').style.display=k==='comp'?'':'none';$('#predBox').style.display=k==='pred'?'':'none';$('#dispBox').style.display=k==='disp'?'':'none';$('#cycBox').style.display=CYCV()&&S.mode===1?'':'none';}
function setMode(m){S.mode=m;$$('.modes button').forEach(b=>b.classList.toggle('on',+b.dataset.mode===m));$$('[data-m]').forEach(e=>e.style.display=e.dataset.m.split(' ').includes(String(m))?'':'none');sync();updateText();}
const bind=(id,fmt)=>{const el=$('#'+id);const f=()=>{const o=$('#'+id+'V');if(o)o.textContent=fmt(+el.value);};el.addEventListener('input',()=>{f();sync();updateText();});f();};
bind('E0',v=>v.toLocaleString()+' kcal');bind('eff',v=>v+'%');bind('c0',v=>v+' ppm');bind('r',v=>v.toFixed(2));bind('K',v=>v);bind('N0',v=>v);bind('a12',v=>v.toFixed(2));bind('a21',v=>v.toFixed(2));bind('pe',v=>v.toFixed(3));bind('nd',v=>v+' ตัว');
bind('spd2',v=>'×'+v);bind('spd3',v=>v+' ปี/วินาที');bind('spd4',v=>v+' วัน/วินาที');
['eco','pyr','cyc','biome','load','stopIn','aer'].forEach(id=>$('#'+id).addEventListener('change',()=>{sync();updateText();}));
$('#exp2').addEventListener('change',()=>{initM2();sync();updateText();});$('#nd').addEventListener('change',()=>{genPts();updateText();});$('#reseed').onclick=()=>{M2.seed++;genPts();updateText();};$('#rst2').onclick=()=>{initM2();updateText();};
$('#stype').addEventListener('change',()=>{initM3();updateText();});$('#fire').onclick=()=>{if(!M3.fx){M3.fx='fire';M3.fxT=0;}};$('#lava').onclick=()=>{if(!M3.fx){M3.fx='lava';M3.fxT=0;}};
$('#play').onclick=()=>S.running=true;$('#pause').onclick=()=>S.running=false;
$('#reset').onclick=()=>{({1:()=>{S.time=0;},2:initM2,3:initM3,4:initM4})[S.mode]();updateText();};
const TG={tgWeb:'web',tgCyc:'cyc'};Object.keys(TG).forEach(id=>$('#'+id).onclick=()=>{S.toggle=TG[id];Object.keys(TG).forEach(j=>$('#'+j).classList.toggle('on',j===id));sync();updateText();});
initM2();initM3();initM4();
let last=performance.now(),accT=0;
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;const sdt=S.running?dt:0;S.time+=sdt;if(sdt>0)[null,()=>{},stepM2,stepM3,stepM4][S.mode](sdt);
  const {g,w,h}=fit($('#main'));g.clearRect(0,0,w,h);[null,drawM1,drawM2,drawM3,drawM4][S.mode](g,w,h);drawChart();accT+=dt;if(accT>0.4){accT=0;updateText();}requestAnimationFrame(loop);}
setMode(1);requestAnimationFrame(loop);
</script>
