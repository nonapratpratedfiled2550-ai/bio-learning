<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>การศึกษาชีววิทยา | ห้องแล็บชีววิทยา</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23050806' width='32' height='32' rx='8'/%3E%3Cpath fill='%233dff8a' d='M7 23c7-1 11-9 18-14-3 9-8 15-18 14z'/%3E%3C/svg%3E">
<style>
  :root { --bg:#07141c; --ink:#e8fff1; --muted:#8fb8a0; --line:rgba(120,190,180,.22); --green:#1ed39a; --green-d:#c8ffd9; --green-s:#10281a; --card:#0c1410; --amber:#2a210c; --amber-ink:#ffd56a; --shadow:0 10px 28px rgba(0,0,0,.45); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:"Leelawadee UI", Tahoma, "Segoe UI", sans-serif; color:var(--ink); background:#050806; font-size:16.5px; line-height:1.6; }
  header { height:64px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 16px; background:rgba(5,8,6,.9); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:4; }
  .brand { display:flex; align-items:center; gap:8px; text-decoration:none; font-weight:800; color:var(--green-d); }
  .logo { width:32px; height:32px; border-radius:9px; background:#07140e; display:grid; place-items:center; }
  nav { display:flex; gap:4px; overflow:auto; }
  nav a { text-decoration:none; color:var(--green-d); padding:6px 10px; border-radius:999px; white-space:nowrap; font-size:14px; }
  nav a:hover, nav a[aria-current="page"] { background:var(--green-s); }
  .layout { height:calc(100% - 64px); display:grid; grid-template-columns:320px minmax(0,1fr) 340px; }
  .panel { overflow:auto; padding:14px; }
  .left { background:#070d0a; border-right:1px solid var(--line); }
  .center { background:#050806; }
  .right { background:#080d12; border-left:1px solid var(--line); }
  h1 { font-size:1.25rem; margin:0 0 4px; color:var(--green-d); }
  h2 { font-size:1.02rem; margin:12px 0 8px; color:var(--green-d); }
  .eyebrow { margin:0; color:var(--green); font-weight:700; font-size:13px; }
  .hint { color:var(--muted); font-size:14px; margin:0 0 10px; }
  .modes, .subs { display:grid; gap:6px; margin-bottom:10px; }
  .subs { grid-template-columns:1fr 1fr; }
  button, select, input[type="number"] { font-family:inherit; font-size:15px; }
  button { word-break:keep-all; }
  .mode, .sub, .btn, .switch { border:1px solid var(--line); background:#101814; color:var(--ink); border-radius:12px; padding:9px 10px; text-align:left; cursor:pointer; }
  .mode.on, .sub.on, .switch.on { background:#07140d; color:#3dff8a; border-color:#3dff8a; }
  .btn { background:linear-gradient(135deg,#3dff8a,#14f1c5); color:#04140c; border-color:#3dff8a; font-weight:700; text-align:center; }
  .btn.alt { background:#101814; color:var(--green-d); }
  .btn:hover { filter:brightness(.98); }
  .row { display:flex; gap:8px; margin:8px 0; }
  .row .btn { flex:1; }
  label { display:block; margin:8px 0; font-size:14.5px; color:var(--green-d); font-weight:700; }
  label span { font-weight:600; color:var(--ink); }
  input[type="range"] { width:100%; accent-color:#3dff8a; }
  select, input[type="number"] { width:100%; margin-top:4px; padding:8px; border-radius:10px; border:1px solid var(--line); background:#101814; color:var(--ink); }
  .check { display:flex; gap:8px; align-items:flex-start; font-weight:600; color:var(--ink); background:#101814; border:1px solid var(--line); padding:8px; border-radius:10px; }
  .cvwrap { height:520px; background:#101814; border:1px solid #3dff8a; border-radius:18px; overflow:hidden; box-shadow:var(--shadow); }
  .cvwrap.short { height:220px; background:#101814; border:1px solid var(--line); margin-top:8px; }
  canvas { width:100%; height:100%; display:block; }
  .formula { margin-top:10px; background:#101814; border:1px solid var(--line); border-radius:14px; padding:10px 12px; font-size:15px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
  .stat { background:#101814; border:1px solid var(--line); border-radius:14px; padding:8px 10px; }
  .stat b { display:block; color:var(--green-d); font-size:1.05rem; }
  .stat span { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; background:#101814; border-radius:12px; overflow:hidden; font-size:14px; }
  th, td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
  th { background:var(--green-s); color:var(--green-d); }
  .analysis { background:#101814; border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-top:8px; }
  .mis { background:var(--amber); border-left:4px solid #e0a100; border-radius:12px; padding:10px 12px; margin-top:8px; color:#ffe7a3; }
  .mis strong { color:var(--amber-ink); }
  .opt { display:block; width:100%; margin:6px 0; text-align:left; }
  .opt.good { border-color:var(--green); background:var(--green-s); }
  .opt.bad { border-color:#d7a3a0; background:#2a1214; }
  @media (max-width:1100px) {
    .layout { height:auto; grid-template-columns:1fr; }
    .cvwrap { height:440px; }
  }

  html{background-color:#07141c;}
  html::before{content:"";position:fixed;left:-28%;top:-28%;width:156%;height:156%;z-index:-2;pointer-events:none;background:radial-gradient(circle at 22% 18%,rgba(30,211,154,.5),transparent 32%),radial-gradient(circle at 78% 14%,rgba(46,200,230,.38),transparent 28%),radial-gradient(circle at 60% 84%,rgba(20,140,90,.28),transparent 34%);background-repeat:no-repeat;background-size:130% 130%,120% 120%,140% 140%;animation:drift 8s ease-in-out infinite alternate,blobs 10s ease-in-out infinite alternate;}
  body{background:transparent;}
  body::before{content:"";position:fixed;left:-15%;top:-15%;right:-15%;bottom:-15%;width:auto;height:auto;z-index:-1;pointer-events:none;border-radius:0;filter:none;background:transparent;background-image:radial-gradient(1.2px 1.2px at 20px 30px,rgba(255,255,255,.75),transparent),radial-gradient(1px 1px at 90px 140px,rgba(180,255,230,.7),transparent),radial-gradient(1.3px 1.3px at 170px 70px,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 40px 200px,rgba(160,230,255,.6),transparent);background-size:220px 220px;animation:stars 10s linear infinite,twinkle 2.8s ease-in-out infinite;}
  body::after{content:none;}
  header{position:sticky;top:0;z-index:4;background:rgba(7,11,9,.72);border-bottom:0;backdrop-filter:blur(12px);}
  header::after{content:none;}
  .logo{border:1px solid #1ed39a;box-shadow:0 0 14px rgba(30,211,154,.4);animation:floaty 4.2s ease-in-out infinite;}
  .layout{grid-template-columns:270px minmax(0,1fr) 300px;}
  .left,.right,.center{background:rgba(8,22,32,.72);box-shadow:none;}
  .left{border-right:1px solid rgba(120,190,180,.18);}
  .right{border-left:1px solid rgba(120,190,180,.18);}
  .mode,.sub,.switch,.btn.alt,select,input[type="text"],input[type="number"],.formula,.analysis,.stat,table{background:rgba(10,24,34,.9);border-color:rgba(120,190,180,.22);color:#e7f6f1;}
  .mode.on,.sub.on,.switch.on{background:rgba(30,180,120,.16);color:#e9fff4;border-color:#3dff8a;}
  .btn:not(.alt){color:#fff;border:0;background:#14915f;box-shadow:0 8px 18px rgba(20,145,95,.28);}
  .btn:hover{box-shadow:0 10px 24px rgba(46,200,230,.35);}
  nav a{color:#c9ddd4;}
  nav a:hover{color:#fff;background:transparent;}
  nav a[aria-current="page"]{background:#1f8a5b;color:#fff;}
  .cvwrap,.cvwrap.short{background:#f4fff8;border:1px solid rgba(46,200,180,.4);animation:screen 3.6s ease-in-out infinite;}
  .mis{background:#1c2430;color:#d7fff2;border-left-color:#2ec8e6;}
  .hint{color:#9dccc4;}
  @keyframes stars{to{transform:translate3d(-220px,-220px,0);}}
  @keyframes twinkle{0%,100%{opacity:.4;}50%{opacity:1;}}
  @keyframes drift{from{transform:translate3d(-12%,-8%,0) scale(1);}to{transform:translate3d(14%,10%,0) scale(1.2);}}
  @keyframes blobs{from{background-position:0% 0%,70% 10%,30% 100%;}to{background-position:40% 30%,0% 70%,80% 10%;}}
  @keyframes hue{to{background-position:200% 0;}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(46,200,180,.2);}50%{box-shadow:0 0 16px 2px rgba(46,200,230,.45);}}
  @keyframes edge{0%,100%{opacity:.7;}50%{opacity:1;}}
  @keyframes screen{0%,100%{box-shadow:0 0 0 1px rgba(61,255,138,.2),0 0 16px rgba(30,211,154,.15);}50%{box-shadow:0 0 0 1px rgba(61,255,138,.45),0 0 22px rgba(30,211,154,.28);}}
  @media (prefers-reduced-motion:reduce){.logo,.mode.on,.sub.on,.switch.on,.btn:not(.alt),.cvwrap,header::after,html::before,body::before,body::after{animation:none;}}
  @media (max-width:1100px){
    header{height:auto;flex-wrap:nowrap;padding:8px 14px;gap:8px;}
    nav{min-width:0;-webkit-overflow-scrolling:touch;}
    nav a{min-height:44px;display:inline-flex;align-items:center;padding:8px 12px;}
    .layout{height:auto;grid-template-columns:minmax(230px,300px) minmax(0,1fr);grid-template-areas:"controls view" "result view";}
    .left{grid-area:controls;}
    .center{grid-area:view;}
    .right{grid-area:result;border-left:0;border-top:1px solid rgba(120,190,180,.18);}
    .cvwrap{height:min(62vh,520px);}
    .cvwrap.short{height:180px;}
  }
  @media (max-width:700px){
    header{flex-wrap:wrap;}
    nav{width:100%;}
    .layout{grid-template-columns:1fr;grid-template-areas:"controls" "view" "result";}
    .left,.right{border:0;}
    .cvwrap{height:300px;}
    .stats{grid-template-columns:1fr 1fr;}
    .panel{padding:12px;}
    .mode,.sub,.btn,.switch{min-height:44px;}
    .row{display:grid;grid-template-columns:1fr 1fr;}
    .row>*{width:100%;min-width:0;}
    table{display:block;overflow-x:auto;}
  }

</style>

<header>
  <a class="brand" href="index.html"><span class="logo"><svg width="18" height="18" viewBox="0 0 32 32"><path d="M6 24c8-1 12-10 20-16-3 10-8 17-20 16z" fill="#3dff8a"/></svg></span>ห้องแล็บชีววิทยา</a>

<div class="layout">
  <aside class="panel left">
    <p class="eyebrow">บทที่ 1</p>
    <h1>การศึกษาชีววิทยา</h1>
    <div class="modes" id="modes"></div>
    <div class="subs" id="subs"></div>
    <div id="controls"></div>
  </aside>
  <main class="panel center">
    <div class="cvwrap"><canvas id="cv"></canvas></div>
    <div class="formula" id="formula"></div>
    <div class="stats" id="stats"></div>
  </main>
  <aside class="panel right">
    <h2>ผล</h2>
    <div class="cvwrap short"><canvas id="graph"></canvas></div>
    <div id="table"></div>
    <div class="analysis" id="analysis"></div>
    <div class="mis" id="mis"></div>
  </aside>
</div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const FD10 = {4:4500, 10:1800, 40:450, 100:180};
const LIFE = {
  bacteria:{name:'แบคทีเรีย', living:true, cell:true, meta:true, resp:true, grow:true},
  salt:{name:'ผลึกเกลือ', living:false, cell:false, meta:false, resp:false, grow:false},
  virus:{name:'ไวรัส', living:false, cell:false, meta:false, resp:false, grow:false},
  paramecium:{name:'พารามีเซียม', living:true, cell:true, meta:true, resp:true, grow:true},
  oil:{name:'หยดน้ำมัน', living:false, cell:false, meta:false, resp:false, grow:false}
};
const SLIDES = {
  elodea:{name:'เซลล์สาหร่ายหางกระรอก', um:80},
  rhoeo:{name:'เซลล์ว่านกาบหอย', um:70},
  rbc:{name:'เซลล์เม็ดเลือดแดง', um:7.5},
  paramecium:{name:'พารามีเซียม', um:180},
  bacteria:{name:'แบคทีเรีย', um:2},
  virus:{name:'ไวรัส', um:0.1}
};
const QUIZ = [
  {q:'ก่อนปล่อยพืชดัดแปรพันธุกรรม ต้องดูเรื่องใดก่อน', options:['ปลูกได้ทันที','ผลต่อระบบนิเวศ อาหาร และเกษตรกร','ห้ามวิจัยทั้งหมด'], a:1, why:'ต้องชั่งประโยชน์กับความเสี่ยงก่อน'},
  {q:'3Rs ข้อใดคือ Reduction', options:['ใช้สัตว์ให้น้อยที่สุด','ใช้แบบจำลองแทนสัตว์','ลดความเจ็บปวด'], a:0, why:'Reduction = ลดจำนวนสัตว์'},
  {q:'เพาะเชื้อเสร็จแล้วควรทำอย่างไร', options:['เทลงอ่าง','ฆ่าเชื้อก่อนทิ้ง','เก็บไว้บนโต๊ะ'], a:1, why:'ต้องฆ่าเชื้อก่อนทิ้ง'},
  {q:'โคลนนิ่งสัตว์ต้องคุยเรื่องใดเพิ่ม', options:['แค่เทคนิค','สวัสดิภาพสัตว์และขอบเขตการใช้','สีขน'], a:1, why:'ทำได้ ไม่ได้แปลว่าควรทำทุกอย่าง'}
];
const SYMBOLS = {
  bio:{name:'อันตรายทางชีวภาพ', mean:'มีเชื้อหรือตัวอย่างชีวภาพ ต้องป้องกันการแพร่กระจาย'},
  flame:{name:'ไวไฟ', mean:'อยู่ห่างจากเปลวไฟ และเก็บในที่ปิดมิดชิด'},
  corr:{name:'กัดกร่อน', mean:'ทำลายผิวและโลหะ ต้องใส่ถุงมือและแว่นตา'},
  toxic:{name:'พิษ', mean:'ห้ามชิม ห้ามสูดดมโดยตรง และล้างมือทุกครั้ง'},
  bsl:{name:'ระดับความปลอดภัยทางชีวภาพ', mean:'BSL-1 เสี่ยงต่ำ · BSL-2 เสี่ยงปานกลาง · BSL-3 และ 4 ใช้ในห้องเฉพาะทาง'}
};
function defaults() {
  return {
    mode:1, sub:'measure', playing:true, t:0, sample:'paramecium',
    didMeta:false, didResp:false, didGrow:false, metaT:0, stim:0,
    iv:'light', light:50, temp:28, pH:7, nutrient:50, lockCtrl:true, hypo:1,
    scope:'compound', ocular:10, objective:10, lightLv:70, coarse:50, fine:0,
    stageX:0, stageY:0, oil:false, slide:'elodea', emMag:20000, scaleMode:'eye',
    imageMm:20, divisions:12, prevM:100, prevD:1800, m1:100, d1:1800,
    quiz:0, quizPick:-1, symbol:'bio',
    safeCoat:false, safeGlass:false, safeNoTaste:false, safeWash:false, safeEye:false
  };
}
let state = defaults();

function num(n, d) {
  if (!isFinite(n)) return '-';
  return n.toLocaleString('th-TH', {maximumFractionDigits:d, minimumFractionDigits:d});
}
function optics() {
  if (state.scope === 'compound') {
    const mag = state.ocular * state.objective;
    return {mag, field: FD10[state.objective] * (10 / state.ocular), invert:true, kind:'compound'};
  }
  if (state.scope === 'stereo') {
    const mag = {4:10, 10:20, 40:30, 100:40}[state.objective];
    return {mag, field: 120000 / mag, invert:false, kind:'stereo'};
  }
  return {mag: state.emMag, field: 150000 / state.emMag, invert:false, kind: state.scope};
}
function rememberMag() {
  const o = optics();
  if (state.prevM && state.prevM !== o.mag) { state.m1 = state.prevM; state.d1 = state.prevD; }
  state.prevM = o.mag; state.prevD = o.field;
}
function rateOf(light, temp, pH, nutrient) {
  const lightF = light / (light + 25);
  const tempF = Math.exp(-Math.pow((temp - 28) / 12, 2));
  const pHF = Math.exp(-Math.pow((pH - 7) / 2, 2));
  const nutF = nutrient / (nutrient + 20);
  return 100 * lightF * tempF * pHF * nutF;
}
function expFactors() {
  const std = {light:50, temp:28, pH:7, nutrient:50};
  const f = {light:state.light, temp:state.temp, pH:state.pH, nutrient:state.nutrient};
  if (state.lockCtrl) Object.keys(std).forEach((k) => { if (k !== state.iv) f[k] = std[k]; });
  return f;
}
function currentRate() {
  const f = expFactors();
  return rateOf(f.light, f.temp, f.pH, f.nutrient);
}
function controlRate() {
  const std = {light:50, temp:28, pH:7, nutrient:50};
  const f = expFactors();
  f[state.iv] = std[state.iv];
  return rateOf(f.light, f.temp, f.pH, f.nutrient);
}

const MODES = [
  [1, '1. ลักษณะสิ่งมีชีวิต'],
  [2, '2. กระบวนการทางวิทยาศาสตร์'],
  [3, '3. กล้องจุลทรรศน์'],
  [4, '4. วัดขนาดและจริยธรรม']
];
function renderNav() {
  $('modes').innerHTML = MODES.map(([id, name]) => `<button class="mode ${state.mode===id?'on':''}" data-act="mode" data-v="${id}">${name}</button>`).join('');
  const subs = state.mode === 4
    ? [['measure','ไมโครเมตร'],['ethics','จริยธรรม'],['safety','ความปลอดภัย']]
    : [];
  $('subs').innerHTML = subs.map(([id, name]) => `<button class="sub ${state.sub===id?'on':''}" data-act="sub" data-v="${id}">${name}</button>`).join('');
}
function slider(key, label, min, max, step, unit) {
  return `<label>${label} <span data-for="${key}">${num(state[key], step<1?1:0)} ${unit||''}</span>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${state[key]}" data-key="${key}"></label>`;
}
function renderControls() {
  renderNav();
  let html = '';
  if (state.mode === 1) {
    html += `<label>ตัวอย่าง<span></span><select data-key="sample">${Object.entries(LIFE).map(([k,v]) => `<option value="${k}" ${state.sample===k?'selected':''}>${v.name}</option>`).join('')}</select></label>
      <button class="btn" data-act="meta" style="width:100%">ทดสอบเมแทบอลิซึม</button>
      <button class="btn alt" data-act="resp" style="width:100%;margin-top:8px">กระตุ้นสิ่งเร้า</button>
      <button class="btn alt" data-act="grow" style="width:100%">เร่งเวลาดูการเพิ่มจำนวน</button>`;
  } else if (state.mode === 2) {
    html += `<label>ตัวแปรต้น<span></span><select data-key="iv">
      ${[['light','ความเข้มแสง'],['temp','อุณหภูมิ'],['pH','ค่า pH'],['nutrient','สารอาหาร']].map(([k,n]) => `<option value="${k}" ${state.iv===k?'selected':''}>${n}</option>`).join('')}
      </select></label>
      ${slider('light','ความเข้มแสง',0,100,1,'%')}
      ${slider('temp','อุณหภูมิ',0,50,1,'°C')}
      ${slider('pH','ค่า pH',1,14,0.5,'')}
      ${slider('nutrient','สารอาหาร',0,100,1,'%')}
      <label class="check"><input type="checkbox" data-key="lockCtrl" ${state.lockCtrl?'checked':''}> ล็อกตัวแปรที่ไม่ใช่ตัวแปรต้นไว้ที่ค่ามาตรฐาน</label>
      <p class="hint">ชุดควบคุม: แสง 50% · 28°C · pH 7</p>`;
  } else if (state.mode === 3 || (state.mode===4 && state.sub==='measure')) {
    html += `<label>ชนิดกล้อง<span></span><select data-key="scope">
      ${[['compound','ใช้แสงเชิงประกอบ'],['stereo','สเตอริโอ'],['sem','อิเล็กตรอน SEM'],['tem','อิเล็กตรอน TEM']].map(([k,n]) => `<option value="${k}" ${state.scope===k?'selected':''}>${n}</option>`).join('')}
      </select></label>
      <label>สไลด์<span></span><select data-key="slide">${Object.entries(SLIDES).map(([k,v]) => `<option value="${k}" ${state.slide===k?'selected':''}>${v.name}</option>`).join('')}</select></label>`;
    if (state.scope==='sem' || state.scope==='tem') html += slider('emMag','กำลังขยายกล้องอิเล็กตรอน',2000,150000,1000,'×');

function fit(canvas, h) {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(10, rect.width), height = Math.max(10, rect.height || h);
  const W = Math.floor(w * dpr), H = Math.floor(height * dpr);
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return {ctx, w, h: height};
}
function paper(ctx, w, h) {
  ctx.fillStyle = '#fff8fb'; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(80,160,110,.18)'; ctx.lineWidth = 1;
  for (let x = 0; x < w; x += 28) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = 0; y < h; y += 28) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
}
function drawLife(ctx, w, h) {
  paper(ctx, w, h);
  const life = LIFE[state.sample];
  const cx = w * 0.5, cy = h * 0.52, R = Math.min(w, h) * 0.34;
  ctx.fillStyle = '#d9efe4'; ctx.beginPath(); ctx.ellipse(cx, cy + 18, R * 1.15, R * 0.95, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#7dbea0'; ctx.lineWidth = 8; ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.ellipse(cx, cy, R, R * 0.82, 0, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = '#070d0a'; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  const t = state.t;
  if (state.sample === 'paramecium') {
    const x = cx + Math.sin(t * 1.4) * 30 + (state.didResp && life.resp ? 40 : 0);
    const y = cy + Math.cos(t * 1.1) * 16;
    ctx.fillStyle = '#8fd0a8'; ctx.beginPath(); ctx.ellipse(x, y, 70, 32, Math.sin(t) * 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1f8f55'; ctx.lineWidth = 2;
    for (let i = 0; i < 18; i++) {
      const a = i / 18 * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * 68, y + Math.sin(a) * 30); ctx.lineTo(x + Math.cos(a) * 82, y + Math.sin(a) * 40); ctx.stroke();
    }
    ctx.fillStyle = '#2f7a4e'; ctx.beginPath(); ctx.ellipse(x - 10, y, 16, 10, 0, 0, Math.PI * 2); ctx.fill();
  } else if (state.sample === 'bacteria') {
    const n = state.didGrow && life.grow ? 18 : 7;
    for (let i = 0; i < n; i++) {
      const x = cx - 90 + (i % 6) * 34, y = cy - 50 + Math.floor(i / 6) * 36;
      ctx.fillStyle = '#2e9a62'; ctx.fillRect(x, y + Math.sin(t + i) * 2, 22, 10);
    }
  } else if (state.sample === 'salt') {
    ctx.strokeStyle = '#9aa8b5'; ctx.lineWidth = 2; ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (let i = 0; i < 5; i++) {
      ctx.save(); ctx.translate(cx - 70 + i * 34, cy); ctx.rotate(i); ctx.fillRect(-16, -16, 32, 32); ctx.strokeRect(-16, -16, 32, 32); ctx.restore();
    }
  } else if (state.sample === 'oil') {
    ctx.fillStyle = '#f0c24d';
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(cx - 40 + i * 28, cy + Math.sin(t + i) * 4, 16 + i * 3, 0, Math.PI * 2); ctx.fill(); }
  } else {
    ctx.strokeStyle = '#607d8b'; ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const x = cx - 80 + (i % 4) * 48, y = cy - 20 + Math.floor(i / 4) * 40;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 10, y - 16); ctx.lineTo(x + 22, y); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + 8, y - 18, 4, 0, Math.PI * 2); ctx.stroke();
    }
  }
  if (state.didMeta) {
    ctx.fillStyle = life.meta ? 'rgba(192,57,43,.35)' : 'rgba(47,111,237,.25)';
    ctx.fillRect(cx - R, cy + 40, R * 2, 80);
    ctx.fillStyle = '#143028'; ctx.font = '600 16px Leelawadee UI, Tahoma';
    ctx.fillText(life.meta ? 'อินดิเคเตอร์เปลี่ยนสี: มีเมแทบอลิซึม' : 'สีไม่เปลี่ยน: ไม่มีเมแทบอลิซึม', cx - 130, cy + 78);
  }
  if (state.didResp) {
    ctx.strokeStyle = '#e0a100'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(cx - R + 10, cy - 20); ctx.lineTo(cx - 20, cy); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = '#2f7a4e'; ctx.font = '700 18px Leelawadee UI, Tahoma';
  ctx.fillText(life.name, 24, 36);
}
function cellGrid(ctx, cols, rows, w, h, color, t, cycle) {
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const x = (i - cols / 2) * w, y = (j - rows / 2) * h;
    ctx.fillStyle = color; ctx.strokeStyle = '#2f7a4e'; ctx.lineWidth = 1.2;
    ctx.fillRect(x, y, w - 3, h - 3); ctx.strokeRect(x, y, w - 3, h - 3);
    ctx.fillStyle = '#143028'; ctx.beginPath(); ctx.arc(x + w * 0.55, y + h * 0.5, Math.min(w, h) * 0.12, 0, Math.PI * 2); ctx.fill();
    if (cycle) {
      for (let k = 0; k < 6; k++) {
        const p = ((t * 0.25 + k / 6) % 1);
        const per = p < 0.25 ? [w * p / 0.25, 4] : p < 0.5 ? [w - 4, h * (p - 0.25) / 0.25] : p < 0.75 ? [w - w * (p - 0.5) / 0.25, h - 4] : [4, h - h * (p - 0.75) / 0.25];
        ctx.fillStyle = '#2e7d32'; ctx.beginPath(); ctx.arc(x + per[0], y + per[1], 2.4, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
}
function drawSpecimen(ctx, t) {
  const kind = state.slide;
  if (kind === 'elodea') cellGrid(ctx, 3, 3, 90, 42, 'rgba(170,214,120,.9)', t, true);
  else if (kind === 'rhoeo') cellGrid(ctx, 3, 3, 78, 48, 'rgba(150,80,140,.85)', t, false);
  else if (kind === 'rbc') {
    for (let i = 0; i < 18; i++) {
      const x = ((i % 6) - 2.5) * 16, y = (Math.floor(i / 6) - 1) * 14;
      ctx.fillStyle = '#e57373'; ctx.beginPath(); ctx.ellipse(x, y, 6.2, 6.2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffcdd2'; ctx.beginPath(); ctx.arc(x, y, 2.1, 0, Math.PI * 2); ctx.fill();
    }
  } else if (kind === 'paramecium') {
    ctx.fillStyle = '#9ccc65'; ctx.beginPath(); ctx.ellipse(0, 0, 90, 36, Math.sin(t) * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#33691e'; ctx.beginPath(); ctx.ellipse(-16, 0, 18, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#558b2f'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 24; i++) {
      const a = i / 24 * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * 88, Math.sin(a) * 34); ctx.lineTo(Math.cos(a) * 102, Math.sin(a) * 44); ctx.stroke();
    }
  } else if (kind === 'bacteria') {
    for (let i = 0; i < 12; i++) {
      ctx.fillStyle = '#2e7d32';
      ctx.fillRect(-40 + (i % 4) * 22, -20 + Math.floor(i / 4) * 16, 14, 6);
    }
  } else {
    ctx.save();
    ctx.scale(0.012, 0.012);
    ctx.strokeStyle = state.scope === 'tem' ? '#d0d0d0' : '#455a64'; ctx.lineWidth = 80;
    ctx.beginPath(); ctx.moveTo(0, 80); ctx.lineTo(0, -60); ctx.lineTo(-70, -160); ctx.moveTo(0, -60); ctx.lineTo(70, -160); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -180, 70, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}
function drawScope(ctx, w, h) {
  const o = optics();
  ctx.fillStyle = '#e5f8ec'; ctx.fillRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2 + 8, R = Math.min(w, h) * 0.38;
  const focusErr = Math.abs(state.coarse + state.fine - 50);
  let blur = (state.scope === 'sem' || state.scope === 'tem') ? 0 : focusErr / 8;
  if (state.scope === 'compound' && state.objective === 100 && !state.oil) blur += 6;
  const dim = state.scope === 'compound' ? Math.min(1, Math.pow(10 / state.objective, 0.35)) : 1;
  const bright = Math.max(0.05, (state.lightLv / 100) * dim);
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
  if (o.kind === 'tem') ctx.fillStyle = '#070707';
  else if (o.kind === 'sem') ctx.fillStyle = `rgb(${40+80*bright},${40+80*bright},${40+80*bright})`;
  else ctx.fillStyle = `rgb(${Math.round(230*bright)},${Math.round(244*bright)},${Math.round(214*bright)})`;
  ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  ctx.save();
  ctx.filter = `blur(${blur}px)${o.kind==='sem'?' grayscale(1) contrast(1.15)':''}`;
  ctx.translate(cx, cy);
  if (o.invert) ctx.scale(-1, -1);
  ctx.translate(state.stageX, state.stageY);
  const px = (R * 2) / o.field;
  ctx.scale(px, px);
  drawSpecimen(ctx, state.t);
  ctx.restore();
  ctx.restore();
  if (state.slide === 'virus' && o.field > 3) {
    ctx.fillStyle = o.kind === 'tem' || o.kind === 'sem' ? '#fff' : '#2f7a4e';
    ctx.font = '600 16px Leelawadee UI, Tahoma';
    ctx.fillText('ไวรัสเล็กเกินกว่าจะเห็นด้วยกำลังขยายนี้', cx - 150, cy);
  }
  ctx.strokeStyle = 'rgba(196,93,134,.75)'; ctx.lineWidth = 1;
  if (state.scaleMode === 'eye') {
    for (let i = -5; i <= 5; i++) {
      ctx.beginPath(); ctx.moveTo(cx + i * R / 6, cy); ctx.lineTo(cx + i * R / 6, cy + (i % 5 === 0 ? 16 : 8)); ctx.stroke();
    }
  } else {
    const bar = R * 0.4;
    const um = o.field * 0.2;
    ctx.beginPath(); ctx.moveTo(cx - bar / 2, cy + R * 0.62); ctx.lineTo(cx + bar / 2, cy + R * 0.62); ctx.stroke();
    ctx.fillStyle = '#2f7a4e'; ctx.font = '600 14px Leelawadee UI, Tahoma';
    ctx.fillText(num(um, um < 10 ? 2 : 0) + ' µm', cx - 28, cy + R * 0.62 - 8);
  }
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.strokeStyle = '#b7e4c7'; ctx.lineWidth = 14; ctx.stroke();
  ctx.fillStyle = '#2f7a4e'; ctx.font = '700 16px Leelawadee UI, Tahoma';
  const label = {compound:'เชิงประกอบ · ภาพหัวกลับ', stereo:'สเตอริโอ · ภาพหัวตั้ง', sem:'SEM · พื้นผิว', tem:'TEM · ภาคตัด'}[o.kind];
  ctx.fillText(label + ' · ' + num(o.mag, 0) + '×', 18, 32);
}
function drawSymbol(ctx, w, h) {
  paper(ctx, w, h);
  const cx = w / 2, cy = h / 2;
  ctx.save(); ctx.translate(cx, cy - 20); ctx.lineWidth = 8; ctx.lineJoin = 'round'; ctx.strokeStyle = '#c4451d'; ctx.fillStyle = '#c4451d';
  const s = state.symbol;
  if (s === 'bio') {
    ctx.beginPath(); ctx.arc(0, 0, 70, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(0, 0, 46, i * 2.1, i * 2.1 + 1.2); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
  } else if (s === 'flame') {
    ctx.beginPath(); ctx.moveTo(0, 80); ctx.quadraticCurveTo(70, 20, 10, -80); ctx.quadraticCurveTo(-10, -20, -20, 10); ctx.quadraticCurveTo(-60, 30, 0, 80); ctx.fill();
  } else if (s === 'corr') {
    ctx.beginPath();
    for (let i = 0; i < 2; i++) { const y = -20 + i * 40; ctx.moveTo(-70, y); ctx.lineTo(70, y - 20); }
    ctx.stroke();
  } else if (s === 'toxic') {
    ctx.beginPath(); ctx.moveTo(0, -70); ctx.lineTo(64, 50); ctx.lineTo(-64, 50); ctx.closePath(); ctx.stroke();
    ctx.font = '700 42px Leelawadee UI'; ctx.fillText('!', -10, 30);
  } else {
    ctx.font = '800 42px Leelawadee UI'; ctx.fillStyle = '#2f7a4e'; ctx.fillText('BSL', -42, 10);
  }
  ctx.restore();
  ctx.fillStyle = '#2f7a4e'; ctx.font = '700 20px Leelawadee UI, Tahoma';
  ctx.fillText(SYMBOLS[s].name, 24, 40);
}
function drawExperiment(ctx, w, h) {
  paper(ctx, w, h);
  const exp = currentRate(), ctrl = controlRate();
  function tube(x, rate, title) {
    ctx.fillStyle = '#d7ece3'; ctx.fillRect(x - 34, 70, 68, 250);
    ctx.strokeStyle = '#8fbfae'; ctx.strokeRect(x - 34, 70, 68, 250);
    const lh = 40 + rate * 1.5;
    ctx.fillStyle = 'rgba(46,160,90,.75)'; ctx.fillRect(x - 28, 300 - lh, 56, lh);
    ctx.fillStyle = '#e8f5e9';
    const n = Math.round(rate / 12);
    for (let i = 0; i < n; i++) {
      const y = 280 - ((state.t * 40 + i * 28) % 180);
      ctx.beginPath(); ctx.arc(x + Math.sin(i + state.t) * 10, y, 5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#1b5e20'; ctx.fillRect(x - 8, 150, 16, 70);
    ctx.beginPath(); ctx.ellipse(x, 145, 26, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2f7a4e'; ctx.font = '700 16px Leelawadee UI, Tahoma';
    ctx.fillText(title, x - 36, 350);
    ctx.font = '600 15px Leelawadee UI, Tahoma';
    ctx.fillText(num(rate, 1) + ' หน่วย', x - 32, 372);
  }
  tube(w * 0.32, exp, 'ชุดทดลอง');
  tube(w * 0.68, ctrl, 'ชุดควบคุม');
  ctx.fillStyle = '#2f7a4e'; ctx.font = '700 18px Leelawadee UI, Tahoma';
  ctx.fillText('ฟองแทนอัตราการสังเคราะห์ด้วยแสง', 20, 36);
}
function drawEthics(ctx, w, h) {
  paper(ctx, w, h);
  ctx.fillStyle = '#2f7a4e'; ctx.font = '700 20px Leelawadee UI, Tahoma';
  ctx.fillText('กรณีศึกษาที่ ' + (state.quiz + 1), 24, 42);
  ctx.font = '16px Leelawadee UI, Tahoma';
  const text = QUIZ[state.quiz].q;
  const words = text.split(' ');
  let line = '', y = 90;
  words.forEach((word) => {
    if ((line + word).length > 32) { ctx.fillText(line, 24, y); y += 28; line = word + ' '; }
    else line += word + ' ';
  });
  ctx.fillText(line, 24, y);
}
function drawMain() {
  const {ctx, w, h} = fit($('cv'));
  if (state.mode === 1) drawLife(ctx, w, h);
  else if (state.mode === 2) drawExperiment(ctx, w, h);
  else if (state.mode === 3 || (state.mode === 4 && state.sub === 'measure')) drawScope(ctx, w, h);
  else if (state.mode === 4 && state.sub === 'ethics') drawEthics(ctx, w, h);
  else drawSymbol(ctx, w, h);
}
function drawGraph() {
  const {ctx, w, h} = fit($('graph'));
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  const pad = {l:42, r:12, t:18, b:32};
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  ctx.strokeStyle = '#e7b7cc'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad.l, pad.t); ctx.lineTo(pad.l, pad.t + ih); ctx.lineTo(pad.l + iw, pad.t + ih); ctx.stroke();
  ctx.fillStyle = '#4e6a5c'; ctx.font = '12px Leelawadee UI, Tahoma';
  if (state.mode === 2) {
    const ranges = {light:[0,100,'แสง %'], temp:[0,50,'อุณหภูมิ'], pH:[1,14,'pH'], nutrient:[0,100,'สารอาหาร']};
    const [xmin, xmax, xlab] = ranges[state.iv];
    const f = expFactors();
    const pts = [];
    for (let i = 0; i <= 24; i++) {
      const x = xmin + (xmax - xmin) * i / 24;
      const g = Object.assign({}, f); g[state.iv] = x;
      pts.push([x, rateOf(g.light, g.temp, g.pH, g.nutrient)]);
    }
    ctx.strokeStyle = '#7dcea0'; ctx.lineWidth = 2; ctx.beginPath();
    pts.forEach((p, i) => {
      const X = pad.l + (p[0] - xmin) / (xmax - xmin) * iw;
      const Y = pad.t + ih - (p[1] / 100) * ih;
      if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    });
    ctx.stroke();
    const xv = expFactors()[state.iv];
    const X = pad.l + (xv - xmin) / (xmax - xmin) * iw;
    const Y = pad.t + ih - (currentRate() / 100) * ih;
    ctx.fillStyle = '#2f7a4e'; ctx.beginPath(); ctx.arc(X, Y, 5, 0, Math.PI * 2); ctx.fill();
    const std = {light:50, temp:28, pH:7, nutrient:50}[state.iv];
    const Xs = pad.l + (std - xmin) / (xmax - xmin) * iw;
    const Ys = pad.t + ih - (controlRate() / 100) * ih;
    ctx.fillStyle = '#e0a100'; ctx.beginPath(); ctx.moveTo(Xs, Ys - 7); ctx.lineTo(Xs + 6, Ys + 5); ctx.lineTo(Xs - 6, Ys + 5); ctx.fill();
    ctx.fillStyle = '#4e6a5c'; ctx.fillText(xlab, pad.l + iw / 2 - 20, h - 8); ctx.fillText('อัตรา', 6, 14);
  } else if (state.mode === 1) {
    const life = LIFE[state.sample];
    const vals = [life.cell?1:0, (life.meta&&state.didMeta)?1:0, (life.resp&&state.didResp)?1:0, (life.grow&&state.didGrow)?1:0, life.living?1:0];
    const labels = ['เซลล์','เมแทบอลิซึม','ตอบสนอง','เพิ่มจำนวน','สรุป'];
    vals.forEach((v, i) => {
      const x = pad.l + i * (iw / 5) + 8;
      ctx.fillStyle = v ? '#7dcea0' : '#d5e8dc';
      ctx.fillRect(x, pad.t + ih - v * (ih - 10) - (v?0:4), 28, v ? ih - 16 : 4);
      ctx.fillStyle = '#4e6a5c'; ctx.fillText(labels[i], x - 6, h - 10);
    });
  } else {
    const o = optics();
    ctx.strokeStyle = '#7dcea0'; ctx.lineWidth = 2; ctx.beginPath();
    const mags = state.scope==='compound' ? [5,10,15].flatMap(oc => [4,10,40,100].map(ob => oc*ob)) : [o.mag*0.25, o.mag*0.5, o.mag, o.mag*1.5];
    const uniq = [...new Set(mags)].sort((a,b)=>a-b);
    const fields = uniq.map(m => state.d1 * state.m1 / m);
    const maxF = Math.max(...fields);
    uniq.forEach((m, i) => {
      const X = pad.l + i / (uniq.length - 1) * iw;
      const Y = pad.t + ih - (fields[i] / maxF) * ih;
      if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    });
    ctx.stroke();
    ctx.fillStyle = '#4e6a5c'; ctx.fillText('กำลังขยายเพิ่ม → ภาพแคบลง', pad.l, 14);
  }
}

function applyInput(t) {
  const key = t.dataset.key;
  if (!key) return;
  let v;
  if (t.type === 'checkbox') v = t.checked;
  else if (t.type === 'range' || t.type === 'number') v = parseFloat(t.value);
  else v = t.value;
  if (key === 'ocular' || key === 'objective' || key === 'emMag') v = parseFloat(v);
  state[key] = v;
  const lab = document.querySelector(`[data-for="${key}"]`);
  if (lab) {
    const unit = key === 'light' || key === 'nutrient' || key === 'lightLv' ? '%' : key === 'temp' ? '°C' : key === 'imageMm' ? 'mm' : key === 'divisions' ? 'ช่อง' : key === 'emMag' ? '×' : '';
    lab.textContent = `${num(state[key], String(t.step).includes('.') ? 1 : 0)} ${unit}`;
  }
  if (key === 'ocular' || key === 'objective' || key === 'emMag' || key === 'scope') rememberMag();
  if (key === 'scope' || key === 'sample' || key === 'iv') renderControls();
  side();
}
document.addEventListener('input', (e) => applyInput(e.target));
document.addEventListener('change', (e) => applyInput(e.target));
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === 'mode') { state.mode = parseInt(v, 10); if (state.mode === 4 && !['measure','ethics','safety'].includes(state.sub)) state.sub = 'measure'; renderControls(); side(); }
  if (act === 'sub') { state.sub = v; renderControls(); side(); }
  if (act === 'play') { state.playing = !state.playing; renderControls(); }
  if (act === 'reset') { const m = state.mode, s = state.sub; state = defaults(); state.mode = m; state.sub = s; renderControls(); side(); }
  if (act === 'meta') { state.didMeta = true; state.metaT = 0; side(); }
  if (act === 'resp') { state.didResp = true; side(); }
  if (act === 'grow') { state.didGrow = true; side(); }
  if (act === 'scale') { state.scaleMode = v; renderControls(); side(); }
  if (act === 'hypo') { state.hypo = parseInt(v, 10); side(); }
  if (act === 'quiz') { state.quizPick = parseInt(v, 10); renderControls(); side(); }
  if (act === 'qprev') { state.quiz = (state.quiz + QUIZ.length - 1) % QUIZ.length; state.quizPick = -1; renderControls(); side(); }
  if (act === 'qnext') { state.quiz = (state.quiz + 1) % QUIZ.length; state.quizPick = -1; renderControls(); side(); }
  if (act === 'answer') {
    const o = optics();
    state.imageMm = Math.round(SLIDES[state.slide].um / 1000 * o.mag * 10) / 10;
    state.divisions = Math.round(SLIDES[state.slide].um / (o.field / 100));
    renderControls(); side();
  }
});
let last = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
  if (state.playing) state.t += dt;
  drawMain(); drawGraph();
  requestAnimationFrame(loop);
}
renderControls(); rememberMag(); side();
requestAnimationFrame(loop);
document.documentElement.dataset.ready = 'study';
</script>
