<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>วิวัฒนาการ – Interactive Biology Lab</title>
<style>
:root{--bg:#0d1117;--panel:#141b26;--panel2:#1b2433;--line:#2a3648;--txt:#e6edf7;--mut:#97a6bd;--acc:#a3e635;--acc2:#fbbf24;--bad:#f87171;--good:#4ade80}
*{box-sizing:border-box}
body{margin:0;font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{padding:12px 18px;background:linear-gradient(90deg,#1a2e12,#2b1f0f);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:12px}
header h1{font-size:19px;margin:0}header .sub{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr) 370px;gap:12px;padding:12px}
@media(max-width:1280px){.grid{grid-template-columns:290px minmax(0,1fr)}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}.right .card{margin:0}}
@media(max-width:820px){.grid{grid-template-columns:1fr}.right{display:block}.right .card{margin-bottom:12px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:15px;color:var(--acc)}
.modes button{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;font:inherit;font-size:13px}
.modes button.on{background:#365314;border-color:var(--acc)}
.ctl{margin:9px 0}.ctl label{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:3px}.ctl label b{color:var(--acc2)}
input[type=range]{width:100%;accent-color:var(--acc)}
select{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.btn{padding:8px;border-radius:8px;border:1px solid var(--line);background:#222d40;color:var(--txt);cursor:pointer;font:inherit;font-size:13px}
.btn:hover{border-color:var(--acc)}.btn.pri{background:#3f6212;border-color:#84cc16}.btn.warn{background:#7c2d12;border-color:#f97316}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;margin:6px 0}
.switch{display:flex;background:var(--panel2);border-radius:9px;padding:3px;border:1px solid var(--line)}
.switch button{flex:1;border:0;background:transparent;color:var(--mut);padding:7px 4px;border-radius:7px;cursor:pointer;font:inherit;font-size:12px}
.switch button.on{background:#b45309;color:#fff}.switch button.on.dw{background:#15803d}
canvas{display:block;width:100%}
#main{height:470px;background:#06090f;border-radius:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel2);border-radius:10px;padding:8px;border:1px solid var(--line)}
.stat .k{font-size:11.5px;color:var(--mut)}.stat .v{font-size:17px;font-weight:700;color:var(--acc2);margin-top:2px}
.eq{font-family:Consolas,monospace;background:#0b111b;padding:10px;border-radius:8px;border-left:4px solid var(--acc);white-space:pre-wrap;font-size:13px;margin-top:10px;line-height:1.5}
.theory{margin-top:10px;padding:10px;border-radius:8px;background:#1a2412;border:1px solid #3f6212;line-height:1.55}
table{width:100%;border-collapse:collapse;font-size:12.5px}td,th{border:1px solid var(--line);padding:4px 6px;text-align:center}th{background:var(--panel2);color:var(--acc)}
.mis{background:#2a1a10;border-color:#7b4a1e}.mis h3{color:var(--acc2)}.mis p,.ana p{margin:6px 0;line-height:1.55}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:12px;margin-right:4px}
.ok{background:#14532d;color:#bbf7d0}.no{background:#7f1d1d;color:#fecaca}.mid{background:#713f12;color:#fde68a}
.hint{font-size:12px;color:var(--mut);line-height:1.5}
.chart{height:240px;background:#080d16;border-radius:8px}
.seq{font-family:Consolas,monospace;font-size:11px;word-break:break-all;line-height:1.5}
.seq .d{background:#7f1d1d;color:#fff}
</style>
<link rel="stylesheet" href="float-lab.css">
</head>
<body>
<header><a href="index.html" style="color:#8dffc0;text-decoration:none;font-weight:700;margin-right:6px">← หน้าแรก</a><h1>🦋 วิวัฒนาการ (Evolution)</h1><span class="sub">ห้องปฏิบัติการเสมือนจริง ชีววิทยา ม.4–ม.6</span></header>
<div class="grid">
<div class="left">
  <div class="card modes"><h3>เลือกโหมดการจำลอง</h3>
    <button data-mode="1" class="on">โหมด 1 : การคัดเลือกโดยธรรมชาติ (ผีเสื้อกลางคืน Peppered moth)</button>
    <button data-mode="2">โหมด 2 : พันธุศาสตร์ประชากร Hardy-Weinberg &amp; Genetic Drift</button>
    <button data-mode="3">โหมด 3 : การเกิดสปีชีส์ใหม่และการแยกกันทางการสืบพันธุ์</button>
    <button data-mode="4">โหมด 4 : ต้นไม้แห่งชีวิตและวิวัฒนาการมนุษย์</button>
  </div>
  <div class="card"><h3>แผงควบคุมตัวแปร</h3>
    <div data-m="1 2 3">
      <div class="ctl"><label>ขนาดประชากร N <b id="nV">500</b></label><input type="range" id="nS" min="0" max="1000" value="566"></div>
      <div class="ctl"><label>แรงกดดันการคัดเลือก s <b id="sV">0.50</b></label><input type="range" id="sS" min="0" max="1" step="0.01" value="0.5"></div>
      <div class="ctl"><label>อัตราการอพยพ (Gene flow) m <b id="mV">0 %</b></label><input type="range" id="mS" min="0" max="50" step="1" value="0"></div>
      <div class="ctl"><label>อัตรามิวเทชัน μ <b id="uV">0.005</b></label><input type="range" id="uS" min="0" max="0.05" step="0.001" value="0.005"></div>
    </div>
    <div data-m="1">
      <div class="ctl"><label>สภาพแวดล้อม</label><select id="env">
        <option value="clean">ป่าสมบูรณ์ – เปลือกไม้สีอ่อน มีไลเคน</option>
        <option value="poll">มลพิษยุคอุตสาหกรรม – เปลือกไม้ดำด้วยเขม่า</option>
        <option value="mixed">ป่าผสม – ต้นไม้สีอ่อนและเข้มปะปน</option>
        <option value="mid">เปลือกไม้สีกลาง ๆ สม่ำเสมอ</option></select></div>
    </div>
    <div data-m="2">
      <div class="ctl"><label>ความถี่อัลลีลเริ่มต้น p (A) <b id="p0V">0.50</b></label><input type="range" id="p0" min="0.01" max="0.99" step="0.01" value="0.5"></div>
      <div class="ctl"><label>ความถี่ q ของผู้อพยพ <b id="qmV">0.50</b></label><input type="range" id="qm" min="0" max="1" step="0.01" value="0.5"></div>
      <div class="ctl"><label>การเลือกคู่ผสม (Inbreeding F) <b id="fV">0.00</b></label><input type="range" id="fS" min="0" max="1" step="0.05" value="0"></div>
      <div class="ctl"><label>ความเร็ว (รุ่น/วินาที) <b id="gsV">20</b></label><input type="range" id="gs" min="1" max="60" value="20"></div>
      <div class="btns"><button class="btn warn" id="bott">🌋 Bottleneck (ภัยพิบัติ)</button><button class="btn warn" id="found">⛵ Founder (ตั้งถิ่นฐานใหม่)</button></div>
    </div>
    <div data-m="3">
      <div class="ctl"><label>สิ่งกีดขวางทางภูมิศาสตร์</label><select id="barrier"><option value="none">ไม่มี (ประชากรเดียวกัน)</option><option value="river">แม่น้ำ</option><option value="mount" selected>เทือกเขา</option></select></div>
      <label class="chk"><input type="checkbox" id="envDiff" checked> สภาพแวดล้อมสองฝั่งต่างกัน (แห้งแล้ง vs ชุ่มชื้น)</label>
      <div class="btns"><button class="btn warn" id="poly" style="grid-column:1/-1">🌱 จำลอง Sympatric: เกิด Polyploidy (4n)</button></div>
    </div>
    <div data-m="4">
      <div class="ctl"><label>มุมมอง</label><select id="view4"><option value="tree">ผังวิวัฒนาการ & ไซโทโครม c</option><option value="human">วิวัฒนาการมนุษย์ (Hominins)</option></select></div>
      <div id="cmpBox"><div class="ctl"><label>สปีชีส์ A</label><select id="spA"></select></div><div class="ctl"><label>สปีชีส์ B</label><select id="spB"></select></div></div>
      <div id="homBox"><div class="ctl"><label>เลือกสปีชีส์มนุษย์โบราณ</label><select id="hom"></select></div></div>
      <p class="hint">คลิกบนแผนภาพเพื่อเลือกสปีชีส์ได้</p>
    </div>
  </div>
  <div class="card"><h3>การควบคุมการจำลอง</h3>
    <div class="btns"><button class="btn pri" id="play">▶ เล่น</button><button class="btn" id="pause">⏸ หยุด</button><button class="btn" id="step">⏭ ทีละรุ่น</button><button class="btn" id="reset">↺ รีเซ็ต</button></div>
    <div class="ctl" style="margin-top:12px"><label>เปรียบเทียบแนวคิด (Toggle)</label>
      <div class="switch"><button id="tgL">แนวคิด Lamarck</button><button id="tgD" class="on dw">แนวคิด Darwin</button></div></div>
  </div>
</div>
<div class="center"><div class="card">
  <h3 id="simTitle">หน้าจอจำลอง</h3>
  <canvas id="main"></canvas>
  <div class="stats" id="stats"></div>
  <div class="eq" id="eq"></div>
  <div class="theory" id="theory"></div>
</div></div>
<div class="right">
  <div class="card"><h3 id="chartTitle">กราฟ</h3><canvas id="chart" class="chart"></canvas><div id="tableBox" style="margin-top:8px"></div></div>
  <div class="card ana"><h3>📋 บทวิเคราะห์</h3><div id="analysis"></div></div>
  <div class="card mis"><h3>⚠️ ข้อเข้าใจคลาดเคลื่อนที่พบบ่อย</h3><div id="mis"></div></div>
</div>
</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function fit(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const W=Math.max(1,Math.round(r.width*d)),H=Math.max(1,Math.round(r.height*d));if(c.width!==W||c.height!==H){c.width=W;c.height=H;}const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);return{g,w:r.width,h:r.height};}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function T(g,s,x,y,col='#e6edf7',size=12,align='left',bold=false){g.fillStyle=col;g.font=(bold?'700 ':'')+size+'px "Sarabun","Leelawadee UI",Tahoma,sans-serif';g.textAlign=align;g.textBaseline='middle';g.fillText(s,x,y);}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
function hash(i){let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function binom(n,p){if(p<=0)return 0;if(p>=1)return n;if(n>200){return clamp(Math.round(n*p+gauss()*Math.sqrt(n*p*(1-p))),0,n);}let k=0;for(let i=0;i<n;i++)if(Math.random()<p)k++;return k;}
const getN=()=>Math.round(10*Math.pow(10,3*(+$('#nS').value)/1000));
const S={mode:1,running:false,darwin:true,time:0};

/* ================= MODE 1 : NATURAL SELECTION ================= */
const SLOTS=150;
const M1={};
function bgAt(x){const e=$('#env').value;if(e==='clean')return 0.15;if(e==='poll')return 0.85;if(e==='mid')return 0.5;return (Math.floor(x*6)%2===0)?0.12:0.88;}
function initM1(){const N=getN();M1.N=N;M1.G=new Uint8Array(N*8);M1.pos=new Float32Array(N);M1.acq=new Float32Array(N);M1.alive=new Uint8Array(N).fill(1);
  for(let i=0;i<N;i++){for(let k=0;k<8;k++)M1.G[i*8+k]=Math.random()<0.15?1:0;M1.pos[i]=Math.random();}
  M1.gen=0;M1.phase=0;M1.selected=false;M1.surv=1;M1.hist0=histM1();M1.history=[{gen:0,p:freqM1(),surv:1,mean:meanShade()}];M1.birds=[];}
function shade(i){let s=0;for(let k=0;k<8;k++)s+=M1.G[i*8+k];return clamp(s/8+M1.acq[i]+(hash(i+M1.gen*0.37)-0.5)*0.06,0,1);}
function freqM1(){let s=0;for(let i=0;i<M1.G.length;i++)s+=M1.G[i];return s/M1.G.length;}
function meanShade(){let s=0;for(let i=0;i<M1.N;i++)s+=shade(i);return s/M1.N;}
function histM1(){const b=new Array(20).fill(0);for(let i=0;i<M1.N;i++){b[Math.min(19,Math.floor(shade(i)*20))]++;}return b.map(v=>v/M1.N);}
function selectM1(){const s=+$('#sS').value;let al=0;for(let i=0;i<M1.N;i++){const c=Math.abs(shade(i)-bgAt(M1.pos[i]));const surv=1-s*clamp(c*1.6,0,1);M1.alive[i]=Math.random()<surv?1:0;al+=M1.alive[i];}
  if(al<2){M1.alive[0]=1;M1.alive[1]=1;al=2;}M1.surv=al/M1.N;M1.selected=true;
  M1.birds=[];const n=Math.min(SLOTS,M1.N);for(let k=0;k<n;k++){const i=slotIdx(k);if(!M1.alive[i])M1.birds.push({k,i,t:0.1+Math.random()*0.75,side:Math.random()<0.5?-1:1});}}
function reproduceM1(){const N=getN(),old=M1,mu=+$('#uS').value,m=+$('#mS').value/100;const surv=[];for(let i=0;i<old.N;i++)if(old.alive[i])surv.push(i);
  const G=new Uint8Array(N*8),pos=new Float32Array(N),acq=new Float32Array(N);
  for(let j=0;j<N;j++){if(Math.random()<m){for(let k=0;k<8;k++)G[j*8+k]=Math.random()<0.5?1:0;pos[j]=Math.random();continue;}
    const a=surv[Math.floor(Math.random()*surv.length)],b=surv[Math.floor(Math.random()*surv.length)];
    for(let l=0;l<4;l++){let x=old.G[a*8+l*2+(Math.random()<0.5?0:1)],y=old.G[b*8+l*2+(Math.random()<0.5?0:1)];if(Math.random()<mu)x^=1;if(Math.random()<mu)y^=1;G[j*8+l*2]=x;G[j*8+l*2+1]=y;}
    pos[j]=Math.random();
    if(!S.darwin){const pa=(old.acq[a]+old.acq[b])/2;const target=(bgAt(old.pos[a])+bgAt(old.pos[b]))/2;let gs=0;for(let k=0;k<8;k++)gs+=G[j*8+k];acq[j]=clamp(pa+0.3*(target-(gs/8+pa)),-1,1);}}
  M1.N=N;M1.G=G;M1.pos=pos;M1.acq=acq;M1.alive=new Uint8Array(N).fill(1);M1.gen++;M1.selected=false;M1.phase=0;
  M1.history.push({gen:M1.gen,p:freqM1(),surv:M1.surv,mean:meanShade()});if(M1.history.length>200)M1.history.shift();}
function slotIdx(k){return M1.N>SLOTS?Math.floor(k*M1.N/SLOTS):k;}
function stepM1(){if(!M1.selected)selectM1();reproduceM1();}

/* ================= MODE 2 : HARDY-WEINBERG & DRIFT ================= */
const LINES=6,LCOL=['#f87171','#fbbf24','#4ade80','#60a5fa','#c084fc','#f472b6'];
const M2={};
function initM2(){const p0=+$('#p0').value;M2.gen=0;M2.lines=Array.from({length:LINES},()=>[p0]);M2.det=[p0];M2.events=[];M2.Ncur=getN();M2.recover=0;M2.obs=null;sampleObs();}
function nextP(p,N,stoch){const s=+$('#sS').value,mu=+$('#uS').value,m=+$('#mS').value/100,qm=+$('#qm').value,F=+$('#fS').value;let q=1-p;
  const fAA=p*p+F*p*q,fAa=2*p*q*(1-F),faa=q*q+F*p*q;q=(fAa/2+faa*(1-s))/(1-s*faa);
  q=q+mu*(1-q);q=(1-m)*q+m*qm;if(stoch){q=binom(2*N,q)/(2*N);}return 1-clamp(q,0,1);}
function stepM2(){if(M2.gen>=500){S.running=false;return;}const N=M2.Ncur;M2.lines.forEach(l=>l.push(nextP(l[l.length-1],N,true)));M2.det.push(nextP(M2.det[M2.det.length-1],1e9,false));M2.gen++;
  if(M2.recover>0){M2.recover--;M2.Ncur=Math.round(lerp(M2.Ncur,getN(),0.35));if(M2.recover===0)M2.Ncur=getN();}else M2.Ncur=getN();sampleObs();}
function sampleObs(){const p=M2.lines[0][M2.lines[0].length-1],q=1-p,F=+$('#fS').value,N=Math.max(10,M2.Ncur);const e=[p*p+F*p*q,2*p*q*(1-F),q*q+F*p*q];let o=[0,0,0];
  const n=Math.min(N,5000);for(let i=0;i<n;i++){const u=Math.random();o[u<e[0]?0:u<e[0]+e[1]?1:2]++;}M2.obs={o,n,p};}
function eventM2(type){if(type==='bott'){M2.Ncur=10;M2.recover=8;M2.events.push({g:M2.gen,t:'Bottleneck'});}
  else{const base=M2.lines[0][M2.lines[0].length-1];M2.lines=M2.lines.map((l,i)=>{const nl=l.slice();nl[nl.length-1]=binom(20,base)/20;return nl;});M2.Ncur=10;M2.recover=10;M2.events.push({g:M2.gen,t:'Founder'});}}

/* ================= MODE 3 : SPECIATION ================= */
const L3=16;const M3={};
function sideOf(x){return x<0.5?0:1;}
function opt(x){return $('#envDiff').checked?(x<0.5?0.22:0.78):0.5;}
function initM3(){const N=clamp(getN(),100,600);M3.ind=[];for(let i=0;i<N;i++){const g=new Float32Array(L3);for(let k=0;k<L3;k++)g[k]=0.5+gauss()*0.04;M3.ind.push({x:Math.random(),y:Math.random(),vx:0,vy:0,g,pl:2});}
  M3.gen=0;M3.hist=[{d:0,iso:0}];M3.spec=false;M3.acc=0;}
const ecoT=a=>{let s=0;for(let k=8;k<16;k++)s+=a.g[k];return s/8;};
const songT=a=>{let s=0;for(let k=0;k<8;k++)s+=a.g[k];return 0.5*s/8+0.5*ecoT(a);};
function gdist(a,b){let s=0;for(let k=0;k<L3;k++)s+=Math.abs(a.g[k]-b.g[k]);return s/L3;}
function mateOK(a,b){if(a.pl!==b.pl)return 0;const ds=songT(a)-songT(b);return Math.exp(-((ds/0.13)**2));}
function viab(a,b){if(a.pl!==b.pl)return 0;const d=gdist(a,b);return Math.exp(-((d/0.3)**2));}
function blocked(){return $('#barrier').value!=='none';}
function stepM3(){const s=+$('#sS').value,mu=+$('#uS').value,m=+$('#mS').value/100,N=clamp(getN(),100,600);
  const surv=M3.ind.filter(a=>{const e=ecoT(a),o=opt(a.x);const f=Math.exp(-((e-o)**2)/(2*0.12*0.12));return Math.random()<1-s*0.8*(1-f);});
  const groups=blocked()?[0,1].map(sd=>{const sv=surv.filter(a=>sideOf(a.x)===sd);return{pool:sv.length>3?sv:M3.ind.filter(a=>sideOf(a.x)===sd),n:N/2};}):[{pool:surv.length>4?surv:M3.ind,n:N}];
  const sub=[];for(const grp of groups){const p4=grp.pool.filter(c=>c.pl===4);if(!p4.length){sub.push(grp);continue;}

function m3Metrics(){const Lf=M3.ind.filter(a=>a.x<0.5&&a.pl===2),Rt=M3.ind.filter(a=>a.x>=0.5&&a.pl===2);if(!Lf.length||!Rt.length)return{d:0,iso:0,nL:Lf.length,nR:Rt.length,eL:0,eR:0};

let SEQ={},DM=null,UP=null;
function buildSeqs(){let seed=42;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const walk=(node,seq)=>{let s=seq.split('');for(let i=0;i<(node.m||0);i++){const p=Math.floor(rnd()*s.length);let a;do{a=AA[Math.floor(rnd()*20)];}while(a===s[p]);s[p]=a;}s=s.join('');if(node.l)SEQ[node.l]=s;(node.c||[]).forEach(ch=>walk(ch,s));};
  walk(TREE,HUMAN_CYTC);const ref=SEQ['มนุษย์'];
  // shift so that human = real human cytochrome c sequence
  for(const k in SEQ){let s='';for(let i=0;i<ref.length;i++)s+=SEQ[k][i]===ref[i]?HUMAN_CYTC[i]:SEQ[k][i];SEQ[k]=s;}
  DM=SPP.map(a=>SPP.map(b=>pdiff(SEQ[a],SEQ[b])));UP=upgma();}
function pdiff(a,b){let d=0;for(let i=0;i<a.length;i++)if(a[i]!==b[i])d++;return d/a.length*100;}
function upgma(){let cl=SPP.map((s,i)=>({name:s,size:1,h:0,leaves:[i]}));const D=(a,b)=>{let s=0;a.leaves.forEach(i=>b.leaves.forEach(j=>s+=DM[i][j]));return s/(a.leaves.length*b.leaves.length);};
  while(cl.length>1){let bi=0,bj=1,bd=1e9;for(let i=0;i<cl.length;i++)for(let j=i+1;j<cl.length;j++){const d=D(cl[i],cl[j]);if(d<bd){bd=d;bi=i;bj=j;}}
    const n={a:cl[bi],b:cl[bj],h:bd/2,leaves:cl[bi].leaves.concat(cl[bj].leaves)};cl=cl.filter((_,k)=>k!==bi&&k!==bj);cl.push(n);}return cl[0];}
