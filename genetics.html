<style>

<script>
'use strict';
const $=(id)=>document.getElementById(id);
function defaults(){return{
  mode:1, sub:'incomplete', playing:true, t:0, showTheory:true,
  cross:'mono', p1:'Aa', p2:'Aa', nSlider:35, obs:null,
  mom:'RW', dad:'RW', abo1:'AO', abo2:'BO',
  momX:'Bb', dadX:'BY', polyM:3, polyF:3, rec:12, total:100,
  caseId:0, picks:{}, selected:-1, verdict:'',
  p:0.6, N:200, selection:0, mu:0, history:[0.6], pop:[]
};}
let state=defaults();
const MONO=['AA','Aa','aa'];
const DI=['AABB','AaBb','aabb','AAbb','aaBB','AaBB','AABb','Aabb','aaBb'];
const CASES=[
  {title:'ออโตโซมด้อย', hint:'พ่อแม่ปกติที่มีลูกเป็นโรค มักเป็น Aa', people:[
    {sex:'m',aff:0,ok:['Aa'],x:.18,y:.22},{sex:'f',aff:0,ok:['Aa'],x:.38,y:.22},
    {sex:'m',aff:1,ok:['aa'],x:.12,y:.58},{sex:'f',aff:0,ok:['AA','Aa'],x:.32,y:.58},{sex:'m',aff:0,ok:['AA','Aa'],x:.5,y:.58}
  ], mates:[[0,1]], kids:[2,3,4], parents:[0,1]},
  {title:'ออโตโซมเด่น', hint:'ผู้ไม่เป็นโรคคือ aa', people:[
    {sex:'m',aff:1,ok:['Aa'],x:.18,y:.22},{sex:'f',aff:0,ok:['aa'],x:.38,y:.22},
    {sex:'f',aff:1,ok:['Aa'],x:.16,y:.58},{sex:'m',aff:0,ok:['aa'],x:.36,y:.58},{sex:'f',aff:1,ok:['Aa'],x:.56,y:.58}
  ], mates:[[0,1]], kids:[2,3,4], parents:[0,1]},
  {title:'X-linked ด้อย', hint:'พ่อส่ง X ให้ลูกสาวทุกคน', people:[
    {sex:'m',aff:1,ok:['XbY'],x:.18,y:.22},{sex:'f',aff:0,ok:['XBXB'],x:.4,y:.22},
    {sex:'f',aff:0,ok:['XBXb'],x:.16,y:.58},{sex:'m',aff:0,ok:['XBY'],x:.36,y:.58},{sex:'f',aff:0,ok:['XBXb'],x:.56,y:.58}
  ], mates:[[0,1]], kids:[2,3,4], parents:[0,1]}
];
function num(n,d){return (isFinite(n)?n:0).toLocaleString('th-TH',{maximumFractionDigits:d,minimumFractionDigits:d});}
function gammaln(z){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let x=z,y=z,tmp=x+5.5;tmp-=(x+.5)*Math.log(tmp);let ser=1.000000000190015;for(let j=0;j<6;j++)ser+=c[j]/++y;return -tmp+Math.log(2.5066282746310005*ser/x);}
function gser(a,x){const gln=gammaln(a);let ap=a,sum=1/a,del=sum;for(let n=1;n<=80;n++){ap++;del*=x/ap;sum+=del;if(Math.abs(del)<Math.abs(sum)*1e-8)break;}return sum*Math.exp(-x+a*Math.log(x)-gln);}
function gcf(a,x){const gln=gammaln(a);let b=x+1-a,c=1/1e-30,d=1/b,h=d;for(let i=1;i<=80;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-30)d=1e-30;c=b+an/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<1e-8)break;}return Math.exp(-x+a*Math.log(x)-gln)*h;}
function chiP(x,df){if(df<=0)return 1;const a=df/2,xx=x/2;if(xx<=0)return 1;return xx<a+1?1-gser(a,xx):gcf(a,xx);}
function sampleN(){return Math.max(4, Math.round(4*Math.pow(10000/4, state.nSlider/100)));}
function gametesOf(g){
  if(g.length===2) return [g[0], g[1]];
  return [g[0]+g[2], g[0]+g[3], g[1]+g[2], g[1]+g[3]];
}
function combine(a,b){
  if(a.length===1) return [a,b].sort().join('');
  return [a[0],b[0]].sort().join('')+[a[1],b[1]].sort().join('');
}
function pheno(g){
  if(g.length===2) return g.includes('A')?'ลักษณะเด่น':'ลักษณะด้อย';
  const A=g[0]==='A'||g[1]==='A', B=g[2]==='B'||g[3]==='B';
  if(A&&B) return 'เด่นทั้งสอง'; if(A&&!B) return 'เด่นเฉพาะคู่แรก'; if(!A&&B) return 'เด่นเฉพาะคู่สอง'; return 'ด้อยทั้งสอง';
}
function probs(){
  const g1=gametesOf(state.p1), g2=gametesOf(state.p2), map={};
  g1.forEach(a=>g2.forEach(b=>{const p=pheno(combine(a,b)); map[p]=(map[p]||0)+1/(g1.length*g2.length);}));
  return map;
}
function runCross(){
  const g1=gametesOf(state.p1), g2=gametesOf(state.p2), N=sampleN(), obs={};
  for(let i=0;i<N;i++){
    const a=g1[Math.floor(Math.random()*g1.length)];
    const b=g2[Math.floor(Math.random()*g2.length)];
    const p=pheno(combine(a,b)); obs[p]=(obs[p]||0)+1;
  }
  state.obs=obs;
}
function chiOf(){
  if(!state.obs) return null;
  const pr=probs(), N=sampleN(); let chi=0, k=0, low=false;
  Object.keys(pr).forEach(p=>{const e=pr[p]*N; const o=state.obs[p]||0; if(e<5) low=true; chi+=(o-e)*(o-e)/e; k++;});
  const df=k-1, p=chiP(chi,df);
  return {chi,df,p,low};
}
function aboGam(g){return [g[0], g[1]];}
function aboPheno(a,b){
  const s=[a,b].sort().join('');
  if(s.includes('A')&&s.includes('B')) return 'AB';
  if(s.includes('A')) return 'A';
  if(s.includes('B')) return 'B';
  return 'O';
}
function aboProbs(){
  const m=aboGam(state.abo1), d=aboGam(state.abo2), map={};
  m.forEach(a=>d.forEach(b=>{const p=aboPheno(a,b); map[p]=(map[p]||0)+0.25;}));
  return map;
}
function sexKids(){
  const mom=state.momX, dad=state.dadX;
  const momA=[mom[0],mom[1]], dadA=dad[0];
  const kids=[];
  momA.forEach(m=>{
    kids.push({sex:'ลูกสาว', geno:'X'+m+'X'+dadA, pheno:(m==='b'&&dadA==='b')?'ตาบอดสี':'สายตาปกติ'});
    kids.push({sex:'ลูกชาย', geno:'X'+m+'Y', pheno:m==='b'?'ตาบอดสี':'สายตาปกติ'});
  });
  return kids;
}
function gauss(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function nextGen(){
  let p=state.p, q=1-p, u=state.mu;
  p=p*(1-u)+q*u; q=1-p;
  let AA=p*p, Aa=2*p*q, aa=q*q;
  const waa=1-state.selection/100;
  const wbar=AA+Aa+aa*waa || 1;
  AA/=wbar; Aa/=wbar; aa=aa*waa/wbar;
  p=Math.min(1,Math.max(0, AA+Aa/2));
  const se=Math.sqrt(Math.max(0,p*(1-p))/Math.max(2,state.N*2));
  p=Math.min(1,Math.max(0,p+se*gauss()));
  state.p=p; state.history.push(p); if(state.history.length>80) state.history.shift();
}
function renderControls(){
  const modes=[[1,'1. ตารางพันเนตต์'],[2,'2. นอกกฎเมนเดล'],[3,'3. พงศาวลี'],[4,'4. ฮาร์ดี-ไวน์เบิร์ก']];
  $('modes').innerHTML=modes.map(([id,n])=>`<button class="mode ${state.mode===id?'on':''}" data-act="mode" data-v="${id}">${n}</button>`).join('');
  const subs=state.mode===2?[['incomplete','ข่มไม่สมบูรณ์'],['abo','หมู่เลือด ABO'],['sex','ตาบอดสี'],['poly','พอลียีน'],['link','ยีนโยงกัน']]:[];
  $('subs').innerHTML=subs.map(([id,n])=>`<button class="sub ${state.sub===id?'on':''}" data-act="sub" data-v="${id}">${n}</button>`).join('');
  let html='';
  if(state.mode===1){
    const opts=state.cross==='mono'?MONO:DI;
    if(!opts.includes(state.p1)) state.p1=opts[1];
    if(!opts.includes(state.p2)) state.p2=opts[1];
    html+=`<div class="row"><button class="switch ${state.cross==='mono'?'on':''}" data-act="cross" data-v="mono">ลักษณะเดียว</button><button class="switch ${state.cross==='di'?'on':''}" data-act="cross" data-v="di">สองลักษณะ</button></div>
      <label>พ่อ/ต้นที่ 1<span></span><select data-key="p1">${opts.map(g=>`<option ${state.p1===g?'selected':''}>${g}</option>`).join('')}</select></label>
      <label>แม่/ต้นที่ 2<span></span><select data-key="p2">${opts.map(g=>`<option ${state.p2===g?'selected':''}>${g}</option>`).join('')}</select></label>
      <label>ขนาดตัวอย่าง (สเกลลอการิทึม) <span data-for="nSlider">${sampleN().toLocaleString('th-TH')} ตัว</span><input data-key="nSlider" type="range" min="0" max="100" value="${state.nSlider}"></label>
      <div class="row"><button class="btn" data-act="breed">สุ่มลูก</button><button class="btn alt" data-act="testcross">ผสมทดสอบ</button></div>
      <button class="switch ${state.showTheory?'on':''}" data-act="theory" style="width:100%">${state.showTheory?'กำลังเน้นอัตราส่วนทฤษฎี':'กำลังเน้นผลสุ่มจริง'}</button>`;
  } else if(state.sub==='incomplete'){
    html+=`<label>ต้นที่ 1<span></span><select data-key="mom">${['RR','RW','WW'].map(g=>`<option ${state.mom===g?'selected':''}>${g}</option>`).join('')}</select></label>
      <label>ต้นที่ 2<span></span><select data-key="dad">${['RR','RW','WW'].map(g=>`<option ${state.dad===g?'selected':''}>${g}</option>`).join('')}</select></label>`;
  } else if(state.sub==='abo'){
    html+=`<label>พ่อ<span></span><select data-key="abo1">${['AA','AO','BB','BO','AB','OO'].map(g=>`<option ${state.abo1===g?'selected':''}>${g}</option>`).join('')}</select></label>
      <label>แม่<span></span><select data-key="abo2">${['AA','AO','BB','BO','AB','OO'].map(g=>`<option ${state.abo2===g?'selected':''}>${g}</option>`).join('')}</select></label>`;
  } else if(state.sub==='sex'){

function fit(canvas){const r=canvas.getBoundingClientRect();const dpr=Math.min(2,devicePixelRatio||1);const w=Math.max(10,r.width),h=Math.max(10,r.height);const W=Math.floor(w*dpr),H=Math.floor(h*dpr);if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H;}const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx,w,h};}

  paper(ctx,w,h);
  const p=state.p;
  for(let i=0;i<48;i++){
    const raw=Math.sin(i*12.9898+p*78.233)*43758.5453;
    const r=raw-Math.floor(raw);
    const geno=r<p*p?'AA':r<p*p+2*p*q?'Aa':'aa';
    const col=geno==='AA'?'#2f7a4e':geno==='Aa'?'#66bb6a':'#dcedc8';
    const x=30+(i%8)*((w-40)/8), y=70+Math.floor(i/8)*70;
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y+Math.sin(state.t+i)*2,16,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle='#2f7a4e'; ctx.font='700 16px Leelawadee UI'; ctx.fillText('ตัวแทนประชากรตาม p = '+num(p,2),20,32);
}
function drawMain(){
  const {ctx,w,h}=fit($('cv'));
  if(state.mode===1) drawPunnett(ctx,w,h);
  else if(state.mode===3) drawPed(ctx,w,h);
  else if(state.mode===4) drawHW(ctx,w,h);
  else if(state.sub==='incomplete') drawFlowers(ctx,w,h);
  else if(state.sub==='abo') drawBlood(ctx,w,h);
  else if(state.sub==='sex') drawSex(ctx,w,h);
  else if(state.sub==='poly') drawPoly(ctx,w,h);
  else drawLink(ctx,w,h);
}
function drawGraph(){
  const {ctx,w,h}=fit($('graph')); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
  const pad={l:32,r:8,t:16,b:24}, iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  ctx.strokeStyle='#e7b7cc'; ctx.beginPath(); ctx.moveTo(pad.l,pad.t); ctx.lineTo(pad.l,pad.t+ih); ctx.lineTo(pad.l+iw,pad.t+ih); ctx.stroke();
  if(state.mode===1){
    const pr=probs(); const keys=Object.keys(pr); const N=sampleN();
    keys.forEach((k,i)=>{
      const x=pad.l+i*(iw/keys.length)+6;
      const th=pr[k], ob=state.obs?(state.obs[k]||0)/N:0;
      ctx.fillStyle=state.showTheory?'#7dcea0':'#c5e1a5'; ctx.fillRect(x, pad.t+ih-th*ih, 12, th*ih);
      ctx.fillStyle=state.showTheory?'#c5e1a5':'#2f7a4e'; ctx.fillRect(x+14, pad.t+ih-ob*ih, 12, ob*ih);
    });
  } else if(state.mode===4){
    const hs=state.history; ctx.beginPath(); ctx.strokeStyle='#7dcea0'; ctx.lineWidth=2;
    hs.forEach((p,i)=>{const X=pad.l+i/Math.max(1,hs.length-1)*iw, Y=pad.t+ih-p*ih; if(i===0)ctx.moveTo(X,Y); else ctx.lineTo(X,Y);});
    ctx.stroke();
  } else if(state.sub==='poly'){
    for(let i=0;i<=6;i++){ const x=pad.l+i/6*iw; const weight=Math.exp(-Math.pow(i-(state.polyM+state.polyF)/2,2)/2); ctx.fillStyle='#7dcea0'; ctx.fillRect(x, pad.t+ih-weight*(ih-8), 10, weight*(ih-8)); }
  } else {
    ctx.fillStyle='#4e6a5c'; ctx.font='13px Leelawadee UI'; ctx.fillText('กราฟเปรียบเทียบอยู่ในการทดลองพันเนตต์และฮาร์ดี-ไวน์เบิร์ก', pad.l, 40);
  }
}
function setKey(t){ if(!t.dataset||!t.dataset.key) return; const key=t.dataset.key; let v=t.type==='range'?parseFloat(t.value):t.value; if(key==='caseId') v=+v; state[key]=v; if(key==='caseId'){ state.selected=-1; state.verdict=''; } if(key==='p'){ state.history=[state.p]; } const lab=document.querySelector(`[data-for="${key}"]`); if(lab) lab.textContent = key==='nSlider'? sampleN().toLocaleString('th-TH')+' ตัว' : key==='p'||key==='mu'? num(state[key], key==='mu'?3:2) : key==='N'? state.N.toLocaleString('th-TH') : state[key]+(key==='selection'?'%':key==='polyM'||key==='polyF'?' / 6':''); if(['p1','p2','cross','mom','dad','abo1','abo2','momX','dadX','caseId'].includes(key)) { if(key==='p1'||key==='p2') state.obs=null; renderControls(); } side(); }
document.addEventListener('input',e=>setKey(e.target));
document.addEventListener('change',e=>setKey(e.target));
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b){
    const act=b.dataset.act, v=b.dataset.v;
    if(act==='mode'){ state.mode=+v; renderControls(); side(); }
    if(act==='sub'){ state.sub=v; renderControls(); side(); }
    if(act==='play'){ state.playing=!state.playing; renderControls(); }
    if(act==='reset'){ const m=state.mode,s=state.sub; state=defaults(); state.mode=m; state.sub=s; renderControls(); side(); }
    if(act==='cross'){ state.cross=v; const opts=v==='mono'?MONO:DI; state.p1=opts[1]; state.p2=opts[1]; state.obs=null; renderControls(); side(); }
    if(act==='breed'){ runCross(); side(); }
    if(act==='testcross'){ state.p2=state.cross==='mono'?'aa':'aabb'; state.obs=null; renderControls(); side(); }
    if(act==='theory'){ state.showTheory=!state.showTheory; renderControls(); side(); }
    if(act==='setg'){ state.picks[state.caseId+'-'+state.selected]=v; side(); }
    if(act==='checkped'){
      const c=CASES[state.caseId];
      const ok=c.people.every((p,i)=>p.ok.includes(state.picks[state.caseId+'-'+i]));
      state.verdict=ok?'สอดคล้องกับพงศาวลี':'ยังไม่ครบหรือยังไม่ตรง'; side();
    }
    if(act==='gen'){ nextGen(); side(); }
    if(act==='gen20'){ for(let i=0;i<20;i++) nextGen(); side(); }
    return;
  }
  if(e.target.id==='cv' && state.mode===3){
    const r=e.target.getBoundingClientRect();
    const x=e.clientX-r.left, y=e.clientY-r.top;
    const hit=hits.find(h=>Math.hypot(h.x-x,h.y-y)<h.r+6);
    if(hit){ state.selected=hit.i; renderControls(); side(); }
  }
});
let last=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000||0); last=now; if(state.playing) state.t+=dt; drawMain(); drawGraph(); requestAnimationFrame(loop);}
renderControls(); runCross(); side(); requestAnimationFrame(loop);
document.documentElement.dataset.ready='genetics';
</script>
